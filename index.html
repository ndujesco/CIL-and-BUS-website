 on enhancing products, services, processes, and systems to consistently meet or exceed customer expectations and organizational objectives. CQI emphasizes the principles of continuous learning, adaptation, and incremental improvement to drive innovation, efficiency, and effectiveness. Here's an overview of Continuous Quality Improvement:<\/p><ol><li>Key Principles:<\/li><\/ol><ul><li>Customer Focus: CQI begins with understanding customer needs, expectations, and feedback. Customer satisfaction is a primary driver for improvement efforts.<\/li><li>Data-Driven Decision Making: CQI relies on data and evidence to identify areas for improvement, measure performance, and monitor progress towards quality goals.<\/li><li>Employee Involvement: Employees at all levels are actively involved in CQI initiatives, contributing ideas, expertise, and feedback to drive improvement.<\/li><li>Process Orientation: CQI focuses on optimizing processes and workflows to eliminate waste, reduce variation, and enhance efficiency and effectiveness.<\/li><li>Continuous Learning: CQI encourages a culture of continuous learning, experimentation, and adaptation to foster innovation and resilience.<\/li><\/ul><ol><li>Key Components:<\/li><\/ol><ul><li>Plan-Do-Study-Act (PDSA) Cycle: The PDSA cycle is a fundamental framework for CQI. It involves planning a change, implementing it on a small scale, studying the results, and acting on what was learned to make further improvements.<\/li><li>Root Cause Analysis (RCA): RCA is a systematic process for identifying underlying causes of problems or issues to prevent recurrence. It helps organizations address the root causes of quality deficiencies.<\/li><li>Quality Metrics and Measurement: CQI relies on establishing key quality metrics and performance indicators to monitor progress, track trends, and evaluate the effectiveness of improvement initiatives.<\/li><li>Benchmarking: Benchmarking involves comparing organizational performance and practices against industry leaders or best-in-class organizations to identify opportunities for improvement and set targets for excellence.<\/li><\/ul><ol><li>Implementation Process:<\/li><\/ol><ul><li>Identify Opportunities for Improvement: Organizations identify areas for improvement based on customer feedback, data analysis, performance metrics, and stakeholder input.<\/li><li>Plan Improvement Initiatives: Improvement initiatives are planned, prioritized, and scoped to define objectives, timelines, resources, and success criteria.<\/li><li>Implement Changes: Changes are implemented gradually, often through pilot projects or small-scale experiments to test effectiveness and minimize risks.<\/li><li>Monitor and Evaluate Results: Performance metrics are monitored to assess the impact of changes and determine whether objectives are being met.<\/li><li>Adjust and Iterate: Based on evaluation results, adjustments are made to improvement strategies, and the cycle of planning, implementation, evaluation, and adjustment continues iteratively.<\/li><\/ul><ol><li>Benefits:<\/li><\/ol><ul><li>CQI helps organizations achieve higher levels of customer satisfaction, loyalty, and retention by consistently delivering high-quality products and services.<\/li><li>It drives operational efficiency, cost savings, and waste reduction through process optimization and innovation.<\/li><li>CQI fosters a culture of employee engagement, empowerment, and accountability, leading to higher morale, productivity, and retention.<\/li><li>It enhances organizational agility and adaptability by promoting continuous learning, innovation, and responsiveness to changing market conditions.<\/li><\/ul>", "toc": [{"id": "bus-block-3-9", "t": "Topic 1: DEFINITION, PRINCIPLES AND TECHNIQUES OF TOTAL QUALITY MANAGEMENT (TQM)", "lv": 2}, {"id": "bus-block-3-10", "t": "Definition", "lv": 3}, {"id": "bus-block-3-11", "t": "Principles of TQM", "lv": 3}, {"id": "bus-block-3-12", "t": "TQM Techniques/Tools", "lv": 3}, {"id": "bus-block-3-13", "t": "Topic 2: SCOPE AND PURPOSE OF QUALITY MANAGEMENT", "lv": 2}, {"id": "bus-block-3-14", "t": "Process and Product Quality", "lv": 3}, {"id": "bus-block-3-15", "t": "Ways to Improve Process and Product Quality", "lv": 3}, {"id": "bus-block-3-16", "t": "1. Define quality goals", "lv": 3}, {"id": "bus-block-3-17", "t": "2. Analyze Current Performance", "lv": 3}, {"id": "bus-block-3-18", "t": "3. Implement Improvement Actions", "lv": 3}, {"id": "bus-block-3-19", "t": "4. Evaluate Results and Feedback", "lv": 3}, {"id": "bus-block-3-20", "t": "5. Sustain and Standardize Improvements", "lv": 3}, {"id": "bus-block-3-21", "t": "6. Learn and Innovate for Excellence", "lv": 3}, {"id": "bus-block-3-22", "t": "Quality Assurance and Standards", "lv": 3}, {"id": "bus-block-3-23", "t": "Standards in TQM", "lv": 3}, {"id": "bus-block-3-24", "t": "Topic 3: Developing a Strategic Plan for Total Quality Management", "lv": 2}, {"id": "bus-block-3-25", "t": "Benefits of Total Quality Management", "lv": 3}, {"id": "bus-block-3-26", "t": "Topic 4: TQM BEST PRACTICES", "lv": 2}, {"id": "bus-block-3-27", "t": "Problems Associated with TQM", "lv": 3}, {"id": "bus-block-3-28", "t": "Quality Management Process", "lv": 3}, {"id": "bus-block-3-29", "t": "Concepts of Customer Value in TQM", "lv": 3}, {"id": "bus-block-3-30", "t": "TOPIC 5: EMERGING TENDENCIES TOWARD GLOBAL COMPETITIVENESS IN TQM", "lv": 3}, {"id": "bus-block-3-31", "t": "Six-Sigma Management in TQM", "lv": 3}, {"id": "bus-block-3-32", "t": "Some of the key tools used in Six Sigma include:", "lv": 3}, {"id": "bus-block-3-33", "t": "The Lean Principle in TQM", "lv": 3}, {"id": "bus-block-3-34", "t": "Benchmarking in TQM", "lv": 3}, {"id": "bus-block-3-35", "t": "Importance of “Benchmarking” in TQM", "lv": 3}, {"id": "bus-block-3-36", "t": "Topic 6: QUALITY CONTROL Quality Control Planning", "lv": 2}, {"id": "bus-block-3-37", "t": "Software Quality Control", "lv": 3}, {"id": "bus-block-3-38", "t": "Implementing Software Quality Control", "lv": 3}, {"id": "bus-block-3-39", "t": "Compromise in Quality Control", "lv": 3}, {"id": "bus-block-3-40", "t": "Total Quality Management versus Total Quality Control", "lv": 3}, {"id": "bus-block-3-41", "t": "Topic 7: QUALITY ASSURANCE AND STANDARDS", "lv": 2}, {"id": "bus-block-3-42", "t": "Process Based Quality and Practical Based Quality Approaches in Quality Assurance", "lv": 3}, {"id": "bus-block-3-43", "t": "1. Process-based Quality:", "lv": 3}, {"id": "bus-block-3-44", "t": "2. Practical-based Quality:", "lv": 3}, {"id": "bus-block-3-45", "t": "Importance of Process and Product Standards", "lv": 3}, {"id": "bus-block-3-46", "t": "Problems of standard", "lv": 3}, {"id": "bus-block-3-47", "t": "Topic 8: QUALITY ATTRIBUTES, QUALITY MEASURES AND QUALITY REVIEWS", "lv": 2}, {"id": "bus-block-3-48", "t": "Quality Attributes", "lv": 3}, {"id": "bus-block-3-49", "t": "Quality Measures", "lv": 3}, {"id": "bus-block-3-50", "t": "Quality Reviews", "lv": 3}, {"id": "bus-block-3-51", "t": "1. Purpose:", "lv": 3}, {"id": "bus-block-3-52", "t": "3. Participants:", "lv": 3}, {"id": "bus-block-3-53", "t": "4. Process:", "lv": 3}, {"id": "bus-block-3-54", "t": "5. Types of Reviews:", "lv": 3}, {"id": "bus-block-3-55", "t": "6. Benefits:", "lv": 3}, {"id": "bus-block-3-56", "t": "Continuous Quality Improvement", "lv": 3}]}]}, "bus-block-4": {"course": "BUS", "ref": "Block 4", "title": "Leadership, Managerial Skills and Organisations", "kicker": "Block 4 · Dr Abraham Osa Ehiorobo", "words": 3915, "parts": [{"label": "Managerial Roles, Skills and Types of Organizations", "note": "ABRAHAM OSA EHIOROBO, PH.D.", "src": "4.2 MANAGERIAL ROLES, SKILLS AND TYPES OF ORGANIZATIONS.pptx", "html": "<h3 id=\"bus-block-4-0\">MANAGERIAL ROLES BY HENRY MINTBERG<\/h3><ul><li><b>Managerial Roles<\/b><\/li><li>Henry Mintzberg, an internationally renowned author in management books, in his<\/li><li>research, identified and summarized these expected roles of managers as follows:<\/li><li>Interpersonal Role<\/li><li>Informational Role and<\/li><li>Decision Making Role<\/li><li><b>(1) Interpersonal Role:<\/b><\/li><li>A manager has a relationship with his subordinates, his organisation and people outside<\/li><li>the organisation some of which are ceremonial and symbolic in nature, so he is the<\/li><li>following:<\/li><li>a figurehead,<\/li><li>a leader and<\/li><li>a liaison officers<\/li><li>When a manager performs social obligations, such as receiving visitors and speaking at functions,<\/li><li>presenting his company’s products and services at functions, attending weddings of his<\/li><li>subordinates, or signing legal documents on behalf of his company, he is described <b>as a<\/b><\/li><li><b>figurehead<\/b>.<\/li><li>When he motivates his subordinates to go the extra mile and shows by example how dedicated he<\/li><li>is to his job so that they can follow his steps, he is described <b>as a leader<\/b>.<\/li><li>By maintaining a good network with the outside world, to know, and act promptly to changes in<\/li><li>policies, rules, and regulations from the government. All these he does by attending seminars and conferences he is described as <b>a liaison officer<\/b>.<\/li><li><b>(2) Informational Role<\/b><\/li><li>A manager collects, receives, and disseminates information within the organisation, so he is the following:<\/li><li>a monitor,<\/li><li>a disseminator, and<\/li><li>a spokesman.<\/li><li>He is <b>a monitor<\/b> when he constantly checks what is happening internally among his subordinates and top management. You might ask why? Because he collects and studies information from outside that could affect his company, he does all these by reading newspapers, reports, periodicals or by personal contacts.<\/li><li>He is <b>a disseminator<\/b> because he passes information about changes in policies and other issues to subordinates and other members of the organisation, You might also ask how he does this. He does this through telephone calls, memos, individual or group meetings, and messages. He is <b>a spokesman<\/b> when he represents his unit in either sending information or making the demand on their behalf to management through meetings or phone calls.<\/li><li><b>(3) Decision Making Role<\/b><\/li><li>A manager is a decision-maker because he had to decide from many alternative choices<\/li><li>facing the organisation, so he is the following:<\/li><li>as an entrepreneur,<\/li><li>disturbance handler,<\/li><li>a resource allocator and<\/li><li>a negotiator<\/li><li>as <b>an entrepreneur<\/b> -He must always search for new ideas to either improve or develop new products using suggestion boxes or meetings with research and development personnel<\/li><li><b>Disturbance handler<\/b> - He is always involved in solving differences among the employees and settling conflicts between employees and top management such as making demands on behalf of his subordinates for higher pay and an increase in benefits<\/li><li><b>He is a resource allocator<\/b><\/li><li>He prepares budgets for various requirements of his unit and makes sure that available funds are utilized properly.<\/li><li><b>A negotiator<\/b><\/li><li>He plays this role by negotiating contracts with unions, negotiating prices with customers and vendors or suppliers to get better deals for his company<\/li><li><b>He is a resource allocator<\/b><\/li><li>He prepares budgets for various requirements of his unit and makes sure that available funds are utilized properly.<\/li><li><b>A negotiator<\/b><\/li><li>He plays this role by negotiating contracts with unions, negotiating prices with customers and vendors or suppliers to get better deals for his company.<\/li><\/ul><h3 id=\"bus-block-4-1\">MANAGERIAL LEVELS<\/h3><ul><li><b>Management Levels<\/b><\/li><li>For you to perform the management functions effectively you will require an understanding of the various management levels as well as roles expected at the various levels of management and their relative importance in your organization. However, irrespective of your managerial levels you will also need to possess variety of skills that may come from your abilities, knowledge, practices and aptitude Organizations, particularly large organizations have many levels with different managers.<\/li><li>Basically, three levels of Management had been clearly identified, and they are:<\/li><li>Low level management<\/li><li>Middle level management<\/li><li>Top level management.<\/li><li><b>Low level management –<\/b><\/li><li>This consists of frontline mangers, otherwise known as operational mangers who supervise the organization ‘s operations. They are directly involved with non-management employees, implementing specific plans. They are the link between management and nonmanagement personnel, for example, supervisors, and sales Officers and so on<\/li><li><b>Middle level management –<\/b><\/li><li>This consists of Managers located in the middle layers of the organizational hierarchy below the top-level management and above the low-level management. They are otherwise known as tactical managers that are responsible for translating the general goals and plans of organizations in to specific objectives and activities. They are the linchpins of internal communication, interpreting and disseminating top management priorities downward and equally channeling and translating information from the low-level management upward. They provide creative ideas, operating skills and practical problem-solving skills that keep the organization working.<\/li><li><b>Top level management<\/b><\/li><li>This consists of senior executives of an organization who are responsible for its overall management. They are otherwise known as strategic managers. They provide leadership for the organization and focus on long-term issues, policy and strategy formulation, emphasize organization survival, growth, and organization’s overall effectiveness. They are concerned with the organization as well as its external environment, example of managers at this level are the chief executive officers (CEO) chief operating officers (COO), executive directors and members of the management team.<\/li><\/ul><h3 id=\"bus-block-4-2\">MANAGERIAL SKILLS<\/h3><ul><li>Managers at all levels of an organization need to plan, organize, lead and control. However, there are differences among managers based on the amount of time they devote to each of the activities. It may also be due to the kind of organization or type of job to be done.<\/li><li>The differences could also be dependent on the level of the manager in the organization’s hierarchy.<\/li><li>Managers need a variety of skills to carry-out their activities. Skills are specific abilities that result from knowledge, information, practice, and aptitude.<\/li><li>Robert. L. Katz (1974) identified three basic types of skills needed by all managers: Technical, Human, and Conceptual skills.<\/li><li><b>Technical Skills:<\/b><\/li><li>The ability to use tools, procedures, and techniques of a specialized field. The manager needs enough technical skills to accomplish the mechanics of a particular job. It is the ability to perform a specialized task involving particular method or process.<\/li><li><b>Human Relation Skills:<\/b><\/li><li>The ability to work with, understand, and motivate other people either as individuals or groups. It is the people skills that enable managers to communicate effectively with others because they spend most of their time interacting with people. Managers need more of human relations skills to work with other members of the organization or to head a group.<\/li><li><b>Conceptual Skills:<\/b><\/li><li>These are skills that relate to the ability to identify and resolve problems for the benefit of the organization and its members. It is the mental ability to coordinate and integrate all of the organization’s interests/ activities i.e. the ability to have an overview of the entire organization, how it works, and relationship between the parts, the various factors in a given situation and their interrelationship etc. This will enable the manager to take the best actions in the overall interest of the organization.<\/li><\/ul><h3 id=\"bus-block-4-3\">MANAGEMENT LEVELS, SKILLS AND THEIR RELATIONSHIPS<\/h3><ul><li>The importance of skills varies by managerial levels and roles in any organization.<\/li><li>All the above-mentioned skills are essential to effective management and their relative importance to a specific manager depends on his/her rank in the organization. For instance, technical skill is most important at lower levels of management but becomes less important as we move up the chain of command. An example could be a production supervisor whose technical skill is more important than that of a managing director/chief executive officer.<\/li><li>Conceptual skill increases as managers move up the rank. The higher a manager moves in the hierarchy, the more he/she will be involved in the broad, long–term decisions that affect the organization. For top management, conceptual skill is very important. Moreover, human skill is very important at every level of the organization, why? Because management is simply put ‘getting things done through other people’, managers interact more with people.<\/li><\/ul><h3 id=\"bus-block-4-4\">FORMS OF ORGANIZATIONS<\/h3><ul><li><b>Organisation<\/b> is the arrangement as to who should do what management and administration have decided upon.<\/li><li><b>Types/Forms of Organisation<\/b><\/li><li>There are three forms of organisation, namely:<\/li><li>line organisation,<\/li><li>functional organization,<\/li><li>line and staff organisation.<\/li><li><b>Line Organisation<\/b><\/li><li>This is also known as scalar organisation or military type of organisation. It is characterised<\/li><li>by direct lines of authority flowing from the top to the bottom of the organisational<\/li><li>hierarchy and lines of responsibility flowing in an opposite but equally direct manner. It is<\/li><li>characterised by superior subordinate relationship. A superior delegates authority to<\/li><li>another subordinate and so on, forming a line from the very top to the bottom of the<\/li><li>organisational structure. The line of authority so established is referred to as line authority.<\/li><li>Suitability of line organization structure is possible where:<\/li><li>Scale of operations is limited or for a small-scale business.<\/li><li>Work is simple and routine in nature.<\/li><li>Continuous production firms e.g., spinning, weaving etc.<\/li><li>Flexible labour management problems.<\/li><li><b>Advantages<\/b><\/li><li>Simple to establish – understood easily by employees.<\/li><li>Fixed responsibility – clearly defined duties and responsibility for each individual, thus eliminating confusion.<\/li><li>Discipline as a result of the unity of command.<\/li><li>Coordination – control of activities by one person.<\/li><li>Quick decision – a decision is taken by one person – the head.<\/li><li><b>Disadvantages<\/b><\/li><li>Overload – too many responsibilities for the executive<\/li><li>Lack of Specialisation – on account of many functions and complexities.<\/li><li>The executive may not be an expert in all aspects of managerial activities.<\/li><li>Lack of initiative – ultimate authority lies in the hands of top management.<\/li><li>This affects the initiatives of departmental heads and enthusiasm to motivate the subordinates.<\/li><li>Lack of communication from lower ranks since authority flows from top to down<\/li><li><b>Functional Organisation –<\/b><\/li><li>This means that the organisation should be based on various functions. This is based on the principle of specialisation and tries to bring about organisational balance.<\/li><li>Each worker, instead of encountering one superior, would receive his orders from a group of specialised supervisors each of whom performs a particular function.<\/li><li>Functional organisation also operates at higher levels of management. The whole work in the organisation is divided into various departments – Similar types of work and transactions are put in one department under the control of a departmental manager. The various departments include purchases, sales, finance, production, personnel etc.<\/li><li>The head of each department will be responsible for carrying out various activities of their departments in the organisation. At the top level of management is that a subordinate anywhere in the organisation will be controlled and commanded directly by numbers of managers operating in different departments.<\/li><li><b>Merits<\/b><\/li><li>Specialisation – As every head is an expert in his area.<\/li><li>Increased efficiency – As workers operate under the expert and competent personnel and perform limited operations.<\/li><li>Flexibility – Function as a whole can be cut by eliminating positions at the lower levels without seriously affecting its total performances.<\/li><li><b>Demerits<\/b><\/li><li>Conflict of authority – A violation of unity of command more than one boss over subordinates<\/li><li>Expensive – Multiplicity of experts makes it expensive.<\/li><li>Problems of coordination – There is delay in decision making as it requires involvement of more than one specialist.<\/li><li><b>The line and staff organization<\/b>.<\/li><li>It is an improvement on the above-mentioned two systems viz; line organization and functional organization. The line organization concentrates too much on control, whereas the functional system decentralizes it to a great extent. The line- staff balances the two.<\/li><li>In line-staff organization, line officers get the advice of the staff which is very helpful in carrying out the task in an efficient manner. It is advisory in nature where certain functions requiring skill and objectivity are required. The staff has the power to recommend and not to enforce them. Thus, the staff members are thinkers while the line officers are ‘doers. The staff members prepare plans while the line officers execute them.<\/li><li><b>Merits<\/b><\/li><li>Specialisation – It brings about utilisation of expert knowledge for the benefit of management.<\/li><li>Better Decisions – Staff specialists; help the line managers in taking better decisions by providing them with adequate information of the right type at the right time.<\/li><li>Lesser burden on line officers – The work of the line officers is considerably reduced with the help of staff officers.<\/li><li>Advancement of Research – Staff officers constantly undertake research and experimentation for improvement.<\/li><li><b>Demerits<\/b><\/li><li>Conflict between line and staff officers – where the advice of staff officers is not taken to the letter, and where line officers feel that correct advice is not given.<\/li><li>Problem of line and Staff Authority – who is superior in terms of relationship?<\/li><li>Lack of Responsibility – Staff specialists may not be held accountable for the outcome of wrong advice.<\/li><li>Expensive System – as experts are appointed.<\/li><\/ul><h3 id=\"bus-block-4-5\">INFORMAL ORGANIZATIONS<\/h3><ul><li>The various methods of structuring identified are formally established by management, hence they are formal organisations.<\/li><li>However, the social desires of persons find their expression in the informal structure.<\/li><li>Informal structuring can be defined as the grouping of people emerging unofficially and without being designated as parts of the organization. They are often found as cliques or sub-group within the formal organization.<\/li><li>The existence of an informal organization is to satisfy human needs in a way that formal organizations do not.<\/li><li>The functions of the informal organization include:<\/li><li>i. <i><b>Communication<\/b><\/i> – The need for information, both need for news and the need for prompt news. Enterprise in practice often circulates news slowly through the formal line, transmits it poorly, or even withholds certain information. The informal organization provides the channel or grape-vine for speedy communication with their members.<\/li><li>ii. <i><b>To perpetuate the culture of a group<\/b><\/i> – The establishment of norms or standard ways of doing things may differ from the formal way. For instance, a group may be unified in its desire to maintain a certain standard of education, discipline, or work outcome. The authority as an example may review tea time to 15 minutes but informal groups may agree for 20 minutes. If a given department employs engineers exclusively, an informal group may oppose the use of technicians for some of the jobs.<\/li><li>iii. <i><b>To acquire status<\/b><\/i> – The formal structuring may underrate an employee but through the informal group, he is recognized as a leader in a particular social event.<\/li><li>Since informal organiation can either aid or interfere with enterprise interest, the<\/li><li>Management cannot afford to disregard informal organisation because:<\/li><li>It brings cohesiveness to formal organisation members. A feeling of status and self-respect and satisfaction is attained.<\/li><li>It fills the gap in the formal structure – those things that the official structure cannot accomplish are met.<\/li><li>It is a breeding ground for future leaders.<\/li><li>It is a useful channel of employee communication.<\/li><li>Force managers to be better managers.<\/li><li>Improves productivity of workers since they are more satisfied.<\/li><li>As a result of all these the activities of informal organisation should be directed into<\/li><li>constructive channels, rather than discouraging or killing it.<\/li><li>The lifespan of an informal organisation can be as short as minutes and can be last for years. A leader just emerged without any formal election and the leadership is not permanent depending on the acceptability of the leadership.<\/li><li>Once leaders of informal groups are identified and their cooperation gained. organising and<\/li><li>directing become easier. Managers use the informal organisation as channels of<\/li><li>communication, and molders of employee morale.<\/li><li><b>Limitations of Informal Organisation<\/b><\/li><li>The following limitations are identified with the informal organisation:<\/li><li>It may lead to a violation of official rules.<\/li><li>Lack of uniformity in the application of official relationships.<\/li><li>It may lead to multiple leadership.<\/li><li>Information could be negatively filtered.<\/li><\/ul>", "toc": [{"id": "bus-block-4-0", "t": "MANAGERIAL ROLES BY HENRY MINTBERG", "lv": 3}, {"id": "bus-block-4-1", "t": "MANAGERIAL LEVELS", "lv": 3}, {"id": "bus-block-4-2", "t": "MANAGERIAL SKILLS", "lv": 3}, {"id": "bus-block-4-3", "t": "MANAGEMENT LEVELS, SKILLS AND THEIR RELATIONSHIPS", "lv": 3}, {"id": "bus-block-4-4", "t": "FORMS OF ORGANIZATIONS", "lv": 3}, {"id": "bus-block-4-5", "t": "INFORMAL ORGANIZATIONS", "lv": 3}]}, {"label": "Leadership, Trust and Managing Communication", "note": "ABRAHAM OSA EHIOROBO, PH.D. 09098760201.", "src": "4.1 LEADERSHIP, TRUST AND MANAGING COMMUNICATION.pptx", "html": "<h3 id=\"bus-block-4-6\">LEADERSHIP<\/h3><ul><li>Leadership in management is the ability to influence, inspire, and guide individuals or teams toward achieving organizational goals. It involves setting a strategic vision, motivating employees, making critical decisions, and fostering a collaborative culture. Unlike management, which focuses on planning and control, leadership centers on empowering people to achieve, adapt, and succeed.<\/li><li><b>Leadership vs. Management<\/b>While often used interchangeably, these terms have distinct nuances within an organization:<\/li><li>Management is generally associated with planning, organizing, budgeting and controlling processes.<\/li><li>Leadership is more about setting direction, motivating and driving change.<\/li><li>Effective managers must combine both leadership and managerial skills to succeed.<\/li><\/ul><h3 id=\"bus-block-4-7\">Here are five essential leadership qualities:<\/h3><ul><li><b>Integrity &amp; Accountability:<\/b><\/li><li>Being honest, ethical, and taking responsibility for actions builds trust and respect, setting a strong moral compass for the team.<\/li><li><b>Effective Communication:<\/b><\/li><li>Leaders must clearly articulate vision, provide feedback, listen actively, and create an open environment where team members feel comfortable sharing ideas.<\/li><li><b>Vision &amp; Purpose:<\/b><\/li><li>A good leader inspires by having a clear sense of direction, a compelling future vision, and the ability to motivate others towards achieving it.<\/li><li><b>Empathy &amp; Emotional Intelligence:<\/b><\/li><li>Understanding and connecting with team members' emotions, showing compassion, and managing their own emotions helps build strong relationships and a supportive culture.<\/li><li><b>Adaptability &amp; Resilience:<\/b><\/li><li>In dynamic environments, leaders need to be flexible, embrace change, learn from setbacks, and remain positive and encouraging through challenges.<\/li><\/ul><h3 id=\"bus-block-4-8\">Here are seven functions a leader needs to perform<\/h3><ul><li>Setting goals. ...<\/li><li>Organising. ...<\/li><li>Take initiatives. ...<\/li><li>Cooperation among employees. ...<\/li><li>Motivation and direction. ...<\/li><li>Liaison between workers and management. ...<\/li><li>Policy making.<\/li><\/ul><h3 id=\"bus-block-4-9\">LEADERSHIP AND TRUST<\/h3><p>Leadership and trust in management are foundational to organizational success, driving employee engagement, collaboration, and performance. Trust is built through integrity, competence, consistency, and empathy, where leaders act ethically, demonstrate capability, deliver on promises, and show genuine care for employees. A high-trust environment encourages open communication and better results.<\/p><h3 id=\"bus-block-4-10\">Key Pillars of Trust in Leadership<\/h3><ul><li><b>Integrity:<\/b> Acting with honesty, fairness, and ethical behavior.<\/li><li><b>Competence:<\/b> Demonstrating the knowledge, skills, and ability to lead effectively.<\/li><li><b>Consistency:<\/b> Ensuring actions align with words and maintaining reliability.<\/li><li><b>Connection/Empathy:<\/b> Showing care for employees and building strong relationships.<\/li><li><b>Openness:<\/b> Communicating transparently and encouraging two-way dialogue.<\/li><\/ul><h3 id=\"bus-block-4-11\">Building and Maintaining Trust<\/h3><ul><li><b>Be Transparent:<\/b> Share the reasoning behind decisions and admit when information is lacking.<\/li><li><b>Empowerment:<\/b> Delegate, trust team members, and support them when errors occur.<\/li><li><b>Visibility:<\/b> Engage in face-to-face meetings to foster connection.<\/li><li><b>Action-Oriented:<\/b> Consistently follow through on commitments.<\/li><li><b>Impact of Trust<\/b><\/li><li><b>Increased Performance:<\/b> High-trust environments foster better results, speed, and innovation.<\/li><li><b>Loyalty and Retention:<\/b> Employees are more likely to stay with leaders who are honest and supportive.<\/li><li><b>Reduced Risk:<\/b> Trust allows teams to take risks, support each other, and adapt to change.<\/li><\/ul><h3 id=\"bus-block-4-12\">MANAGING COMMUNICATION<\/h3><ul><li>Communication management is the structured planning, execution, monitoring, and control of all communication activities within an organization, team, or project. It ensures that the right messages reach the right audience through the right channels at the right time, keeping everyone aligned and informed.<\/li><li>The 7Cs of communication represent clarity, conciseness, correctness, completeness, courtesy, concreteness, and consideration. Together, these principles of effective communication form a foundation for expressing ideas efficiently and professionally<\/li><\/ul><h3 id=\"bus-block-4-13\">MANAGING COMMUNICATION, KNOWLEDGE AND INFORMATION<\/h3><p>Managing communication, knowledge, and information involves systematically capturing, storing, sharing, and utilizing data to improve decision-making, foster collaboration, and enhance organizational efficiency. It combines structured knowledge management (databases, repositories) with strategic communication (tailored messages, active feedback) to ensure the right information reaches the right audience at the right time.<\/p><h3 id=\"bus-block-4-14\">Key aspects of communication and information management<\/h3><ul><li><b>Information Flow:<\/b> Using, creating, distributing, and manipulating information via ICT tools such as phones, internet, and software<\/li><li><b>Knowledge Management (KM):<\/b> Identifying and organizing internal expertise, such as lessons learned and data repositories to ensure it is accessible.<\/li><li><b>Communication Strategy:<\/b> Adapting styles, using visual aids (charts, infographics), and utilizing storytelling to make complex data engaging.<\/li><li><b>Tools &amp; Techniques:<\/b> Employing knowledge management systems (KMS) for data retrieval, project management information systems, and active listening for feedback<\/li><li><b>Sources of Information:<\/b> Utilizing primary sources like customer feedback and secondary sources like industry news and social media.<\/li><\/ul><h3 id=\"bus-block-4-15\">BENEFITS OF COMMUNICATION AND INFORMATION MANAGEMENT<\/h3><ul><li><b>Improved Decision-Making:<\/b> Facilitates better, faster decisions by providing relevant information to stakeholders.<\/li><li><b>Enhanced Performance:<\/b> Promotes learning and accountability within organizations.<\/li><li><b>Efficiency:<\/b> Reduces downtime and boosts productivity through better documentation and knowledge sharing.<\/li><\/ul>", "toc": [{"id": "bus-block-4-6", "t": "LEADERSHIP", "lv": 3}, {"id": "bus-block-4-7", "t": "Here are five essential leadership qualities:", "lv": 3}, {"id": "bus-block-4-8", "t": "Here are seven functions a leader needs to perform", "lv": 3}, {"id": "bus-block-4-9", "t": "LEADERSHIP AND TRUST", "lv": 3}, {"id": "bus-block-4-10", "t": "Key Pillars of Trust in Leadership", "lv": 3}, {"id": "bus-block-4-11", "t": "Building and Maintaining Trust", "lv": 3}, {"id": "bus-block-4-12", "t": "MANAGING COMMUNICATION", "lv": 3}, {"id": "bus-block-4-13", "t": "MANAGING COMMUNICATION, KNOWLEDGE AND INFORMATION", "lv": 3}, {"id": "bus-block-4-14", "t": "Key aspects of communication and information management", "lv": 3}, {"id": "bus-block-4-15", "t": "BENEFITS OF COMMUNICATION AND INFORMATION MANAGEMENT", "lv": 3}]}, {"label": "Managing Communication and Information", "note": "ABRAHAM OSA EHIOROBO, PH.D.", "src": "4.3 MANAGING COMMUNICATION AND INFORMATION.pptx", "html": "<h3 id=\"bus-block-4-16\">LEADERSHIP AND TRUST<\/h3><ul><li>Leadership is an influence process that involves motivating and inspiring people to work together to achieve a common goal.<\/li><li>OBLIGATIONS OF LEADERSHIP<\/li><li>Developing and Communicating a clear vision<\/li><li>Motivating and inspiring team members<\/li><li>Setting clear expectations<\/li><li>Making informed decisions<\/li><li>Fosters commitment and accountability<\/li><li>Fosters a positive work environment<\/li><li>Delegates tasks<\/li><li>Coaching team members<\/li><li>Conflict resolution<\/li><\/ul><h3 id=\"bus-block-4-17\">TRUST IN LEADERSHIP<\/h3><ul><li>Trust in leadership is important because it helps people feel secure and confident in their organization. It can lead to better collaboration, engagement and success.<\/li><li>HOW TRUST IS BUILT<\/li><li>COMPETENCE: You must possess necessary skills and expertise<\/li><li>COMMUNICATION: Communicate clearly for mutual understanding<\/li><li>COMMITMENT: Being committed to the goals and overall success of the organization<\/li><li>CARING: A leader must show that he truly cares about others<\/li><li>CHARACTER: The leader must reflect ethical and honest behaviour.<\/li><\/ul><h3 id=\"bus-block-4-18\">INTRODUCTION TO COMMUNICATION<\/h3><ul><li>Everybody communicates in one way or the other, but few people deliver their messages as well as they can.<\/li><li>Good communication is the lifeblood of organizations. It takes many forms, such as speaking, writing, and listening, though, its purpose is always to convey a message to recipients. Thus, it can be used to handle information and improve relationships.<\/li><li>EFFECTIVE COMMUNICATION: Effective communication hinges on people understanding your meaning, and replying in terms that move the exchange forward.<\/li><li>Communication is a two-way process between a sender and a receiver.<\/li><\/ul><h3 id=\"bus-block-4-19\">COMMUNICATION<\/h3><ul><li>ACHIEVING CLARITY: The three rules that govern good communication include:<\/li><li>Be clear in your own mind about what you want to communicate.<\/li><li>Deliver the message succinctly<\/li><li>Ensure that the message has been clearly and correctly understood.<\/li><li>Good communication means saying what you mean and fully comprehending any feedback.<\/li><\/ul><h3 id=\"bus-block-4-20\">TYPES OF COMMUNICATION<\/h3><ul><li>WRITTEN WORDS: Written words are basic to literate societies. The words could be in any language or media. They include letters, memos, reports, notes, proposals, notices, contracts and documents.<\/li><li>SPOKEN WORDS: This form of communication is only effective only when it is heard by the right people. Examples include conversations, interviews, meetings, phone calls, debates, speeches and announcements.<\/li><li>SYMBOLIC GESTURES: Any positive or negative behaviour that can be seen or heard by the intended audience. They include gestures, facial expressions, actions, deeds, tone of voice, silence, posture, movement, absence, presence.<\/li><li>VISUAL IMAGES: Images that can be perceived by a target group. They include photographs, paintings, illustrations, graphics, drawings, slides, prints, cartoons, charts, graphs, videos, logos, films, and color schemes.<\/li><li>MULTIMEDIA: A combination of the various methods described in visual images. They include television, newspapers, radio, videos, flyers, posters, internet CD-ROMs.<\/li><\/ul><h3 id=\"bus-block-4-21\">MANAGING INFORMATION<\/h3><ul><li>Human beings spend most of their time delivering and receiving messages in person. Honesty and feedback are both essential for good information management.<\/li><li>FINDING INFORMATION: The employees of an organization need to obtain information and the ability of managers to provide all types of information in the right way are crucial elements in any organization.<\/li><li>Start by finding out which areas people most want to know about. Job security, working conditions, reward, location and other benefits are all important to employees.<\/li><\/ul><h3 id=\"bus-block-4-22\">GIVING FEEDBACK<\/h3><ul><li>Feedback is essential to communication –to check that you have understood the other person’s message, and to react to what they have said and done.<\/li><li>It can be difficult to give negative feedback but it has to be given when it is the only thing to do<\/li><li>When giving negative feedback, follow these simple rules to avoid antagonism.<\/li><li>1. Show an understanding of exactly what went wrong, and why.<\/li><li>2. Draw out ways in which poor performance or behaviour can improve<\/li><li>3. Use questions rather than assertions to let the person know what you mean.<\/li><li>4. Aim to express your negative opinions honestly, but in a positive manner.<\/li><li>5. Be objective and avoid being emotional or personal.<\/li><\/ul>", "toc": [{"id": "bus-block-4-16", "t": "LEADERSHIP AND TRUST", "lv": 3}, {"id": "bus-block-4-17", "t": "TRUST IN LEADERSHIP", "lv": 3}, {"id": "bus-block-4-18", "t": "INTRODUCTION TO COMMUNICATION", "lv": 3}, {"id": "bus-block-4-19", "t": "COMMUNICATION", "lv": 3}, {"id": "bus-block-4-20", "t": "TYPES OF COMMUNICATION", "lv": 3}, {"id": "bus-block-4-21", "t": "MANAGING INFORMATION", "lv": 3}, {"id": "bus-block-4-22", "t": "GIVING FEEDBACK", "lv": 3}]}]}, "bus-block-5": {"course": "BUS", "ref": "Block 5", "title": "Quality Control and Statistical Process Control", "kicker": "Block 5 · Dr O. P. Olonade", "words": 1504, "parts": [{"label": "Lecture 2: Quality Control", "note": "L2 — June 22, 2026 · Dr. Olonade", "src": "5.1 Lecture 2 - 22nd June (transcript).md", "html": "<h4>Page 1<\/h4><p>ISO 9000 — Fundamentals ISO 9001 — Requirements<\/p><p><b>Quality Control<\/b> is the set of procedures organisations use to assess the suitability, effectiveness and conditions of their products and services. It involves techniques, activities and actions designed to guide processes and eliminate potential deviations.<\/p><p>Effective quality control is essential to a business['] overall performance. It increases customer satisfaction, operational efficiency and continuous improvements while reducing long-term cost.<\/p><p>The goal of quality control is to prevent, identify and control errors or defects — ideally during production, before the product reaches the end customer or enters another manufacturing stage. To achieve this, companies conduct a series of checks: from design stage, lab testing and simulations to pre-production material inspection. Also, …<\/p><h4>Page 2<\/h4><p>… QC may be defined as a system that is used to maintain a desired level of quality in a product or service. It is a systematic control of various factors that affect the quality of the products. It depends on materials, tools, machines, type of labour, working condition, etc.<\/p><h3 id=\"bus-block-5-0\">Objectives of Quality Control<\/h3><ol><li>To improve the company's income by making the production more acceptable to the customers.<\/li><li>To reduce company's cost through reduction of losses due to defects.<\/li><li>To achieve interchangeability and manufacture of large scale production.<\/li><li>To produce optimal quality at reduced price.<\/li><li>To ensure satisfaction of customers with production of services or high quality level, to meet customer goodwill, confidence and reputation of the manufacturer.<\/li><li>To make inspection prompt to ensure quality control.<\/li><li>To check the variation during manufacturing.<\/li><\/ol><h4>Page 3<\/h4><h3 id=\"bus-block-5-1\">Steps in Quality Control<\/h3><ol><li>Formulate quality policy.<\/li><li>Set the standards or specification on the basis of customer preference, cost and profit.<\/li><li>Select inspection plan and set up procedure for checking.<\/li><li>Detect deviations from set standard of specification.<\/li><li>Take corrective actions or necessary changes to achieve the standards.<\/li><li>Decide on salvage method, i.e. to decide how the defective parts are disposed of — entirely scrapped or reworked.<\/li><li>Coordination of quality problems.<\/li><li>Developing quality consciousness both within and outside the organisation.<\/li><li>Developing procedures for good vendor–vendee relations.<\/li><\/ol><h4>Page 4<\/h4><h3 id=\"bus-block-5-2\">Benefits of Quality Control<\/h3><ol><li>Improving the quality of products and services.<\/li><li>Increasing the productivity of manufacturing processes, commercial business and corporations.<\/li><li>Reducing manufacturing and corporate costs.<\/li><li>Determining and improving the marketability of products and services.<\/li><li>Reducing customer prices of products and services.<\/li><li>Improving and/or assuring on-time deliveries and availability.<\/li><li>Assisting in the management of the enterprise.<\/li><\/ol><h3 id=\"bus-block-5-3\">Quality Control Tools<\/h3><ol><li><b>Check Sheets:<\/b> These are simple forms with certain formats that can aid the user to record data in a firm, systematic[ally]. Data are collected and interpreted on the check sheet to record the frequency of specific events during a data collection period.<\/li><\/ol><h4>Page 5<\/h4><ol><li><b>Histogram:<\/b> This is very useful to describe a series of the frequency distribution of observed values of a variable. It is a type of bar chart that visualises both attribute and variable data of a product or process; also assists users to show the distribution of data and the amount of variation within a process.<\/li><li><b>Pareto Analysis:<\/b> This is a special type of histogram that can easily be applied to find and prioritise quality problems, conditions, or their cause.<\/li><li><b>Fishbone:<\/b> It is also known as the cause and effect diagram, developed by Ishikawa in 1943. This is a problem solving tool that investigates and analyses systematically all the potential or real causes that results in a single effect. On the other hand, it is an effective tool that equips the organisation['s] management to explore the possible causes of a problem.<\/li><li><b>Scatter Diagram:<\/b> This is a powerful tool to draw the distribution of information in 2D, which helps to detect and analyse the pattern relationship b/w two quality and …<\/li><\/ol><h4>Page 6<\/h4><p>… compliance variables.<\/p><ol><li><b>Flowchart:<\/b> Presents a diagrammatic picture that indicates a series of symbols to describe the sequence of steps existing in an operation or processes. On the other hand, a flowchart visualises a picture b/w the inputs, activities, decision points and output for using and understanding easily concerning the overall objective [of the] true process.<\/li><li><b>Control Chart:<\/b> Can be utilized for estimating the parameters and the variability in a process. The main aim in a control chart is to prevent the defects in the process.<\/li><\/ol><h3 id=\"bus-block-5-4\">Illustration / Example<\/h3><table><tr><th>Batch no.<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><\/tr><tr><td>Sample size<\/td><td>10<\/td><td>8<\/td><td>12<\/td><td>9<\/td><td>15<\/td><td>11<\/td><td>10<\/td><\/tr><\/table><p>i) Construct an X̄-Chart ii) Is the process of production under control? iii) What is our advice?<\/p><p><b>X̄-Chart:  X̄ ± 3σ<\/b><\/p><h4>Page 7<\/h4><p>X̄ = (10 + 8 + 12 + 9 + 15 + 11 + 10) / 7 = 75 / 7 = <b>10.71<\/b><\/p><p>σ = √{ [(10−10.71)² + (8−10.71)² + (12−10.71)² + (9−10.71)² + (15−10.71)² + (11−10.71)² + (10−10.71)²] / 7 } = <b>2.12<\/b><\/p><p>X̄ + 3σ = 10.71 + 3(2.12) = <b>17.07<\/b> X̄ − 3σ = 10.71 − 3(2.12) = <b>4.35<\/b><\/p><pre>UCL ├──────────────────────  17.07     (\\\\\\\\ = poor quality)\nCL  ├──────────────────────  10.71     (◯   = good quality)\nLCL ├──────────────────────   4.35\n    └──────────────────────<\/pre><p>Legend: <code>\\\\\\\\<\/code> — Poor Quality;  <code>◯<\/code> — Good Quality<\/p><h4>Page 8<\/h4><p><b>R̄-Chart (with range):  X̄ ± A₂R̄<\/b><\/p><p><b>R̄-Chart (without range):<\/b> UCL = D₄R̄ LCL = D₃R̄<\/p><p>A₂ = 0.58 D₃ = 0 D₄ = 2.11<\/p><table><tr><th>Sample<\/th><th>X̄<\/th><th>Range<\/th><\/tr><tr><td>1<\/td><td>7.0<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>7.5<\/td><td>3<\/td><\/tr><tr><td>3<\/td><td>8.0<\/td><td>2<\/td><\/tr><tr><td>4<\/td><td>10<\/td><td>2<\/td><\/tr><tr><td>5<\/td><td>9.5<\/td><td>3<\/td><\/tr><tr><td>6<\/td><td>11<\/td><td>4<\/td><\/tr><tr><td>7<\/td><td>11.5<\/td><td>3<\/td><\/tr><tr><td>8<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>9<\/td><td>3.5<\/td><td>3<\/td><\/tr><tr><td>10<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td><b>Σ<\/b><\/td><td><b>ΣX̄ = 76<\/b><\/td><td><b>ΣRange = 26<\/b><\/td><\/tr><\/table><p>i) Construct a range chart with mean ii) Construct a range chart without mean<\/p><h4>Page 9<\/h4><p>X̄̄ = 76 / 10 = <b>7.6<\/b>     R̄ = 26 / 10 = <b>2.6<\/b><\/p><p><b>i)  X̄̄ ± A₂R̄<\/b> 7.6 + 0.58(2.6) = <b>9.108<\/b> 7.6 − 0.58(2.6) = <b>6.092<\/b><\/p><pre>UCL ├──────────────────────  9.108\nCL  ├──────────────────────  7.6\nLCL ├──────────────────────  6.092\n    └──────────────────────<\/pre><p><b>ii) Without Range<\/b> UCL = D₄R̄ = 2.11(2.6) = <b>5.486<\/b> LCL = D₃R̄ = 0(2.6) = <b>0<\/b><\/p><pre>UCL ├──────────────────────  5.486\nLCL ├──────────────────────  0\n    └──────────────────────<\/pre>", "toc": [{"id": "bus-block-5-0", "t": "Objectives of Quality Control", "lv": 3}, {"id": "bus-block-5-1", "t": "Steps in Quality Control", "lv": 3}, {"id": "bus-block-5-2", "t": "Benefits of Quality Control", "lv": 3}, {"id": "bus-block-5-3", "t": "Quality Control Tools", "lv": 3}, {"id": "bus-block-5-4", "t": "Illustration / Example", "lv": 3}]}, {"label": "Lecture 3: Project Evaluation & Statistical Process Control", "note": "", "src": "5.2 Lecture 3 (transcript).md", "html": "<h4>Page 1<\/h4><h3 id=\"bus-block-5-5\">Project Evaluation<\/h3><p><b>Traditional Method of Project Evaluation<\/b><\/p><ol><li>Payback Period<\/li><li>Accounting Rate of Return<\/li><\/ol><p><b>Scientific Method of Project Evaluation<\/b><\/p><ol><li>Net Present Value (NPV)<\/li><li>Internal Rate of Return (IRR)<\/li><li>Profitability Index (PI)<\/li><\/ol><p><b>Example 1 — Payback Period<\/b><\/p><p>A project needs ₦40,000 as initial investment, and it will generate an annual cash flow of ₦10,000 for 10 years.<\/p><p>PBP = Initial Investment / Annual Cash Flow = ₦40,000 / ₦10,000 = <b>4 years<\/b>   (Is it feasible? Yes)<\/p><p><b>Example 2<\/b><\/p><p>Project A has an initial investment of ₦700,000 and a projected cash flow of ₦225,000 for 5 years.<\/p><h4>Page 2<\/h4><h3 id=\"bus-block-5-6\">Statistical Process Control<\/h3><p>Statistical Process Control is defined as the use of statistical techniques to control the process or production method. Statistical process control tools are procedures that help monitor process behaviour, discover issues in internal systems and find solutions for production issues. <b>Statistical Quality Control<\/b> is often used interchangeably. Statistical Quality Control uses a data-driven approach to improve quality by eliminating unusual variations in the process being analysed.<\/p><p>These variations can be caused by many factors including human error, machine error or environmental factors. SQC can be used to monitor manufacturing processes, assembly lines, service operations and even office work.<\/p><h3 id=\"bus-block-5-7\">Types of Variations<\/h3><p>There are two types of variation that can occur in any process:<\/p><p>a) Common Cause Variation b) Special Cause Variation<\/p><h4>Page 3<\/h4><p><b>a) Common Cause Variation<\/b> is caused by factors that are inherent to the process being monitored. These factors can include the type of materials being used, the equipment used, the environment or the natural variations that occur when humans are involved in the process.<\/p><p>It is important to note that any process is bound to have a certain level of inherent variability. This is due to the fact that variation is a natural phenomenon. Thus, it is impossible to eliminate all sources of variability. Common cause variation takes this inherent variability into account and aims to keep it within acceptable limits.<\/p><p>For example, if the overall design of a product is causing various quality control issues that are not due to any specific individual or machine.<\/p><p>Another example would be if the workers assembling a product are not working at their full potential due to the design of their workstation.<\/p><p>In both cases, the root cause of the variation is not due to any specific event or individual; rather it is due to the inherent design of the process.<\/p><h4>Page 4<\/h4><p><b>b) Special Cause Variation:<\/b> This is caused by factors that are not inherent to the process being monitored, or a specific event or issue. These factors can include human error, machine error or outside influences, such as a series of extreme weather events. Special cause variation is usually easier to identify and eliminate.<\/p><p>For example, if the specific machine is not functioning properly and is causing specific defects in a product.<\/p><p>Another example is if a single worker is not following the proper procedures, therefore causing extremely significant difference in large numbers of products.<\/p><p>In both of these cases, the root cause of the variation is due to a specific event or issue that can be identified and addressed.<\/p>", "toc": [{"id": "bus-block-5-5", "t": "Project Evaluation", "lv": 3}, {"id": "bus-block-5-6", "t": "Statistical Process Control", "lv": 3}, {"id": "bus-block-5-7", "t": "Types of Variations", "lv": 3}]}]}, "bus-block-6": {"course": "BUS", "ref": "Block 6", "title": "Project Management", "kicker": "Block 6 · Miss Mary Isaac", "words": 3964, "parts": [{"label": "Project Management", "note": "Stages, components, evaluation, appraisal and control", "src": "6.1 BUS440(1).pptx", "html": "<h3 id=\"bus-block-6-0\">What Project entails<\/h3><ul><li>A project is an undertaking that involves sequence of tasks that must be completed at a specific period of time to attain a certain outcome. Examples are construction of road, building an aircraft, developing new medicine for cancer treatment etc.<\/li><li>Project differs from other organizational routine operations<\/li><li>A lot of activities takes place whenever a project is being undertaken like in building project, there are activities like block making, building, plumbing work, roofing, plastering, painting etc<\/li><li>These activities are interrelated with some of them being done simultaneously while others are done one after another.<\/li><li>Whatever the nature of a project is, all projects have certain characteristics<\/li><\/ul><h3 id=\"bus-block-6-1\">Attributes/Characteristics of a project<\/h3><ul><li>1. all projects have a definite beginning and end point, that is start and finish time<\/li><li>2. they must have clearly defined aims, objectives or goals that should be SMART<\/li><li>it involves a set of activities that are related<\/li><li>4. it is unique and different from other routine activities in an organization<\/li><li>5. resources are allocated specifically to project in the form of project budget. The budget caters for payment of workers, equipment used, materials and other resources<\/li><li>6. it involves manpower (a team of people)<\/li><li>7. it involves risk and uncertainty<\/li><li>8. it is time consuming and has specific completion date. Large and complex projects have financial penalties when jobs are completed late.<\/li><li>9. it involves non-repetitive tasks<\/li><\/ul><h3 id=\"bus-block-6-2\">Classification of a project<\/h3><ul><li>1. Compliance / emergency project: this project is needed to meet regulatory regulations required to operate in a region. it is called ‘’must-do’’ project. It attract penalties if they are nor implemented. Example is rebuilding a factory destroyed by fire<\/li><li>2. Operational project: this is a project that is needed to support current operations. It is designed to improve efficiency of delivery systems, reduce product costs and improve performance. Example is total quality management project<\/li><li>3. Strategic project: this is a project that directly support the organization’s long-run mission. The project is direct towards increasing revenue or market shares. Example are new products, research and development.<\/li><\/ul><h3 id=\"bus-block-6-3\">What is management?<\/h3><ul><li>Management is defined as the process of planning, organizing, directing and controlling of organizational resources (man, material, machine, money, information, idea) in order to effectively and efficiently achieve organizational goals and objectives.<\/li><li>It is also the act of getting things done through people (Mary Parket Follet)<\/li><\/ul><h3 id=\"bus-block-6-4\">Project Management<\/h3><ul><li>Project management is defined as the process of planning, organizing, directing and controlling of resources to meet technical, cost and time constraint of a project.<\/li><li>The goal of project management is to ensure that the objectives of project are achieved on time and as budgeted for<\/li><\/ul><h3 id=\"bus-block-6-5\">Objective of Project Management<\/h3><ul><li>1. to determine the cost and duration of the project<\/li><li>2. to determine the level of resources which will be needed<\/li><li>3. to assist in allocating work and monitor progress (for accountability)<\/li><li>4. to help reduce or eliminate the associated risk or uncertainty<\/li><li>5. to effectively and efficiently utilize the available resources<\/li><\/ul><h3 id=\"bus-block-6-6\">Project Life Cycle<\/h3><ul><li>The life cycle of a project is in five phases:<\/li><li>1.Initiation phase: is a phase that comprises activities associated with starting the project such as kick-off meeting, identifing project team, developing resources, getting infrastructure. This phase is crucial in determining if the project is viable. The project scope, objectives and deliverables are defined here.<\/li><li>2. Planning phase: is a phase for organizing and making preparation on how the project will be executed. A detailed resource guideline is developed at this phase<\/li><li>3. Execution phase: this is the stage where all work is being carried out for successful completion of the project as major activities and tasks are taken up<\/li><li>4. Monitoring and control: this phase is executed to ensure the project is on track and and meets its objectives. Where issues arises, corective actions are taken<\/li><li>5. Close-out phase: this is the phase where the project is closed by archiving documents, turning over project results to clients, closing offices.<\/li><\/ul><h3 id=\"bus-block-6-7\">Stages of Project Management<\/h3><ul><li>The stages of project management are<\/li><li>1. project planning<\/li><li>2. project schedulling<\/li><li>3. project controlling<\/li><\/ul><h3 id=\"bus-block-6-8\">Components of Project Management<\/h3><ul><li>1. Objective of the project: This is a detailed statement of what is to be accomplished in the project, how it may achieve the company’s goal and meet its strategic plans and also provide estimate of <b>time<\/b> that it should be completed, the <b>cost<\/b> as well as the expected <b>returns<\/b>. An objective is achieved when there is effective planning, organizing and controlling of various activities<\/li><li>Project Scope: This specifies all work that must be done to satisfy the customer. It defines the boundary of a project, outlines goals, deliverables, tasks, cost and deadlines. It can also include <b>justification<\/b> for the project and what constitutes project success<\/li><li>3. Contract requirement: it is a general structure of managerial, reporting and performance responsibility which includes detailed list of staff, suppliers, sub-contractors, managerial requirement and agreement, reporting requirement and a projected organization structure<\/li><li>4. Schedules: it is a list of all <b>major event<\/b> and <b>activities<\/b> that must be performed from start to finish from which a master schedule is developed<\/li><li>5. Resources: this is the overall project budget for all resource requirement and the procedure for budget rate control<\/li><li>6. Personnel: comprises the project team; labour, managers, supervisors etc. that execute the project<\/li><li>7. Control: This is a procedure for monitoring and evaluating progress and performance of a project<\/li><li>8. Deliverables: these are tangible or intangible product or items to be provided or delivered at a specified time during a project or at the end of the project<\/li><li>9. Risk and problem analysis: this is the anticipated assessment of uncertainties, problems and potential difficulties that might increase the risk of the project’s completion, delay or failure of project thus threatening project success<\/li><\/ul><h3 id=\"bus-block-6-9\">Project Evaluation<\/h3><ul><li>Project evaluation is defined as the systematic assessment of the performance, effectiveness and outcome of a project against predetermined objective.<\/li><li>It helps determine whether a project is achieving its objectives. Evaluation spans through the life span of a project.<\/li><li>The first thing to consider is the baseline data ( a benchmark that measures a project’s progress against its original plan stated in the objective).<\/li><li>Both the baseline data and endline data are compared and evaluated to know the extent to which the objectives were achieved<\/li><li>it helps to know if a project should be continued, adjusted or discontinued<\/li><\/ul><h3 id=\"bus-block-6-10\">Project evaluation methods<\/h3><ul><li>There are two methods of evaluating a project<\/li><li>1. The traditional method: this is evaluated using the following approaches<\/li><li>A. payback period (PBP)<\/li><li>B. accounting rate of return (ARR)<\/li><li>2. The scientific method: this is evaluated using the following approaches<\/li><li>A. net present value (NPV)<\/li><li>B. internal rate of return (IRR)<\/li><li>Any method chosen or used can serve its purpose depending on the objective<\/li><li>Payback period: this measures the time it will take to recover the project investment or initial outlay.<\/li><li>It is the simplest and widely used model.<\/li><li>It is used to evaluate project that involve high uncertainty.<\/li><li>It can be used to eliminate unusually risky projects (those with lengthy payback periods). Shorter paybacks are desirable.<\/li><li>Though, it strongly emphasizes cashflows, a major limitation is that it ignores the time value of money and profitability<\/li><li>Accounting rate of return (ARR): this measures the profitability of an investment by comparing the average annual profit to the average investment.<\/li><li>where one project is involved, accept the project whose calculated ARR is higher than the company target, otherwise reject.<\/li><li>For two projects, it is recommended that the project with the highest ARR is accepted provided it is higher than the company or industry targeted ARR<\/li><li>Net present value (NPV): This is a measure used to determine the financial viability of a project by using the desired rate of return (discount rate) to compute the present value of all net cash inflows.<\/li><li>For single project, if the NPV is positive, the project is accepted and if the NPV is negative, the project is rejected.<\/li><li>For mutually exclusive projects, accept project with the highest positive NPV.<\/li><li>NPV results are more realistic than PBP because it considers time value of<\/li><li>money, cash flows and profitability<\/li><li>Internal rate of return (IRR): It measures the rate of discount at which the project total present value of return equals the total present value of investment. That is, the discounted rate at which the NPV of the project is zero.<\/li><li>For single project, accept project if the calculated IRR is higher than the company cost of capital, otherwise reject.<\/li><li>For mutually exclusive projects, accept project with the highest IRR provided it is higher than the company cost of capital.<\/li><\/ul><h3 id=\"bus-block-6-11\">Project Appraisal<\/h3><ul><li>Project appraisal is the process of analyzing the technical feasibility, economic viability, and potential impact of a proposed project<\/li><li>Project appraisal is defined as the process of critical examination and analysis of the project proposal in totality.<\/li><li>Appraisal is used to determine how feasible or viable a project is. Where several projects are being considered, appraisal helps determine which one to consider and which not to<\/li><\/ul><h3 id=\"bus-block-6-12\">Project Appraisal Process<\/h3><ul><li>Project appraisal include<\/li><li>1. Market appraisal: It focuses on demand projections, adequacy of marketing infrastructure and competence of the key marketing personnel. Factors to consider are – product specifications, pricing, channels of distribution, trade practices, threat of substitutes, domestic and international competition, opportunities for exports etc.<\/li><li>2. Technical appraisal: Technical feasibility analysis is the systematic gathering and analysis of the data pertaining to the technical inputs required. The availability of the raw materials, equipment, hard/software, power, sewerage services, transportation facility, skilled man power, engineering facilities, maintenance, local people etc., depending on the type of project are coming under technical analysis. It determines whether the technical parameters are soundly conceived, realistic and technically feasible.<\/li><li>3. Economic appraisal: this entails how far the project contributes to the development of the sector, industrial development, social development, maximizing the growth of employment, etc.<\/li><li>4. Financial appraisal: it examines the viability of the project from financial considerations and indicates the return on the investments. used to determine whether the financial costs and returns are properly estimated and whether the project is financially viable. Some of the commonly used techniques for financial analysis are as follows; profitability index, cost-benefit analysis, cash flow, NPV and IRR<\/li><li>5. Managerial appraisal: it focuses on promoters, organization structure, managerial personnel, and HR management.<\/li><li>6. Environmental appraisal: evaluates impact on land use and micro-environment, commitment of natural resources, and government policy. It is used to assess any detrimental environmental impacts and how to minimise the impacts. Environmental appraisal is concerned with the impact of environment on the project. It takes into consideration water, air, land, sound, geographical location etc.<\/li><\/ul><h3 id=\"bus-block-6-13\">Project Control<\/h3><ul><li>Project Control is the process of comparing actual project performance against planned objective to identify possible deviations, evaluate possible alternative courses of actions, and take appropriate corrective action.<\/li><li>Controlling is a responsibility to ensure the actions of the project team contribute toward the project goals; the project manager must establish standards for performance, measure performance and compare it with the established standards; detect variations and make the necessary corrections. This responsibility ensures that the project is on track.<\/li><li>The project control steps for measuring and evaluating project performance are:<\/li><li>1. Setting a baseline plan.<\/li><li>2. Measuring progress and performance.<\/li><li>3. Comparing result against actual plan.<\/li><li>4. Taking action (where deviation exist).<\/li><li><i><b>Setting a Baseline Plan<\/b><\/i><\/li><li>The baseline plan provides us with the elements for measuring performance. The baseline is derived from the cost and duration information found in the workbreakdown structure (WBS) database and time-sequence data from the network and resource scheduling decisions. From the WBS the project resource schedule is used to time-phase all work, resources, and budgets into a baseline plan.<\/li><li><i><b>Measuring Progress and Performance<\/b><\/i><\/li><li>Time and budgets are quantitative measures of performance that readily fit into the integrated information system. Qualitative measures such as meeting customer technical specifications and product function are most frequently determined by on-site inspection or actual use.<\/li><li>Measurement of time performance is done to reflect the critical path early, on schedule, or late; the slack<\/li><li>Measuring performance against budget (e.g., money, units in place, labor hours) Earned value is necessary to provide a realistic estimate of performance against a time-phased budget. <b>Earned value<\/b> (EV) is defined as the budgeted cost of the work performed.<\/li><li><i><b>Comparing Result against Actual Plan<\/b><\/i><\/li><li>Because plans seldom materialize as expected, it becomes imperative to measure deviations from plan to determine if action is necessary.<\/li><li>Periodic monitoring and measuring the status of the project allow for comparisons of actual versus expected plans. It is crucial that the timing of status reports be frequent enough to allow for early detection of variations from plan and early correction of causes.<\/li><li>Usually status reports should take place every <b>one to four weeks<\/b> to be useful and allow for <b>proactive<\/b> correction.<\/li><li><i><b>Taking Action<\/b><\/i><\/li><li>If deviations from plans are significant, corrective action will be needed to bring the project back in line with the original or revised plan. In some cases, conditions or scope can change, which, in turn, will require a change in the baseline plan to recognize new information.<\/li><\/ul><h3 id=\"bus-block-6-14\">Project Control Process<\/h3><ul><li>Project control process involves regularly gathering data on project performance, comparing actual performance to planned performance and taking corrective actions if actual performance is behind planned performance.<\/li><li>This process must occur regularly throughout the project. The shorter the reporting period, the better the chances of identifying problems early and taking effective corrective action<\/li><li>Steps in control process begins with establishing a baseline plan that shows how the project scope(tasks) will be accomplished on time (schedule) and within budget (resources, costs). Once the baseline plan is agreed upon by the customer and the contractor or project team, the project can start.<\/li><li>A regular reporting period should be established for comparing actual progress with planned progress. Reporting may be daily, weekly, biweekly or monthly depending on the complexity or overall duration of the project.<\/li><li>If a project is expected to have an overall duration of a month, the reporting period might be as short as a day. On the other hand, if a project is expected to run five years, the reporting period might be a month<\/li><li>During each reporting period, two kinds of data or information need to be collected<\/li><li>1. Data on actual performance: this includes:<\/li><li>A. the actual time that activities were started and finished<\/li><li>B. the actual costs expended and committed<\/li><li>2. Information on any changes to the project scope, schedule and budget: changes could be initiated by the customer or project team or could be as a result of an unanticipated occurrence such as natural disaster, labor strike or resignation of a key project team member<\/li><li>Once changes are incorporated into the plan and agreed on by the customer, a new baseline plan has to be established. The scope, schedule, and budget of the new baseline plan may be different from those of the original baseline plan<\/li><li>It is crucial that the data and information be collected in a timely manner and used to calculate an updated project schedule and budget.<\/li><\/ul>", "toc": [{"id": "bus-block-6-0", "t": "What Project entails", "lv": 3}, {"id": "bus-block-6-1", "t": "Attributes/Characteristics of a project", "lv": 3}, {"id": "bus-block-6-2", "t": "Classification of a project", "lv": 3}, {"id": "bus-block-6-3", "t": "What is management?", "lv": 3}, {"id": "bus-block-6-4", "t": "Project Management", "lv": 3}, {"id": "bus-block-6-5", "t": "Objective of Project Management", "lv": 3}, {"id": "bus-block-6-6", "t": "Project Life Cycle", "lv": 3}, {"id": "bus-block-6-7", "t": "Stages of Project Management", "lv": 3}, {"id": "bus-block-6-8", "t": "Components of Project Management", "lv": 3}, {"id": "bus-block-6-9", "t": "Project Evaluation", "lv": 3}, {"id": "bus-block-6-10", "t": "Project evaluation methods", "lv": 3}, {"id": "bus-block-6-11", "t": "Project Appraisal", "lv": 3}, {"id": "bus-block-6-12", "t": "Project Appraisal Process", "lv": 3}, {"id": "bus-block-6-13", "t": "Project Control", "lv": 3}, {"id": "bus-block-6-14", "t": "Project Control Process", "lv": 3}]}, {"label": "Lecture 1: Project Management", "note": "22nd May 2026", "src": "6.2 Lecture 1 - 22nd May (transcript).md", "html": "<h4>Page 1<\/h4><h3 id=\"bus-block-6-15\">Project Management<\/h3><p>A project is an undertaking that involves a sequence of tasks which must be completed at a specific period of time to ascertain a certain outcome.<\/p><p><b>Characteristics of a project<\/b><\/p><ol><li>All projects have beginning and end points.<\/li><li>The project must be clearly defined and have all the goals and aims.<\/li><li>It must involve sets of activities that are related.<\/li><li>The project has to [be] unique and different from other activities in an organization.<\/li><li>It involves manpower.<\/li><li>It involves risk and uncertainty.<\/li><li>It is time-consuming.<\/li><li>It involves non-repetitive tasks.<\/li><\/ol><p><b>Classification of a project<\/b><\/p><ol><li><b>Compliance or emergency projects:<\/b> They are called must-do projects because they are projects that must be taken up.<\/li><li><b>Operational projects:<\/b> These projects are needed to support current operations and are as well designed to improve the …<\/li><\/ol><h4>Page 2<\/h4><p>… efficiency of delivery systems, reduce product cost and improve performance, e.g. total quality management project.<\/p><ol><li><b>Strategic projects:<\/b> These projects directly support the organization's long run and are often directed towards improving the revenue or market shares of the organization.<\/li><\/ol><p><b>Management<\/b> can be defined as the process of planning, organizing, directing, and controlling of organizational resources. These resources could be in [the] form of man, material, information, machine, money, idea, etc., in order to effectively and efficiently achieve organizational goals and objectives.<\/p><p><b>Project management<\/b> can be defined as the process of planning, organizing, directing, and controlling of resources to meet technical, cost and time constraints of a project.<\/p><p><b>Objectives of project management<\/b><\/p><ol><li>To determine the cost and duration of a project.<\/li><li>To determine the level of resources that would be needed.<\/li><li>It assists in allocating work and monitoring progress.<\/li><\/ol><h4>Page 3<\/h4><ol><li>It helps to reduce or eliminate associated risks or uncertainties.<\/li><li>To effectively and efficiently utilize the available resources.<\/li><\/ol><p><b>Project Lifecycle<\/b><\/p><p>There are five stages:<\/p><ol><li><b>Initiation stage:<\/b> This is the starting point of the project.<\/li><li>Planning stage<\/li><li>Execution stage<\/li><li>Monitoring and control<\/li><li>Close out (closure)<\/li><\/ol><p><b>Stages of project management<\/b><\/p><ol><li>Project planning<\/li><li>Project scheduling<\/li><li>Project controlling<\/li><\/ol><ul><li><b>Project planning<\/b> provides details of work, resources and time needed to complete a project, as well as cost involved [and] the budget allocated to complete a project.<\/li><\/ul><p>Steps involved in project planning:<\/p><ol><li>Set up the objectives of the project.<\/li><li>List the various tasks or jobs that must be performed, which …<\/li><\/ol><h4>Page 4<\/h4><p>… will require developing a work breakdown structure.<\/p><ol><li>Estimate the cost and the weeks associated with the project.<\/li><li>Develop a budget for the resources.<\/li><li>Determine the duration of the project.<\/li><li>Develop a work-performance criteria.<\/li><\/ol><ul><li><b>Project scheduling<\/b> is the preparation of [a] timetable for implementing project activities and computing of resources required at different stages of the project. It also includes identifying critical tasks and resources so that the entire project proceeds in a logical manner according to precedence.<\/li><\/ul><p>Steps involved in project scheduling:<\/p><ol><li>Identify all the people involved in the tasks.<\/li><li>Estimate the duration of the project.<\/li><li>The critical parts of the project are established and give attention to them.<\/li><li>Specify the inter-relationships of each activity.<\/li><li>Develop a network diagram.<\/li><\/ol><ul><li><b>Project controlling<\/b> is the process of monitoring a project to ensure it progresses towards successful completion.<\/li><\/ul><p>Steps involved in project controlling:<\/p><h4>Page 5<\/h4><ol><li>Give periodical reports.<\/li><li>Review the report in relation to the project schedule.<\/li><li>Analyze the status of the project.<\/li><li>Take up managerial decisions.<\/li><\/ol><p><b>Components of project management<\/b><\/p><ol><li><b>Objectives of the project:<\/b> It is a detailed statement of what would be accomplished in a project and how it may achieve the goals and meet strategic plans. It also involves the estimation of time, cost, and returns.<\/li><li><b>Project scope:<\/b> A project scope defines the boundaries of a project. It outlines the tasks, goals, deliverables, costs. It specifies the work that needs to be done to complete a project.<\/li><li><b>Contract requirement:<\/b> It is a general structure of reporting and performance responsibility which involves detailed lists of staff, suppliers, subcontractors, managerial and reporting requirements, as well as a projected organizational structure.<\/li><li><b>Project schedule:<\/b> It is a timetable that specifies the list of all major events and activities which must be performed from the start to the finish.<\/li><\/ol><h4>Page 6<\/h4><ol><li><b>Resources:<\/b> It is the overall project budget for all resource requirements and procedures for budget rate control.<\/li><li><b>Personnel:<\/b><\/li><li><b>Control:<\/b> It is the procedure for monitoring and evaluating the progress and performance of a project.<\/li><li><b>Deliverables:<\/b> They are tangible or intangible products that are provided/delivered at a specified time during a project or at the end of a project.<\/li><li><b>Risk and problem analysis:<\/b> It is the anticipated assessment of uncertainties, problems and potential difficulties that might increase the risk of a project, its completion, cause delay or failure of a project.<\/li><\/ol><blockquote>★ Work breakdown structure may not contain the timelines for specific activities but Gantt chart does.<\/blockquote><h4>Page 7 — Diagram (red ink)<\/h4><p><b>Project planning / Project scheduling / Project control flow<\/b><\/p><pre>              Project planning\n                     |\n                 +-------+\n                 |  WBS  |\n                 +-------+\n     Project         |\n    scheduling       v\n     +-------------------+     +-----------------+\n     | Network of        |&lt;----| Deviations      |\n     | activities        |     | from plan       |\n     +-------------------+     +-----------------+\n                |                       ^\n                v                       |     Project\n     +-------------------+     +-----------------+  control\n     |    Gantt chart    |     | Actual tasks /  |\n     +-------------------+     | performance     |\n                |              | data            |\n                v              +-----------------+\n     +-------------------+              ^\n     | Scheduling /      |              |\n     | Application of    |     +-----------------+\n     | resources with    |     | Periodic Cost   |\n     | respect to time   |     | Reports         |\n     | and cost          |     +-----------------+\n     +-------------------+              ^\n                |                       |\n                +--&gt; Implementation ----+\n                        of Plan<\/pre><h4>Page 8 — Whiteboard photo<\/h4><p>Photograph of the lecture whiteboard reproducing the same diagram, titled <b>&quot;PROJECT MANAGEMENT — BUS 440&quot;<\/b>, with the same boxes: Project planning → WBS → Project scheduling → Network of Activities → Gantt chart → Scheduling/Application; and on the right, Project Control → Actual tasks/Performance data → Deviation from plan, Periodic Cost Reports → Implementation of Plan.<\/p><p>Partially visible at the left edge (from an earlier board): &quot;(ARR)&quot;, &quot;(IRR)&quot;, &quot;Initial Investment&quot;, &quot;Cash flow&qu
