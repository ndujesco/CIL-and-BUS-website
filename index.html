 3}, {"id": "cil-deck-1-6", "t": "Classification of Contracts", "lv": 3}, {"id": "cil-deck-1-7", "t": "Simple Contracts & Contracts Under Seal", "lv": 3}, {"id": "cil-deck-1-8", "t": "Express and Implied Contracts", "lv": 3}, {"id": "cil-deck-1-9", "t": "Bilateral and Unilateral Contracts", "lv": 3}, {"id": "cil-deck-1-10", "t": "Executed and Executory Contracts", "lv": 3}]}]}, "cil-deck-2": {"course": "CIL", "ref": "Slide 1.2", "title": "Formation of Contract", "kicker": "Lecture deck · Dr Ihuoma Ilobinso · 25 slides", "words": 2256, "parts": [{"label": "Offer, acceptance, consideration and intention", "note": "", "src": "1.2 Engineering Contract _FORMATION OF CONTRACT.pptx.pdf", "html": "<h3 id=\"cil-deck-2-0\">Elements of a Valid Contract<\/h3><ul><li>INTENTIONS TO<\/li><li>OFFER ACCEPTANCE CONSIDERATION CONTRACT<\/li><\/ul><h3 id=\"cil-deck-2-1\"><i>Consensus<\/i> <i>ad idem.<\/i><\/h3><ul><li>The <b>process of negotiation<\/b> to reach an agreement is expressed in the form of offer and, acceptance.<\/li><li>Therefore, to establish that there is an agreement between the parties, the facts and circumstances surrounding the agreement have to be examined. It must be shown that an offer was made by one party (called the <b>offeror<\/b>) and accepted by another party (called the <b>offeree<\/b>).<\/li><\/ul><h3 id=\"cil-deck-2-2\">OFFER<\/h3><ul><li>An offer is a <b>proposal<\/b> indicating one's willingness to enter into a contract with the person to whom it is addressed.<\/li><li>An offer can be made to a <b>specific person<\/b> or to the <b>general<\/b> <b>public<\/b>.<\/li><li>When it is made to a specific person or group of persons, it is only capable of acceptance by the specific person or a member of the group.<\/li><li>When it is made to the public, the offeror indicates willing to contract with any member of the public who accepts it. E.g. a reward offer- See <i>Carlill v Carbolic Smoke Ball<\/i>.<\/li><li>An offer can be made <b>orally<\/b>, in <b>writing<\/b> or by <b>conduct<\/b><\/li><\/ul><h3 id=\"cil-deck-2-3\">Offer/Invitation to Treat<\/h3><ul><li>For a proposition/indication of interest to be considered an offer, it must be<\/li><li><b>clear<\/b>, <b>complete<\/b> and <b>definite<\/b>.<\/li><li>The offeror must intend to be bound without further negotiation.<\/li><li>Once the court can detect or imply a <b>lack<\/b> <b>of intention<\/b> to be bound without further negotiation, it will hold that the indication of interest is not an offer but an invitation to treat (invitation to make an offer).<\/li><li>The use of the word ‘offer’ does not automatically mean that the proposition was an offer. What is important is the intentions of the party which must be outwardly shown.<\/li><li><b>Example<\/b>: An estate agent writes a prospective client saying ‘I offer my services to you, to manage your property in VGC for 15% of rent accrued’, the client replies, i accept your offer, but for 10% of rent accrued. When was the offer made and accepted?<\/li><li>Due to the difficulty in determining whether a proposition is an offer or an invitation to treat, the following cases will be used to aid the distinction.<\/li><\/ul><h3 id=\"cil-deck-2-4\">Display of goods in shops<\/h3><ul><li>The display of goods on the shelf or in shop windows with the price indicated, <b>is a<\/b> <b>mere invitation to treat<\/b>, and not an offer.<\/li><li>The buyer makes an offer when he picks up the goods and takes it to the seller.<\/li><\/ul><h3 id=\"cil-deck-2-5\">Advertisements in Catalogues and Newspapers<\/h3><ul><li><b>Advertisement<\/b> of goods for sale in catalogues, Newspapers, etc. is regarded as <b>a mere invitation to treat<\/b>. Except it is otherwise indicated.<\/li><li>However, there are times/circumstances when advertisements are framed in such specific terms that they can be construed as an offer.<\/li><li>Where the advert makes promises in return for an act. E.g reward for buying a product or for finding a lost property. <i>Carlil v Carbolic Smokeball<\/i> .<\/li><li>In these circumstances, no further act of acceptance is contemplated<\/li><li><b>Auction/bids<\/b><\/li><li>An <b>advertisement<\/b> stating that an auction will hold is not an offer, but <b>an invitation to treat.<\/b><\/li><li>The auctioneers <b>invitation<\/b> for bids is also not an offer.<\/li><li>Each bid constitutes an offer which can be accepted or rejected by the auctioneer. Acceptance occurs only when the auctioneer's hammer falls. Before then, the bidder can withdraw his bid/offer.<\/li><\/ul><h3 id=\"cil-deck-2-6\">Public transportation<\/h3><ul><li>On the question of when a contract is formed in public transportation, whether at the time of issuing a travel timetable or at the time of boarding. Standing at the bus stop?<\/li><li>A transport timetable or itinerary does not constitute an offer, but an invitation to treat the<\/li><\/ul><h3 id=\"cil-deck-2-7\">Sale of Shares<\/h3><ul><li>An advertisement inviting the public to purchase shares in a company is not an offer but an invitation to treat, although it is usually called an offer of shares.<\/li><li>A member of the public makes the offer when he applies for the shares and the company may or may not accept the offer.<\/li><\/ul><h3 id=\"cil-deck-2-8\">Tender<\/h3><ul><li>A request for tender (where a tenderer is invited to state the lowest he can use to execute a contract) is not an offer, but an invitation to treat.<\/li><li>However, if the invitation explicitly states that the lowest or highest bid will be accepted, then the invitation constitutes an offer.<\/li><li><b>SUPPLY OF INFORMATION<\/b><\/li><li>A mere supply of information, e.g price, does not constitute an offer.<\/li><li>See <i><b>Harvey v Facey<\/b><\/i> (1893) AC 552- the plaintiff requested for<\/li><li>the price of some goods ‘bumper hall pen’, the defendant<\/li><li>replied 900 pounds, the plaintiff sent another telegraph<\/li><li>accepting to buy the it. They sued when the defendant refused<\/li><li>to sell it.<\/li><\/ul><h3 id=\"cil-deck-2-9\">Acceptance<\/h3><ul><li>Acceptance is the <b>final<\/b> and <b>unqualified assent<\/b> to the terms of an <b>offer<\/b>.<\/li><li>In other words, the offeree <b>must agree with all the terms<\/b> of the offer. He is not allowed to change the terms of the contract or to incorporate new ones.<\/li><li>Any modification or addition to the terms of the offer will <b>amount<\/b> to a counter offer and not an acceptance.<\/li><li>A <b>counter offer<\/b> constitutes an <b>invalid acceptance<\/b> but is a <b>valid offer<\/b> which may be accepted by the other party. E.g...<\/li><li>It is important to ascertain when an offer was made and when it was accepted because, once the offer is validly accepted, the contract becomes binding on both parties.<\/li><li>They become obligated to perform their promises.<\/li><li>However, silence or inactivity does not amount to acceptance.<\/li><li>A statement which merely acknowledges receipt of the offer or which states the intentions of the offeree to accept the offer does not amount to acceptance.<\/li><li>Request for further information does not invalidate an offer or acceptance.<\/li><li>Conditional acceptance- An acceptance that is subject to the performance of a condition, does not constitute a valid acceptance until the condition is fulfilled. E.g<\/li><\/ul><h3 id=\"cil-deck-2-10\">Mode of acceptance<\/h3><ul><li>Where the offeror prescribes a particular mode by which acceptance may be communicated,<\/li><li>(e.g must be in writing, via email) then the prescribed mode<\/li><li>must be followed else the acceptance is invalid. E.g <b>Afolabi v.<\/b><\/li><li><b>Polymera Industries Ltd<\/b>. The offeror specified that the offer<\/li><li>should be accepted by signing the attached agreement and<\/li><li>returning at the earliest possible time.<\/li><li>Where no particular method of acceptance is prescribed, the general rule is that acceptance may be given by the same mode of communication or by a method equally as fast as the method used in making the offer.<\/li><\/ul><h3 id=\"cil-deck-2-11\">Communication of acceptance<\/h3><ul><li>The <b>general<\/b> <b>rule<\/b> is that, acceptance becomes effective only when it has been <b>communicated/received<\/b> by the offeror.<\/li><li>Until an acceptance is received by the offeror, the offer may be revoked.<\/li><li>The main rationale for this rule is that it could cause hardship to the offeror if he is to be bound without <b>knowing<\/b> that his offer has been accepted.<\/li><li><b>Exceptions to this general rule-<\/b><\/li><li><b>• Acceptance by Post-<\/b> where acceptance is to be communicated to the offeror via the postal system or telegram, then acceptance becomes effective when posted, rather than when it is received the offeror.<\/li><li><i><b>Adams v Lindsay<\/b><\/i> <i>–<\/i> offer for the sale of wool was received on sept. 5,<\/li><li>acceptance posted same day but received on sept. 9, defendant sold the<\/li><li>wool to someone else on the sept. 8. it was held that the contract came<\/li><li>into existence on sept. 5.<\/li><\/ul><h3 id=\"cil-deck-2-12\">Termination of Offer<\/h3><p><b>An offer may be terminated<\/b> before acceptance by any of these following ways: <b>Revocation/withdrawal-<\/b> The offeror can revoke or withdraw his offer before acceptance. Acceptance makes the offer irrevocable. The postal rule does not apply to communication of revocation. <b>Rejection-<\/b> Where the offeree rejects the offer e.g. counter-offer <b>Lapse of time-<\/b> where the offeror imposes a time limit and the offeree did not accept the offer within the time specified. <b>Failure of a condition-<\/b> where the offer is conditional and the condition was not met <b>Death<\/b> of the <b>offeree or offeror-<\/b> the person to whom the offer is made is the only one capable of accepting the offer. <b>Death<\/b> of the <b>offeror-<\/b> where the offeree has notice of the offerors death before acceptance, the offer is automatically revoked. However, if the offer was accepted before knowledge of the offerors death, termination of the offer will be dependent on the nature of the contract. If the contract is one that can still be performed<\/p><h3 id=\"cil-deck-2-13\">Consideration<\/h3><ul><li>For a <b>simple<\/b> contract to be enforceable, there must be consideration. In other words, each party must do or promise to do something in exchange for what is gained from the other party<\/li><li>Consideration is a promise by the promissor to give something of value to the promisee in exchange for a thing of value.<\/li><li><i><b>Currie v Misa-<\/b><\/i> Consideration – right , interest, profit, benefit, or forbearance, detriment, loss, responsibility’<\/li><li>A promise not supported by consideration is a gratuitous promise. Not enforceable. Awoof is not a contract, unless it is under seal.<\/li><li>So if you seek to enforce someone else’s promise to you, you must prove that you gave something in return for that promise.<\/li><li>Each party must <b>receive a benefit<\/b> and <b>suffer a<\/b> <b>detriment/loss<\/b>. This benefit and detriment is referred to as consideration.<\/li><li>Consideration can be a thing or a service. It does not have to be <b>money<\/b>.<\/li><li>Most contracts involves 2 promises, each is both a promissor and a promisee.<\/li><li><b>E.g<\/b>. For instance, where A simply promises to sweep the class- it is not enforceable unless it is under seal Where <b>A<\/b> promises to sweep the class in exchange for a loaf of bread- contract<\/li><\/ul><h3 id=\"cil-deck-2-14\">Rules Governing Consideration<\/h3><ul><li><b>Consideration must have some value but need not<\/b><\/li><li><b>1.<\/b> <b>be adequate.<\/b><\/li><li>The consideration must have <b>a real or economic value<\/b>, but need not be adequate.<\/li><li>It should not just be an emotional or sentimental value. E.g. A promise by a son to his father to be more responsible in exchange for a new car.<\/li><li>The court will not usually interfere with the bargains of the contracting parties. Parties are allowed to make whatever bargains that they want. The court is not concerned with whether the considerations are of fair or unfair value, it should just be something that a value can be placed on.<\/li><li>e.g. a plate of food in exchange for an iphone.<\/li><\/ul><h3 id=\"cil-deck-2-15\">2. Consideration must move from the promisee<\/h3><ul><li>Most contracts involves 2 promises, each is both a promissor and a promisee.<\/li><li>Any one who does not furnish consideration cannot bring an action to enforce the contract. E.g. in a contract made by A and B for the benefit of C, C cannot bring an action to enforce the contract because he did not furnish consideration.<\/li><\/ul><h3 id=\"cil-deck-2-16\">3. Consideration may be Executory or executed, but not past.<\/h3><ul><li>Consideration is <b>Executory<\/b> where both parties <b>exchange promises<\/b> to perform an act in the future e.g. a promise to supply a bag of rice in exchange for payment.- bilateral contracts.<\/li><li>Consideration is <b>executed<\/b> where a party <b>promises<\/b> to do something <b>in<\/b> <b>return<\/b> for the <b>performance of an act,<\/b> rather than for the mere promise of the future performance of an act.<\/li><li><b>Consideration to perform an existing obligation is past<\/b> consideration, therefore not valid. where a party performs the act before the other party makes a promise.<\/li><li><b>Exceptions<\/b> to the rule that past consideration is no consideration is where<\/li><li>a service is rendered at the request of the promissor with the understanding<\/li><li>that the act will be paid for. Example, where you ask a taxi driver to take<\/li><li>you to your hostel. Request for uber.<\/li><\/ul><h3 id=\"cil-deck-2-17\">4. Consideration must not be illegal<\/h3><ul><li>The courts will not allow Illegal or immoral considerations to succeed.<\/li><li><b>5. A promise to fulfil an existing obligation is not consideration<\/b><\/li><li>Where a person performs or promises to perform an act which he is already<\/li><li>obliged to perform, he is not contributing anything to the bargain.<\/li><li>But if he does more than he is bound to do, that is consideration.<\/li><li>For instance, consideration is not sufficient, where there is a:<\/li><li><b>A public duty –<\/b> hiring a LASMA officer to direct traffic<\/li><li><b>A duty imposed by contract with the promisor-<\/b> where the promisee is bound to perform the duty by an earlier contract. <i>Stilk v Myrick<\/i>- ship/sailors<\/li><li><b>A duty imposed by contract with third party-<\/b> where the promisee performs an act which he is already bound to perform by another contract.<\/li><\/ul><h3 id=\"cil-deck-2-18\">Intention to Create legal relations<\/h3><ul><li>In addition to offer, acceptance and consideration , there is a 4th element- intention to contract.<\/li><li>For the contract to be valid, the parties must have the intention to create legal relations.<\/li><li>However, to determine whether the parties intended to create legal relations or not, the court will not usually ask the parties whether or not they intended to contract.<\/li><li>Rather, it will employ an objective test. It will consider whether an onlooker/officious bystander /reasonable man will assume, from the facts of the case, whether or not the parties intended to contract.<\/li><li>In other to determine whether intention to contract exists or not, the courts classify agreements into <b>social or domestic<\/b> <b>agreements<\/b> and <b>Commercial agreements.<\/b><\/li><li>where the agreement is of a <b>Social and Domestic nature,<\/b> the court generally presumes that the parties did not have the intention to be bound e.g. agreement btw husbands/wives, parents/child, friends. However, the courts presumption can be rebutted/changed if there is evidence that the parties intended to be bound.<\/li><li><b>Commercial Agreements-<\/b> it is generally presumed that parties in commercial agreements intend to enter into a legally binding contract. It is therefore not necessary to prove further intentions.<\/li><li>This presumption can be rebutted/changed if there is evidence that the parties did not intend to be bound.<\/li><\/ul>", "toc": [{"id": "cil-deck-2-0", "t": "Elements of a Valid Contract", "lv": 3}, {"id": "cil-deck-2-1", "t": "Consensus ad idem.", "lv": 3}, {"id": "cil-deck-2-2", "t": "OFFER", "lv": 3}, {"id": "cil-deck-2-3", "t": "Offer/Invitation to Treat", "lv": 3}, {"id": "cil-deck-2-4", "t": "Display of goods in shops", "lv": 3}, {"id": "cil-deck-2-5", "t": "Advertisements in Catalogues and Newspapers", "lv": 3}, {"id": "cil-deck-2-6", "t": "Public transportation", "lv": 3}, {"id": "cil-deck-2-7", "t": "Sale of Shares", "lv": 3}, {"id": "cil-deck-2-8", "t": "Tender", "lv": 3}, {"id": "cil-deck-2-9", "t": "Acceptance", "lv": 3}, {"id": "cil-deck-2-10", "t": "Mode of acceptance", "lv": 3}, {"id": "cil-deck-2-11", "t": "Communication of acceptance", "lv": 3}, {"id": "cil-deck-2-12", "t": "Termination of Offer", "lv": 3}, {"id": "cil-deck-2-13", "t": "Consideration", "lv": 3}, {"id": "cil-deck-2-14", "t": "Rules Governing Consideration", "lv": 3}, {"id": "cil-deck-2-15", "t": "2. Consideration must move from the promisee", "lv": 3}, {"id": "cil-deck-2-16", "t": "3. Consideration may be Executory or executed, but not past.", "lv": 3}, {"id": "cil-deck-2-17", "t": "4. Consideration must not be illegal", "lv": 3}, {"id": "cil-deck-2-18", "t": "Intention to Create legal relations", "lv": 3}]}]}, "cil-deck-3": {"course": "CIL", "ref": "Slide 1.3", "title": "Terms of Contract", "kicker": "Lecture deck · Dr Ihuoma Ilobinso · 17 slides", "words": 973, "parts": [{"label": "Conditions, warranties, innominate terms and exclusion clauses", "note": "", "src": "1.3 Engineering Contract Terms .pptx.pdf", "html": "<h3 id=\"cil-deck-3-0\">Introduction<\/h3><ul><li><b>Terms of contract<\/b> refer to the <b>legally binding<\/b><\/li><li><b>statements/promises<\/b> made by parties to the contract which give rise to <b>rights and obligations.<\/b><\/li><li>when a contract is being negotiated, various statements are made.<\/li><li>Disputes may arise with respect to whether the parties intended that some of the statements made during the negotiation are to be legally binding or not.<\/li><li>Not all statements are legally binding. Some of these statements become part of a legally binding contract as <b>terms<\/b>. Some are not considered to be part of the contract and are merely <b>representations<\/b>.<\/li><\/ul><h3 id=\"cil-deck-3-1\">Terms and Representation<\/h3><ul><li>The courts have developed tests for determining whether a statement is a term or<\/li><li>representation. <b>Stage of contract:<\/b> at what stage of the contract was the statement made?<\/li><li><b>1.<\/b> early stage = representation Later stage = term. <b>Agreements reduced to writing<\/b>: was the oral statement reduced to writing, any<\/li><li><b>2.<\/b> statement that is not included in the final contractual document is likely to be a representation. <b>Special knowledge and Skill<\/b>:<\/li><li><b>3.<\/b> statement by a party who has expert knowledge and skill = term statement is made by a layman =representation. <b>Importance of the statement<\/b>: if the party making the statement indicates to the<\/li><li><b>4.<\/b> knowledge of the other party that the statement is of great importance, that they won't have entered into the contract if the statement had not been made.<\/li><\/ul><h3 id=\"cil-deck-3-2\">Categories of contractual terms<\/h3><ul><li>Terms (whether implied or express) are not all of<\/li><li>equal importance. Conditions<\/li><li>1. Warranties<\/li><li>2. Intermediate or innominate terms<\/li><li>3.<\/li><\/ul><h3 id=\"cil-deck-3-3\">Conditions<\/h3><ul><li>These are terms of <b>great importance<\/b>. They constitute the main purpose of the contract, and failure to comply with the terms is equivalent to not performing the contract.<\/li><li>breach of a condition will entitle the injured party to <b>repudiate/terminate<\/b> the contract and seek damages.<\/li><li>Warranties<\/li><li><b>warranty<\/b> is a relatively <b>minor<\/b> <b>term<\/b> in a contract.<\/li><li>breached may give the injured party the <b>right to claim damages<\/b> but <b>not to<\/b> <b>reject the goods and terminate the<\/b> <b>contract<\/b>.<\/li><\/ul><h3 id=\"cil-deck-3-4\">Innominate or intermediate terms<\/h3><ul><li>There are cases where it might not be so easy to classify the term as either a condition or a warranty.<\/li><li>The courts developed this category as a <b>hybrid<\/b> between conditions and warranty.<\/li><li>a breach of intermediate terms <b>could either lead repudiation<\/b> or <b>damages<\/b> depending on the seriousness of the breach on the contract.<\/li><li>If the breach is so serious to deprive the party of <b>substantially<\/b> the whole benefits of the contract, the contract may be repudiated.<\/li><li>to determine when a party has a right repudiate the contract or receive damages, the <b>'substantial<\/b> <b>benefit<\/b>' test will be applied.<\/li><\/ul><h3 id=\"cil-deck-3-5\">Types of Terms<\/h3><ul><li>There are two main types of terms:<\/li><li><b>express<\/b> and <b>implied<\/b> terms <b>Express terms<\/b> Express terms are those terms that have<\/li><li>been precisely agreed upon by the parties. They may be <b>written or oral.<\/b><\/li><\/ul><h3 id=\"cil-deck-3-6\">Implied Terms<\/h3><ul><li>These are terms which are deemed to form part of the contract even though they may not have been specifically stated or agreed by the parties.<\/li><li>Implied terms can be classified into:<\/li><li>1. terms implied by courts<\/li><li>2. terms implied by custom or usage<\/li><li>3. terms implied by statute<\/li><\/ul><h3 id=\"cil-deck-3-7\">Terms Implied by Courts<\/h3><ul><li>these are terms which are not expressly set out in the contract but which are read into the contract by the court on the grounds that the parties' would have expressly included them into their contract if they had thought about it.<\/li><li>The court is usually very reluctant to imply terms into contracts. However, when considering whether to imply a term or not, the court adopts 2 tests: - Officious Bystander Test - Business Efficacy Test<\/li><\/ul><h3 id=\"cil-deck-3-8\">Terms implied by custom or usage<\/h3><ul><li>terms may be implied by custom or trade usage.<\/li><li>Custom will not be implied where it has been<\/li><li><b>excluded by the parties (<\/b>expressly or impliedly).<\/li><\/ul><h3 id=\"cil-deck-3-9\">Terms implied by statute/law<\/h3><ul><li>Terms read into the contract by the statute/law For instance, the Federal Competition and Consumer Protection Act and the Sale of Goods Act <b>Sale of Goods Act<\/b> - Sec 12-15 -Implied condition as to title -Implied warranty as to title -Sale by Sample (condition) -Sale by Description (condition) -Implied Condition as to fitness and quality<\/li><li>1.<\/li><\/ul><h3 id=\"cil-deck-3-10\">Implied Terms<\/h3><ul><li>Section 12 implies that the seller has the legal right<\/li><li>to sell the goods. In other words, the seller must<\/li><li>either own the goods or have authority to transfer<\/li><li>ownership. It also implies that:<\/li><li>1. The buyer will enjoy <b>quiet possession<\/b> of the goods.<\/li><li>2. The goods are free from undisclosed charges or encumbrances (e.g., liens, mortgages, pledges)<\/li><li><b>Section 13 - Sale by Description<\/b><\/li><li>Where goods are sold <b>by description<\/b>, there is<\/li><li>an implied condition that the goods will<\/li><li>correspond exactly with that description.<\/li><li>A sale may still be &quot;by description&quot; even if the<\/li><li>buyer has seen the goods.<\/li><li><b>Section 14 - Implied Terms as to Quality and Fitness for Purpose<\/b><\/li><li>The general rule is <b>caveat emptor<\/b> (&quot;let the buyer beware&quot;). However, where the seller<\/li><li>sells goods in the course of business, the law implies two important conditions.<\/li><li><b>(a) Merchantable/Satisfactory Quality<\/b><\/li><li>The goods must be of satisfactory quality, meaning a reasonable person would regard<\/li><li>them as acceptable considering their description, price, and other relevant<\/li><li>circumstances.<\/li><li><b>(b) Fitness for Purpose<\/b><\/li><li>Where:<\/li><li>1. The buyer makes known the purpose for which the goods are required; and<\/li><li>2. Relies on the seller's skill or judgment,<\/li><li>there is an implied condition that the goods will be reasonably fit for that purpose.<\/li><li><b>Section 15 - Sale by Sample<\/b><\/li><li>Where goods are sold by reference to a sample, three<\/li><li>conditions are implied:<\/li><li>1. The bulk of the goods must correspond with the sample in quality.<\/li><li>2. The buyer must have a reasonable opportunity to compare the bulk with the sample.<\/li><li>3. The goods must be free from latent defects that would not be apparent upon reasonable examination of the sample.<\/li><\/ul><h3 id=\"cil-deck-3-11\">1.<\/h3>", "toc": [{"id": "cil-deck-3-0", "t": "Introduction", "lv": 3}, {"id": "cil-deck-3-1", "t": "Terms and Representation", "lv": 3}, {"id": "cil-deck-3-2", "t": "Categories of contractual terms", "lv": 3}, {"id": "cil-deck-3-3", "t": "Conditions", "lv": 3}, {"id": "cil-deck-3-4", "t": "Innominate or intermediate terms", "lv": 3}, {"id": "cil-deck-3-5", "t": "Types of Terms", "lv": 3}, {"id": "cil-deck-3-6", "t": "Implied Terms", "lv": 3}, {"id": "cil-deck-3-7", "t": "Terms Implied by Courts", "lv": 3}, {"id": "cil-deck-3-8", "t": "Terms implied by custom or usage", "lv": 3}, {"id": "cil-deck-3-9", "t": "Terms implied by statute/law", "lv": 3}, {"id": "cil-deck-3-10", "t": "Implied Terms", "lv": 3}, {"id": "cil-deck-3-11", "t": "1.", "lv": 3}]}]}, "cil-class-1": {"course": "CIL", "ref": "Class 1", "title": "Introduction to Nigerian Law & Contract Formation", "kicker": "Class notes · 14 May 2025", "words": 4021, "parts": [{"label": "", "note": "", "src": "Class 1 - CIL_Law_of_Engineering_Contract_Notes.pdf", "html": "<h2 id=\"cil-class-1-0\">1. Civil Law — An Overview<\/h2><p>Civil law are the laws that are not criminal in nature — for instance, contract law. It is not criminal. So if you breach your contract, you should not be arrested for it, except for the criminal aspect of it. Maybe you have defrauded somebody. Except where it can be proven that there is fraud — then the police can get involved — but usually, if fraud cannot be proven, obtaining by false pretences, you should actually not go to the police. You should go to contact the court to resolve it.<\/p><h3 id=\"cil-class-1-1\">Court System in Nigeria<\/h3><p>We respect the court systems in Nigeria. There are different courts:<\/p><ul><li>Supreme Court — the highest court in Nigeria<\/li><li>Court of Appeal — comes immediately after the Supreme Court<\/li><li>Federal High Courts<\/li><li>State High Courts<\/li><li>Magistrate Courts<\/li><li>Customary Courts<\/li><li>Sharia Courts<\/li><\/ul><p>There are also specialised courts like the National Industrial Court, which deals with specific areas of human interactions or specific areas of the law — for instance, employment matters. Like the Coroner's Court, which has to do with inquiring into how somebody died, especially when a child is involved. And there are so many other special courts.<\/p><p>In law there is a hierarchy where we respect persons and the courts. The highest court in Nigeria is the Supreme Court, followed by the Court of Appeal, then the Federal High Courts, then the State High Courts, then Magistrate Courts, then Customary Courts and Sharia Courts.<\/p><h2 id=\"cil-class-1-2\">2. Sources of Law in Nigeria<\/h2><p>When we talk about sources of law, what does that mean? We are talking about: where does the law come from? There are different sources.<\/p><h3 id=\"cil-class-1-3\">A. Received English Law<\/h3><p>The law that we received from our Colonial Masters — 'Received English Law.' When the British came to colonise us and all the other people they colonised, they came with a lot of things — they came with schools, education, and they also came with their law. And so we still apply contract law. These laws still apply to us in Nigeria even up till today, simply because we were colonised by the British.<\/p><p>Some of those laws still apply. Now in Nigeria, probably not — most of those laws have been changed. But we still apply some from the 1800s. The received English law is divided into three:<\/p><h3 id=\"cil-class-1-4\">i. Common Law<\/h3><p>These are laws that are not specifically in any book, in any statutes, or in any written form. You can find them in law reports where the court is making pronouncements or making decisions — so they are referred to as judgment law. They are the primary source of law in contract law.<\/p><p>These are laws that have been made by judges over time. Their decisions have been made by those judges over time and have become the law. For instance, it has been found that superior courts have always held that an agreement is not a contract if there is no money that has been exchanged.<\/p><p><b>Rule of Precedent / Judicial Precedence:<\/b> When a superior court makes a decision, it must be followed by the lower ones, as long as the facts are the same or very similar. The lower courts are not allowed to go outside what the superior court has said. Common law simply means those decisions that have been made over time. They have been repeated by lower courts and are now considered the law. Contract law is one of the areas of law where we have a lot of common law.<\/p><h3 id=\"cil-class-1-5\">ii. Doctrines of Equity<\/h3><p>They are like principles. 'He that comes to equity must come with clean hands' — has everyone heard that? There are different principles like that. They were established to be able to alleviate the hardship of common law. Common law is black and white.<\/p><p>Before equity was developed, it was only common law. [An example from the Merchant of Venice:] somebody said he was owed money and the agreement was: if you don't pay me, I will cut your hand. It went to court and the judge was ready to cut off his hand because he didn't pay. That is what common law does — common law says: 'This is the law and you must follow the law.' There is no question of equity. Is it going to be just? Are you going to be doing justice if you make this decision or not? So eventually, the court of equity was developed and established to be able to alleviate the hardship of common law.<\/p><p>They developed certain doctrines that should apply to us, which allow the courts to do justice — not just to apply the rules. In that case, the lawyer argued: the contract says that you can cut off his hand if he does not pay, but the contract does not say anything about spilling blood. So if you can cut off his hand without spilling his blood, then you can go ahead.<\/p><p>That is exactly what equity tries to do. It looks at: is it going to be just if we cut off his hand? How is he going to even pay eventually? We are probably going to be depriving him — or some other people — of a means of earning because of his hand. There is going to be blood everywhere. So that is what equity does — it tries to reduce the harshness caused by common law. And those principles still apply in Nigeria.<\/p><h3 id=\"cil-class-1-6\">iii. Statutes of General Application<\/h3><p>Statutes are books and laws that are in writing — for instance, in Nigeria we have constitutional law. It is passed by the National Assembly or the State House of Assembly. Statutes of General Application are those laws that were passed by the parliament in the United Kingdom before 1900. So any law that was passed in written form before 1900 is considered a Statute of General Application.<\/p><p>One of those Statutes of General Application is the <b>Sale of Goods Act of 1893<\/b>. It still applies in Nigeria up to date. The only exception to the application of the received English law is where there is an existing law in Nigeria with respect to the same subject matter. For instance, some states in Nigeria do not apply the Sale of Goods Act of 1893 because they have their own Sale of Goods Law — like Lagos State and Edo State and<\/p><p>some other states. They do not use the 1893 Act. But there are certain states in Nigeria that do not have their own Sale of Goods law, so the 1893 Act still applies there.<\/p><p>When we teach, we use the Sale of Goods Act of 1893 because we cannot start teaching what is in every state. Also, most of those Sale of Goods laws in those states were copied and pasted, so you find they have the same provisions. Just to make sure it is uniform, we use the Sale of Goods Act of 1893.<\/p><h3 id=\"cil-class-1-7\">B. Other Sources of Law in Nigeria<\/h3><p>Aside from Received English Law, other sources of law in Nigeria are:<\/p><ul><li><b>Case Law (Judgment Law) in Nigeria<\/b> — decisions made by Nigerian courts over time.<\/li><li><b>Nigerian Legislation<\/b> — those laws that have been enacted by our own National Assembly or our own legislature, not by the British parliament.<\/li><li><b>Customary Law<\/b> — customs are ways of doing things, over and over, that have become accepted as law. When we talk about customary law in contract, it is mostly <i>trade customs<\/i> — the way things have been done within a particular industry. For instance, even if it is not in your contract, it is widely spread and widely known that when you rent a house you might need to pay agency fees. So there is already a custom in that real estate industry. There are certain tests that the court would apply to be able to determine whether that custom should be applied or not.<\/li><\/ul><h2 id=\"cil-class-1-8\">3. What is a Contract?<\/h2><p>A contract is an agreement between two or more people which is legally binding. Not all agreements are legally binding — so if it is an agreement and it is not legally binding, it is not a contract.<\/p><p>For an agreement to be considered a contract, it has to be <b>consensual<\/b> — which means there should not be any form of force, undue pressure, or duress. It has to be consensual. It has to be voluntary — people have to enter knowing what they are entering into and agreeing to enter, knowing that if they do not do what they have promised to do, they can be sued.<\/p><p>Contracts are agreements made between two or more parties or people which create binding rights and obligations.<\/p><p>All agreements are not contracts, because there are certain agreements that are unenforceable. There are such agreements where the parties did not intend that they should be sued if they did not perform what they promised. There are agreements that are not contracts — they are not enforceable for one reason or another. So all agreements are not contracts, but <b>all contracts must be agreements<\/b>.<\/p><h3 id=\"cil-class-1-9\">Freedom of Contract<\/h3><p>The aim of the courts — the aim of law — is not to ask whether you made a good bargain or not. That is not the aim of the courts. That is not the aim of contract law, because the purpose of contract law is to ensure that whatever agreement you enter into, you must honour it. This is what is referred to as <b>freedom of<\/b> <b>contract<\/b>. Parties are free to enter into whatever bargain they want to. Parties have the freedom to enter into whatever bargain — and whatever bargain you enter into, you must honour it.<\/p><p>For instance, if you decide to sell your own house — or your most valuable thing, your iPhone, your laptop — for 450 naira, and the other party agrees, it is consensual. That is the bargain you made. The court is not going to ask where you were sleeping or whether that was a good deal. That is not the business of the court. The business of the court is: did you make that agreement? Did you make it freely? If you made it freely, the<\/p><p>business of the court is to enforce it. So you must be careful, or you will be held to have breached your contract. The business of the court is to enforce whatever bargain the parties made.<\/p><h2 id=\"cil-class-1-10\">4. Classifications of Contracts<\/h2><p>Just as there are different ways of describing human beings, there are different ways of classifying contracts:<\/p><ul><li>Simple Contracts vs. Contracts Under Seal (Deeds)<\/li><li>Express vs. Implied Contracts<\/li><li>Bilateral vs. Unilateral Contracts<\/li><li>Executed vs. Executory Contracts<\/li><\/ul><h3 id=\"cil-class-1-11\">A. Simple Contracts vs. Contracts Under Seal (Deeds)<\/h3><p><b>Contracts Under Seal / Deeds:<\/b> These are very formal contracts. Those contracts that have been signed, sealed, and delivered. You usually find a seal on them. They are very formal — people will come and bring witnesses; this person signed, that person signed in front of the witnesses. The witnesses also signed. There will be seals from the different parties. These types of very formal contracts are referred to as <b>Deeds<\/b>. That is why you often hear 'deed of assignment' and different types of deeds.<\/p><p><b>Simple Contracts:<\/b> Aside from those very formal ones that are signed, sealed, and delivered, there are other types of contracts. They could be in writing, by words, or by action — but they are generally referred to as simple contracts because they are not formal. It could just be a document that contains the terms of your agreement, but the fact that it is not signed before witnesses and delivered means it is not a deed.<\/p><p>The main reason for the differentiation between simple contracts and contracts under seal is that in a contract under seal / deed, you do not need to provide <b>consideration<\/b>. You do not need to show that you gave something in exchange for that contract. So if somebody promises to give you their car and they sign and deliver a deed to that effect, you can enforce it whether you gave anything in exchange or not.<\/p><p>In a simple contract, however, you need to show that you are giving something in exchange for that person's promise — we will get to that when we talk about consideration. Also, there are certain types of agreements that the law says must be in the form of a deed. For instance, the buying and transfer of land — there are provisions that say it must be in the form of a deed, not just a simple contract.<\/p><h3 id=\"cil-class-1-12\">B. Express vs. Implied Contracts<\/h3><p><b>Express Contracts:<\/b> Those contracts where the parties agree on the terms by their words — where the parties clearly state the terms of their contract, whether spoken or written. Express contracts are the ones where the parties have negotiated and agreed — even if they did not negotiate, they agreed by their own words, whether spoken or written, that they would do this, they would do that. 'I will give you this, you give me that.'<\/p><p><b>Implied Contracts:<\/b> Those types of contracts that are implied from the conduct of the parties. They may not use words — they are inferred from the conduct of the parties. For example, you walk into a restaurant where they sell food. You sit down. They seat you and you start eating. You stand up and want to walk out — the court is going to infer that there was a contract, even though you did not exchange words. The fact that you went into a shop where you know they sell food for money, and you ate — it can be inferred from your conduct that you intended to enter into a contract. Contracts can form not just by your words but also from your conduct.<\/p><h3 id=\"cil-class-1-13\">C. Bilateral vs. Unilateral Contracts<\/h3><p><b>Bilateral Contracts:<\/b> Those contracts where the parties exchange promises. 'I will do this and you will do that.' Both of them are bound by the exchange of promises.<\/p><p><b>Unilateral Contracts:<\/b> Where only one party promises to do something, and the other party has the option to do it or not. For example, you see an advert: 'buy one and get one free.' Only one party is making the promise. In most cases, such promises can be enforceable.<\/p><p><b>Case Example — Carlill v. Carbolic Smoke Ball Co.:<\/b> There was a pandemic of influenza — a respiratory disease. Somebody published an advert in a newspaper: 'Take this smoke ball; use it as directed; you will not get influenza. But if you still contract influenza, we will pay you a sum of money — and that money has been deposited in the bank.' A woman used the smoke ball correctly and still got influenza. She sued, and the company was held liable because they were the only ones that made the promise. There was no exchange of promises — that is an example of a <b>unilateral contract<\/b> — a contract where only one person makes a promise to the whole world. Anybody can accept that promise. And if they accepted and did what they needed to do, you cannot go back on your promise. The court can infer there is a contract simply because one person has shown they are serious about keeping their promise. The Carbolic Smoke Ball Company was made to pay the amount of money they promised.<\/p><h3 id=\"cil-class-1-14\">D. Executed vs. Executory Contracts<\/h3><p><b>Executed Contract:<\/b> This is where both parties have already performed their obligations. For example, you bought your food, gave them 100 naira, they gave you the food — that contract is executed.<\/p><p><b>Executory Contract:<\/b> Where both parties exchange promises to perform in the future. For instance, a contract for you to supply goods next month or next year — performance is to be done in the future.<\/p><h2 id=\"cil-class-1-15\">5. Formation of Contracts<\/h2><p>Remember that all agreements are not contracts, but all contracts are agreements — which means that for an agreement to be legally binding, for it to be enforceable, there are certain things that you must show. There are certain elements that must be found in valid contracts.<\/p><h3 id=\"cil-class-1-16\">Essential Elements of a Contract<\/h3><ul><li><b>Offer<\/b> — A proposal indicating willingness to enter into a contract.<\/li><li><b>Acceptance<\/b> — The other party's agreement to the terms of the offer.<\/li><li><b>Consideration<\/b> — Something of value exchanged between the parties.<\/li><li><b>Intention to Contract<\/b> — Both parties must intend to be legally bound.<\/li><\/ul><p>There are also other elements such as capacity and things like that, but these four are the basic ones. There must be <i>consensus ad idem<\/i> — the parties must agree; they must consent.<\/p><p>But you will find that when cases end up in court, people deny everything. Even if they agreed with all their might, when an issue arises and it ends up in court, they will deny it. So what happens is that the court is not going to come and ask you: 'Did you agree or did you not agree?' The court is going to look at the circumstances of that case — especially the circumstances of your relationship and your transaction — in order to determine whether there was an offer, whether that offer was accepted, whether consideration was provided, and whether the intention to contract is present. So that is why these are the main elements of a contract — the court is not going to ask; it is just going to find out whether these elements can be found.<\/p><h3 id=\"cil-class-1-17\">The Offer<\/h3><p>An offer is a proposal indicating willingness to enter into a contract with the person to whom it is addressed. So there will be someone who has made a proposal: 'I want to sell this'; 'you will need to buy'; 'I want to do this'; 'I want us to do this.' The other party agrees that they are willing and ready to enter into that contract.<\/p><p>An offer can be made to a specific person — whether a corporate person or an individual — and it is that specific person that must accept that offer; it cannot be accepted by someone else. However, if an offer is made to the whole world, anybody can accept it.<\/p><p>An offer can be oral, it can be in writing, or it can be made by conduct — the court can infer from your conduct that you are the one making an offer.<\/p><p>What happens when the person to whom the offer was made cannot accept it — perhaps because of ill health? Generally there are certain cases where there are representatives or agents of the person who can accept on their behalf. We will get to that when we talk about capacity.<\/p><h3 id=\"cil-class-1-18\">Offer vs. Invitation to Treat<\/h3><p>For a proposal to be considered an offer, it must be <b>clear, complete, and definite<\/b>. If a proposal is not clear, not complete, and not definite, it will not be considered an offer — it will be considered an <b>invitation to treat<\/b>, and an invitation to treat cannot be accepted.<\/p><p>An invitation to treat simply means that you are still inviting the other party to come and negotiate. We are still not sure whether we really want the terms. That proposal must be so clear that the other party should just be able to say yes.<\/p><p><b>Written contracts and the Parol Evidence Rule:<\/b> Where a contract is in writing but not clear and complete, that is a very dangerous situation. What you did sign will be held against you. What you did not sign — that is where your lawyer can argue that those terms were not expressly incorporated into the contract. There is something called the <i>parol evidence rule<\/i> — where there is a contract in writing, you cannot bring in extraneous things to add into it, except in very limited cases where the contract itself states that other things may be incorporated. Most record label contracts are the shadiest contracts you will find because they exploit desperate young talents who sign without thinking — very optimistic, looking at the money and not looking at the problems that could arise from that relationship.<\/p><h3 id=\"cil-class-1-19\">Rules for Distinguishing Offer from Invitation to Treat<\/h3><p>The courts have developed certain rules over time to determine whether a proposal should be considered an offer or an invitation to treat.<\/p><h3 id=\"cil-class-1-20\">Example 1: Goods Displayed in a Shop (e.g., ShopRite)<\/h3><p>What the courts have generally held:<\/p><ul><li>Goods displayed on a shelf — that is an <b>invitation to treat<\/b>, not an offer.<\/li><li>When you pick up the goods and put them in your basket — that is <b>still not an offer<\/b>, because you can still change your mind and put them back.<\/li><li>When you take them to the counter and the cashier accepts your payment — <b>that is when the offer is<\/b> <b>made and accepted<\/b>. You are the one making the offer by taking the goods to the counter and being ready to pay. The cashier's duty is to accept the offer on behalf of the company by taking your payment and giving you a receipt. Every other step before that is an invitation to treat.<\/li><\/ul><h3 id=\"cil-class-1-21\">Example 2: ATM Machine<\/h3><ul><li>You stand in front of the ATM thinking — <b>not an offer<\/b> (not clear, not complete, not definite).<\/li><li>You insert your ATM card — <b>still not clear<\/b>; you might just want to check your balance.<\/li><li>You are given options — withdraw, transfer, etc. — <b>still not definite<\/b> until you choose.<\/li><li>You choose an action and select a specific amount — <b>at this point it becomes clear and definite<\/b>. The offer is made when you reach the point of no return — when you confirm. The contract is formed at the point of acceptance.<\/li><\/ul><h3 id=\"cil-class-1-22\">Example 3: Website Display of Goods (UK Case — TV Pricing Error)<\/h3><p>A company mistakenly displayed a TV on a website at £10 when it was supposed to be £100. People discovered this and crashed the website — thousands of orders were placed at £10. When the company realised the error, they shut it down, but many orders had already been made. The question was: was the display of goods on that digital platform an offer? If the display was an offer and putting the item in your cart was acceptance, the company would be liable for thousands of orders.<\/p><p>The court also has to look at <i>business efficacy<\/i> — if we decide it that way, businesses will go out of business. So it was held that a display of goods on a website is an <b>invitation to treat<\/b>. The party who put it in their cart was the one making the offer. The company accepted when they received payment and sent a confirmation. So those who had successfully completed the order were entitled to receive the goods. Those who had not yet received a confirmation — no contract had been formed.<\/p><p>That is why it is really important to determine at what point the offer was made and at what point it was accepted — because <b>that is exactly when the contract is formed<\/b>. Once the contract is formed, the party who does not do what they promised becomes liable — they have breached the contract. But before acceptance, if I withdraw, I cancel, I walk away — you cannot force me to enter into that contract because the contract has not yet been formed.<\/p><h2 id=\"cil-class-1-23\">6. Remedies for Breach of Contract<\/h2><p>If it goes to court and the court determines that a contract was formed, there will be remedies. The remedy could be:<\/p><ul><li><b>Refund<\/b> — the return of money paid.<\/li><li><b>Specific Performance<\/b> — you must do that thing you promised to do.<\/li><li><b>Damages<\/b> — monetary compensation for the loss suffered.<\/li><\/ul><h2 id=\"cil-class-1-24\">7. Coming Up in the Next Class<\/h2><p>From the next class, we will complete the elements of contract formation — acceptance, consideration, and intention to contract.<\/p><p><i>These notes were compiled from a class transcript (May 14, 2025). They reflect the lecturer's words, corrected for<\/i> <i>transcription/grammar errors and organised by topic for clarity.<\/i><\/p>", "toc": [{"id": "cil-class-1-0", "t": "1. Civil Law — An Overview", "lv": 2}, {"id": "cil-class-1-1", "t": "Court System in Nigeria", "lv": 3}, {"id": "cil-class-1-2", "t": "2. Sources of Law in Nigeria", "lv": 2}, {"id": "cil-class-1-3", "t": "A. Received English Law", "lv": 3}, {"id": "cil-class-1-4", "t": "i. Common Law", "lv": 3}, {"id": "cil-class-1-5", "t": "ii. Doctrines of Equity", "lv": 3}, {"id": "cil-class-1-6", "t": "iii. Statutes of General Application", "lv": 3}, {"id": "cil-class-1-7", "t": "B. Other Sources of Law in Nigeria", "lv": 3}, {"id": "cil-class-1-8", "t": "3. What is a Contract?", "lv": 2}, {"id": "cil-class-1-9", "t": "Freedom of Contract", "lv": 3}, {"id": "cil-class-1-10", "t": "4. Classifications of Contracts", "lv": 2}, {"id": "cil-class-1-11", "t": "A. Simple Contracts vs. Contracts Under Seal (Deeds)", "lv": 3}, {"id": "cil-class-1-12", "t": "B. Express vs. Implied Contracts", "lv": 3}, {"id": "cil-class-1-13", "t": "C. Bilateral vs. Unilateral Contracts", "lv": 3}, {"id": "cil-class-1-14", "t": "D. Executed vs. Executory Contracts", "lv": 3}, {"id": "cil-class-1-15", "t": "5. Formation of Contracts", "lv": 2}, {"id": "cil-class-1-16", "t": "Essential Elements of a Contract", "lv": 3}, {"id": "cil-class-1-17", "t": "The Offer", "lv": 3}, {"id": "cil-class-1-18", "t": "Offer vs. Invitation to Treat", "lv": 3}, {"id": "cil-class-1-19", "t": "Rules for Distinguishing Offer from Invitation to Treat", "lv": 3}, {"id": "cil-class-1-20", "t": "Example 1: Goods Displayed in a Shop (e.g., ShopRite)", "lv": 3}, {"id": "cil-class-1-21", "t": "Example 2: ATM Machine", "lv": 3}, {"id": "cil-class-1-22", "t": "Example 3: Website Display of Goods (UK Case — TV Pricing Error)", "lv": 3}, {"id": "cil-class-1-23", "t": "6. Remedies for Breach of Contract", "lv": 2}, {"id": "cil-class-1-24", "t": "7. Coming Up in the Next Class", "lv": 2}]}]}, "cil-class-2": {"course": "CIL", "ref": "Class 2", "title": "Acceptance, Consideration & Intention to Contract", "kicker": "Class notes · 21 May 2025", "words": 2820, "parts": [{"label": "", "note": "", "src": "Class 2- CIL_Law_of_Engineering_Contract_Class2_Notes.pdf", "html": "<h2 id=\"cil-class-2-0\">Recap from Class 1<\/h2><p>In the previous class, we discussed the sources of law in Nigeria — the received English law (common law, doctrines of equity, and statutes of general application), Nigerian legislation, case law, and customary law. We also covered what a contract is, classifications of contracts, and the first element of contract formation: the <b>offer<\/b>. We talked about how a proposal must be clear, complete, and definite to qualify as an offer; otherwise it is merely an invitation to treat. We also discussed how the courts have used certain rules and examples to determine at what point an offer is made. We also discussed the rule of precedent — that a decision made by a superior court must be followed by lower courts as long as the facts are the same or very similar.<\/p><h2 id=\"cil-class-2-1\">1. Acceptance<\/h2><p>Acceptance is where the offeree accepts the proposal or the offer. It is the second element of a valid contract.<\/p><h3 id=\"cil-class-2-2\">A. Conditional Acceptance Is Not Valid Acceptance<\/h3><p>You cannot change the terms of the offer and still call it acceptance. If you change the terms from the original and attach conditions, that is not acceptance — that is a <b>counter-offer<\/b>.<\/p><p>For example, if I say 'I want to sell this for 500 naira,' and you say 'Can you sell it to me tomorrow?' or 'I will buy it, but only if you deliver it' — when you give a condition like that, it is not acceptance. It becomes valid only when you perform that condition — only at that point does it become binding.<\/p><p>So if you take the time frame and you perform the condition before the time prescribed lapses, the contract becomes automatically binding. But if there is a time frame and you did not perform within that time, the offer could be said to have lapsed, and someone else may step in with a better offer.<\/p><p>That is why conditional acceptance is not valid acceptance. Conditional acceptance is not acceptance.<\/p><h3 id=\"cil-class-2-3\">B. Silence Does Not Constitute Acceptance<\/h3><p>Silence or inactivity does not constitute valid acceptance. If I make an offer and I get silence — you do not respond, you do not say anything, that is not acceptance. Even if you ask for more information and the other party provides it and then there is still nothing — silence is not acceptance.<\/p><h3 id=\"cil-class-2-4\">C. Communication of Acceptance<\/h3><p>There are certain rules regarding how acceptance should be communicated.<\/p><h3 id=\"cil-class-2-5\">i. The Mirror Image Rule / Mode of Communication<\/h3><p>The mode used by the offeror in communicating the offer should also determine the mode in which the acceptance should be communicated. So if the offer was communicated by sending a WhatsApp message, it is expected that you should accept through a WhatsApp message or an even faster mode of communication.<\/p><p>The general rule is that the mode of communicating acceptance should be the same as the mode used in making the offer. If the offeror says 'respond within the next five days' or 'write to me' or 'send me an email' or 'fill out this form' — then that is exactly how they want you to accept. If you are told exactly how they want to receive the acceptance, that is exactly how you should accept.<\/p><h3 id=\"cil-class-2-6\">ii. The Postal Rule<\/h3><p>There is an exception to the general rule — the <b>postal rule<\/b>. This rule was developed many years ago when the most common means of communication was the post.<\/p><p>If you send your acceptance by post, once it is delivered to the post office, it is considered as valid acceptance. This is very different from the general rule. The general rule says that acceptance is effective only when it is received by the offeror. But the postal rule is an exception — acceptance is effective at the point of posting, not at the point of receipt.<\/p><p>The reason for this is that the law will not punish you for delays that are beyond your control. If you post your acceptance but the postal service delays it, the law will not hold you responsible for that. So once you have posted it, it is considered accepted.<\/p><h2 id=\"cil-class-2-7\">2. Termination of an Offer<\/h2><p>An offer does not last forever. There are several ways in which an offer can come to an end.<\/p><h3 id=\"cil-class-2-8\">A. Withdrawal / Revocation by the Offeror<\/h3><p>The offeror can withdraw or revoke the offer before it is accepted. For example, if I say 'I want to sell my phone for 400,000 naira,' and before you get back to me, I communicate to you that I have changed my mind — I do not want to sell it anymore. Perhaps the price of phones has gone up, so I value what I have more, or someone else has made a better offer. You cannot then force me into a contract. That is self-explanatory.<\/p><h3 id=\"cil-class-2-9\">B. Rejection by the Offeree<\/h3><p>If I make an offer to you and you reject it, the offer dies. Once you have rejected an offer, you cannot go back and say you now want to accept it. The rejection terminates the offer.<\/p><h3 id=\"cil-class-2-10\">C. Lapse of Time<\/h3><p>If the offeror gives you a set time frame to accept the offer, and that time lapses without acceptance, the offer dies. You cannot accept after the time prescribed has elapsed.<\/p><h3 id=\"cil-class-2-11\">D. Counter-Offer<\/h3><p>As discussed under conditional acceptance, if the offeree responds with different terms instead of accepting the original offer as it is, that constitutes a counter-offer. The counter-offer kills the original offer. The offeree cannot then go back and accept the original offer.<\/p><h3 id=\"cil-class-2-12\">E. Death of the Offeror<\/h3><p>If the person who made the offer dies, the offer may be terminated — especially with respect to personal contracts or contracts of service. For instance, if one of your favourite musicians makes an offer to come and perform at your show, and then the musician dies, you cannot accept that offer knowing that the offeror has died.<\/p><p>However, this is different when it comes to contracts involving property. For instance, a contract between parties regarding property or land — where other people or successors can step in and perform that contract — in such a case, it is not expected that the death of one party should necessarily bring the offer to an end.<\/p><h2 id=\"cil-class-2-13\">3. Consideration<\/h2><h3 id=\"cil-class-2-14\">A. Definition<\/h3><p>Consideration in law means something of value given in exchange for the other party's promise. It is the price that you pay in exchange for the other party's promise. Somebody must give something in exchange for what the other person has promised.<\/p><p>This is the legal way of saying that you must give something to get something. You do not leave it as a situation where it is purely gratuitous — where it is up to that person to do it or not. If that person decides not to do it, you cannot sue, because there was nothing exchanged. It is only a person who has given something in exchange that can hold the other party to their promise.<\/p><p>What we teach law students in two semesters, we are trying to condense for you. You are engineering students, so we should not overload you with too much information.<\/p><h3 id=\"cil-class-2-15\">B. Examples of Consideration<\/h3><p>If I promise you 500 naira and you promise to sweep this classroom — if I give you this, you give me that — that is consideration. It does not have to be money.<\/p><p>For instance, say you have five chairs and you decide to have a party and you need my chairs. You come to me and we negotiate — you give me a bag of rice in exchange for the use of my chairs. That is an exchange. That is consideration.<\/p><p>If I promise to lend you my car, and you say you will bring it back the next day — and at the end of the day you do not return my car and I sue you — you can see that there was an exchange: I gave you the use of my car, and your promise was to return it. That happens all the time.<\/p><h3 id=\"cil-class-2-16\">C. The Importance of Putting Things in Writing<\/h3><p>If you do not take anything away from this class, the one thing is that you should try to make sure that you do things in writing.<\/p><p>There was a case where a law student was helping their landlord. The student found a tenant for the landlord, collected the rent money, and transferred it to the landlord. The landlord then decided that the accommodation he was offering was no longer available. And the people had already paid. When it was said that contracts can be oral, they can be formed by word of mouth — but you must be able to prove it by bringing witnesses.<\/p><p>The person who was there when the promise was made — that person was there when this happened. Even if the contract was made by words, you should always have evidence. Send a text message, send a WhatsApp message: 'Thank you, I hope you got the money, just checking in, thank you for accepting.' That is<\/p><p>how you can prove it.<\/p><p>What is the relevance of evidence? This is because that is the only way you can prove what happened. You do not always have to go to court, but you have to have a contract before you can even talk about breach.<\/p><h3 id=\"cil-class-2-17\">D. Consideration Can Be Anything of Value<\/h3><p>Consideration could be anything that you give in exchange for the other party's promise — money, goods, services. You give me money, I give you a service. You give me 500,000 naira for me to build a website for you — the building of the platform is the consideration from your side, and the money is the consideration from the other side.<\/p><h3 id=\"cil-class-2-18\">E. Consideration Can Be a Right Given Up<\/h3><p>Consideration can also be a right that you give up. You have a right to peaceful enjoyment of your property. If you decide to accept some nuisance — for instance, noise or disturbance — in exchange for payment, that is valid consideration.<\/p><p>For example, say I buy a property and I have the right to peaceful enjoyment. My neighbour promises to pay me 100,000 naira every month for me to endure the noise from their operations.<\/p><p>There was a case where a man had a boiler factory, and someone came and promised to pay a sum of money if the property owner would allow the noise and disturbance from the boiler. The argument was: yes, we agreed — you are going to let us operate the boiler. But what did you give us in exchange? The answer was: the property belongs to him. He has the right to peace and quiet. And so, giving up that right was a form of consideration.<\/p><h3 id=\"cil-class-2-19\">F. Rules of Consideration<\/h3><h3 id=\"cil-class-2-20\">i. Consideration Must Be Sufficient but Need Not Be Adequate<\/h3><p>Remember that we said that in contract law, it is not the business of the court to ask whether you made a good bargain or not. Consideration must be sufficient — meaning it must be something recognisable in law — but it need not be adequate. The court will not ask whether what you gave was equal in value to what you received.<\/p><p>There was a case where a woman was married to her husband. She promised to stay faithful for the rest of her life. The question before the court was whether that promise constituted sufficient consideration. The court found that it did.<\/p><p><b>Case Example — Chappell &amp; Co. v. Nestlé Co.:<\/b> Nestlé had a promotion where if you collected chocolate bar wrappers and sent them in, they would give you a music record. Chappell (who owned the copyright to the music) argued that there was no real contract because the chocolate wrappers had no real value — they were just rubbish that Nestlé threw away. The court held that it was not for the court to determine whether the consideration was adequate or not. The wrappers constituted sufficient consideration. What people were paying — the wrappers — was part of the bargain, irrespective of whether it seemed worthless. So the court said: as long as there is consideration, it does not matter what the value is. That is the meaning of 'consideration must be sufficient but need not be adequate.'<\/p><p>The law does not ask whether you made a very fair deal. As long as there is something — even if it seems small — given in exchange, the court will recognise it.<\/p><h3 id=\"cil-class-2-21\">ii. Consideration Must Move from the Promisee<\/h3><p>This means that the person who is seeking to enforce the promise must be the one who provided the consideration. You cannot enforce a contract if you did not give anything in exchange. Even if somebody is giving you something, you must also give something in exchange for it. The consideration must come from the person who wants to enforce the promise.<\/p><h3 id=\"cil-class-2-22\">iii. Past Consideration Is Not Good Consideration<\/h3><p>If you have already performed an act before a promise is made, that past act cannot be the consideration for the new promise. For instance, if a father says 'I always remember how you took care of me all these years, so I will give you my property' — the care that was already given in the past cannot serve as consideration for the new promise. It has already happened. Past consideration is not valid consideration.<\/p><p>This does not mean that past acts are never recognised, but generally, consideration must be something given at the time of the contract or promised for the future — not something that has already been done before the promise was made.<\/p><h3 id=\"cil-class-2-23\">iv. An Existing Obligation Is Not Good Consideration<\/h3><p>If you are already under a duty to do something — either by law or by an existing contract — then doing that same thing cannot count as consideration for a new promise. Because it has already been agreed upon. The performance of an existing obligation is not consideration.<\/p><p>For instance, if we already have a contract that you will clean this classroom every day, and I then promise to pay you extra for the same cleaning, that existing obligation cannot serve as fresh consideration for the new promise. You would need to do something additional or different.<\/p><h2 id=\"cil-class-2-24\">4. Intention to Create Legal Relations<\/h2><p>The last element we will discuss is the intention to create legal relations. For a contract to be valid, the parties must have intended that their agreement would be legally binding. Not every agreement is intended to be a contract.<\/p><h3 id=\"cil-class-2-25\">A. Social and Domestic Agreements<\/h3><p>Where the agreement is social, domestic, or between family members — there is a <b>presumption that there<\/b> <b>is no intention to create legal relations<\/b>. It is not enforceable.<\/p><p>For instance, a promise you make to your mother, or a social arrangement between friends — you do not expect that if you do not do what you promised, you will be sued. There is an understanding that these are not legal obligations. So if you promise your boyfriend or girlfriend something and you do not deliver, they cannot sue you because there is no intention to create legal relations in social or domestic situations.<\/p><h3 id=\"cil-class-2-26\">B. Commercial and Business Agreements<\/h3><p>However, when you enter into a commercial or business agreement, there is a <b>presumption that there is<\/b> <b>intention to create legal relations<\/b>. When you enter into a contract in a business or commercial context, it is presumed that you intend to be bound.<\/p><p>What happens then? If you do not perform your promise in a business context, the other party can hold you liable. You can be sued. The court will presume that you intended to be legally bound because it is a commercial arrangement.<\/p><p>So if you promise something in a purely social setting — say over drinks with friends — the law does not enforce that. But the moment it is a business deal, even if done casually, the law presumes you intended it to be binding.<\/p><h2 id=\"cil-class-2-27\">Summary — Elements of a Valid Contract<\/h2><p>For a valid and enforceable contract to exist, all four elements must be present:<\/p><p><b>Element<\/b> <b>Key Points<\/b><\/p><p>1. Offer Must be clear, complete, and definite. Distinguish from invitation to treat.<\/p><p>2. Acceptance Must be unconditional. Silence is not acceptance. Must be communicated properly (mirror image rule, postal r<\/p><p>3. Consideration Something of value exchanged. Must be sufficient but need not be adequate. Must move from the promisee.<\/p><p>4. Intention to Create Legal Relations<\/p><p>Social/domestic = presumed NO intention. Commercial/business = presumed YES intention.<\/p><p><i>These notes were compiled from a class transcript and audio recording (May 21, 2025). The original transcript contained significant<\/i> <i>transcription errors which have been corrected using audio cross-reference and subject-matter context. The lecturer's intended<\/i> <i>meaning has been preserved throughout.<\/i><\/p>", "toc": [{"id": "cil-class-2-0", "t": "Recap from Class 1", "lv": 2}, {"id": "cil-class-2-1", "t": "1. Acceptance", "lv": 2}, {"id": "cil-class-2-2", "t": "A. Conditional Acceptance Is Not Valid Acceptance", "lv": 3}, {"id": "cil-class-2-3", "t": "B. Silence Does Not Constitute Acceptance", "lv": 3}, {"id": "cil-class-2-4", "t": "C. Communication of Acceptance", "lv": 3}, {"id": "cil-class-2-5", "t": "i. The Mirror Image Rule / Mode of Communication", "lv": 3}, {"id": "cil-class-2-6", "t": "ii. The Postal Rule", "lv": 3}, {"id": "cil-class-2-7", "t": "2. Termination of an Offer", "lv": 2}, {"id": "cil-class-2-8", "t": "A. Withdrawal / Revocation by the Offeror", "lv": 3}, {"id": "cil-class-2-9", "t": "B. Rejection by the Offeree", "lv": 3}, {"id": "cil-class-2-10", "t": "C. Lapse of Time", "lv": 3}, {"id": "cil-class-2-11", "t": "D. Counter-Offer", "lv": 3}, {"id": "cil-class-2-12", "t": "E. Death of the Offeror", "lv": 3}, {"id": "cil-class-2-13", "t": "3. Consideration", "lv": 2}, {"id": "cil-class-2-14", "t": "A. Definition", "lv": 3}, {"id": "cil-class-2-15", "t": "B. Examples of Consideration", "lv": 3}, {"id": "cil-class-2-16", "t": "C. The Importance of Putting Things in Writing", "lv": 3}, {"id": "cil-class-2-17", "t": "D. Consideration Can Be Anything of Value", "lv": 3}, {"id": "cil-class-2-18", "t": "E. Consideration Can Be a Right Given Up", "lv": 3}, {"id": "cil-class-2-19", "t": "F. Rules of Consideration", "lv": 3}, {"id": "cil-class-2-20", "t": "i. Consideration Must Be Sufficient but Need Not Be Adequate", "lv": 3}, {"id": "cil-class-2-21", "t": "ii. Consideration Must Move from the Promisee", "lv": 3}, {"id": "cil-class-2-22", "t": "iii. Past Consideration Is Not Good Consideration", "lv": 3}, {"id": "cil-class-2-23", "t": "iv. An Existing Obligation Is Not Good Consideration", "lv": 3}, {"id": "cil-class-2-24", "t": "4. Intention to Create Legal Relations", "lv": 2}, {"id": "cil-class-2-25", "t": "A. Social and Domestic Agreements", "lv": 3}, {"id": "cil-class-2-26", "t": "B. Commercial and Business Agreements", "lv": 3}, {"id": "cil-class-2-27", "t": "Summary — Elements of a Valid Contract", "lv": 2}]}]}, "cil-class-3": {"course": "CIL", "ref": "Class 3", "title": "Terms of Contract", "kicker": "Class notes · 4 June 2025", "words": 4004, "parts": [{"label": "", "note": "", "src": "Class 3 - CIL_Law_of_Engineering_Contract_Class3_Notes.pdf", "html": "<h2 id=\"cil-class-3-0\">Recap from Previous Classes<\/h2><p>In the previous classes, we talked about the different types of contracts, the elements of a valid contract — offer, acceptance, consideration, and intention to create legal relations. Those concerned the <b>formation<\/b> of contracts: what are the elements that must be present. Today, we are going to be discussing the <b>content<\/b> of the contract — what the contract actually contains.<\/p><h2 id=\"cil-class-3-1\">1. Terms of Contract — Introduction<\/h2><p><b>Terms of contract<\/b> refer to the legally binding statements or promises made by parties to the contract which give rise to <b>rights and obligations<\/b>.<\/p><p>When a contract is being negotiated, various statements are made. The parties say different things — they make different promises. But not everything that is said, not every promise or every statement made during negotiation, will be considered a valid part of the contract.<\/p><p>Disputes may arise with respect to whether the parties intended that some of the statements made during the negotiation are to be legally binding or not. Not all statements are legally binding. Some of these statements become part of a legally binding contract as <b>terms<\/b>. Some are not considered to be part of the contract and are merely <b>representations<\/b>.<\/p><h3 id=\"cil-class-3-2\">Terms vs. Representations<\/h3><p>Statements that are legally binding are referred to as <b>terms<\/b>. Statements that are not legally binding are referred to as <b>mere representations<\/b>.<\/p><p>Those statements that come with binding force — if one of the parties does not do what they promised to do, the other party can enforce the contract. However, some of those statements do not have legal force — the other party cannot be found legally liable to perform under contract law.<\/p><p>That does not mean the other party might not be able to rely on other types of law to enforce that promise. For instance, if the promise was made with the intention to defraud the other person, you might not be able to enforce it under contract law, but you should be able to use criminal law to seek redress — get the person arrested. You might even be able to use the <b>law of torts<\/b>, which is a different type of law. It is very similar to contract law because they are all common-law based, but it is not contract law.<\/p><p>When you see documents with 'terms and conditions,' what that is probably saying is: these are the terms of the contract — the statements and promises that are legally binding on all the parties.<\/p><h2 id=\"cil-class-3-3\">2. Tests for Distinguishing Terms from Representations<\/h2><p>The courts have developed tests for determining whether a statement is a term or a representation. These tests are not absolute — they are not set in stone. They are more like guidelines that help the court determine whether to classify a statement as a term or a mere representation.<\/p><h3 id=\"cil-class-3-4\">Test 1: Stage of the Contract<\/h3><p>At what stage of the contract was the statement made? Was it made at the early stage of the contract — when the parties were still trying to get the other party to enter into the contract? Or was it made at the later stage — after the parties already know what it is that they want?<\/p><ul><li>Statements made at the <b>early stage<\/b> of negotiation would most likely be considered <b>representations<\/b>.<\/li><li>Statements made <b>later<\/b> during contract formation would most likely be considered <b>terms<\/b>.<\/li><\/ul><h3 id=\"cil-class-3-5\">Test 2: Agreements Reduced to Writing<\/h3><p>Was the oral statement reduced to writing? The court looks at whether the parties agreed on terms orally and then eventually put them in writing. If they put certain things in writing but left others out:<\/p><ul><li>Oral statements that <b>did not find their way<\/b> into the written contract will usually be considered <b>mere<\/b> <b>representations<\/b>.<\/li><li>Statements that <b>were included<\/b> in the written contract — even if originally made orally — will usually be considered <b>terms<\/b>.<\/li><\/ul><h3 id=\"cil-class-3-6\">Test 3: Special Knowledge and Skill<\/h3><p>When a party who makes the statement has superior knowledge or expertise with respect to the subject matter of the transaction:<\/p><ul><li>A statement made by a party who has <b>expert knowledge and skill<\/b> = most likely a <b>term<\/b>.<\/li><li>A statement made by a <b>layman<\/b> = most likely a <b>representation<\/b>.<\/li><\/ul><p><b>Case Example — Car Dealer:<\/b> A car dealer stated that a car was a particular year model with certain mileage and specifications. The buyer, an ordinary consumer, bought the car based on those statements. The court held that the statement made by the car dealer was a <b>term<\/b>, because the car dealer had superior knowledge about cars. If we swap the scenario and the person making the statement is just someone selling their old car who does not know anything about cars, such statements might be considered a mere representation.<\/p><h3 id=\"cil-class-3-7\">Test 4: Importance of the Statement<\/h3><p>If the party to whom the statement is being made informs the person making the statement that the statement is of great importance — that they would not have entered into the contract if the statement had not been made — the court would usually consider that statement a <b>term<\/b>, not a mere representation.<\/p><p><b>Case Example — Hops and Sulphur (Bannerman v. White):<\/b> A party wanted to buy hops (used to make beer). He asked the seller: 'Were these hops treated with sulphur? Because if they were treated with sulphur, I will not buy them — they will not ferment into beer properly.' The seller said the hops were not treated with sulphur. The buyer informed the seller that this was really important to him. He went ahead and bought the hops, only to discover they had been treated with sulphur. The court held that the statement was a <b>term<\/b>, because the buyer had clearly communicated the importance of that statement.<\/p><h2 id=\"cil-class-3-8\">3. Categories of Contractual Terms<\/h2><p>Once a statement is determined to be a term (not a mere representation), the next question is: what are the implications of breaching that term? Terms are categorised into three:<\/p><h3 id=\"cil-class-3-9\">A. Conditions<\/h3><p>Conditions are those terms that have great importance. They are the terms that constitute the <b>main purpose<\/b> of the contract — the things that go to the very root of the contract. If a party breaches a condition, it entitles the innocent party to <b>terminate (repudiate) the contract<\/b> and also to <b>claim damages<\/b> (monetary compensation).<\/p><p><b>Example 1:<\/b> Davido is contracted to perform at a faculty event. The contract says he would come for two days of rehearsals and then perform on the third day. But he does not come at all, or he comes for rehearsals but does not perform. Not performing is a breach of a condition, because the primary aim of that contract is for him to perform. The party who contracted him can terminate the contract, demand a refund, and also claim damages for expenses already incurred.<\/p><p><b>Example 2:<\/b> You enter into a contract to buy a car, and instead a bicycle is delivered — or something that was supposed to be a car but does not move. That breach goes to the very root of the contract, and the innocent party can repudiate the contract and claim damages.<\/p><h3 id=\"cil-class-3-10\">B. Warranties<\/h3><p>Warranties are the less important terms — the minor terms. The breach of a warranty would <b>not<\/b> entitle the innocent party to terminate the contract. The breach of a warranty would <b>only<\/b> allow that party to ask for <b>damages<\/b>.<\/p><p>If the breach is of a term that money can cure, the court will expect you to use money (damages) to compensate and remedy the defect.<\/p><p><b>Example:<\/b> You ask for a black car. A white car is supplied to you. That does not go to the root of the contract, because you can take the car and have it repainted to the colour you want. It only costs money. So you can claim damages but you cannot terminate the contract. Similarly, whether the seats are leather or whether the
