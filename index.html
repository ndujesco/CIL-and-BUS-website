function texScan(src){
  var t = [], i = 0, s = String(src).replace(/\{,\}/g, ","), m;
  while(i < s.length){
    var c = s.charAt(i);
    if(c === " " || c === "\t" || c === "\n"){ i++; continue; }
    if(c === "\\"){
      m = /^\\([A-Za-z]+|.)/.exec(s.slice(i));
      var cmd = m[1];
      /* \text{…} and friends keep their braces verbatim, spaces and all */
      if(cmd === "text" || cmd === "mathrm" || cmd === "textbf" || cmd === "operatorname"){
        var upright = cmd === "mathrm" || cmd === "operatorname";
        var j = i + m[0].length, depth = 0, buf = "";
        if(s.charAt(j) === "{"){
          for(depth = 1, j++; j < s.length && depth; j++){
            var d = s.charAt(j);
            if(d === "{") depth++;
            else if(d === "}"){ if(!--depth) break; }
            buf += d;
          }
          j++;
        }
        t.push({ k:upright ? "rm" : "text", v:buf, bold:cmd === "textbf" }); i = j; continue;
      }
      t.push({ k:"cmd", v:cmd }); i += m[0].length; continue;
    }
    if(c === "{" || c === "}" || c === "^" || c === "_"){ t.push({ k:c }); i++; continue; }
    if(c >= "0" && c <= "9"){
      m = /^[0-9]+(?:,[0-9]{3})*(?:\.[0-9]+)?/.exec(s.slice(i));
      t.push({ k:"num", v:m[0] }); i += m[0].length; continue;
    }
    if(/[A-Za-z]/.test(c)){ t.push({ k:"id", v:c }); i++; continue; }
    if(OPCHARS.indexOf(c) >= 0){ t.push({ k:"op", v:c }); i++; continue; }
    t.push({ k:"txt", v:c }); i++;                    /* ₦, %, ° and the like */
  }
  return t;
}

function mrow(a){ return a.length === 1 ? a[0] : "<mrow>" + a.join("") + "</mrow>"; }
function needsBrackets(p){ return /[+\-−*/=<>±×÷ ]/.test(p); }
function wrap(p){ return needsBrackets(p) ? "(" + p + ")" : p; }

/* one atom, plus any scripts hanging off it */
function texAtom(ts, i){
  var t = ts[i], a = null;
  if(!t) return null;

  if(t.k === "{"){ var g = texSeq(ts, i + 1, true); a = { m:mrow(g.m), p:g.p, i:g.i }; }
  else if(t.k === "num")  a = { m:"<mn>" + t.v + "</mn>", p:t.v, i:i + 1 };
  else if(t.k === "id")   a = { m:"<mi>" + t.v + "</mi>", p:t.v, i:i + 1 };
  else if(t.k === "rm")   a = { m:'<mi mathvariant="normal">' + esc(t.v) + "</mi>", p:t.v, i:i + 1 };
  else if(t.k === "op")   a = { m:"<mo>" + esc(t.v) + "</mo>", p:t.v, i:i + 1 };
  else if(t.k === "txt")  a = { m:"<mtext>" + esc(t.v) + "</mtext>", p:t.v, i:i + 1 };
  else if(t.k === "text") a = { m:"<mtext>" + (t.bold ? "<b>" + esc(t.v) + "</b>" : esc(t.v)) + "</mtext>",
                                p:t.v, i:i + 1 };
  else if(t.k === "cmd"){
    var c = t.v, x, y;
    if(c === "frac" || c === "dfrac" || c === "tfrac"){
      x = texAtom(ts, i + 1); y = texAtom(ts, x ? x.i : i + 1);
      a = { m:"<mfrac>" + (x ? x.m : "<mi></mi>") + (y ? y.m : "<mi></mi>") + "</mfrac>",
            p:wrap(x ? x.p : "") + "/" + wrap(y ? y.p : ""), frac:true, i:y ? y.i : i + 1 };
    } else if(c === "sqrt"){
      var j = i + 1, root = null;
      if(ts[j] && ts[j].k === "op" && ts[j].v === "["){          /* \sqrt[3]{…} */
        var k = j + 1, inner = [];
        while(ts[k] && !(ts[k].k === "op" && ts[k].v === "]")) inner.push(ts[k++]);
        root = texSeq(inner, 0, false); j = k + 1;
      }
      x = texAtom(ts, j);
      a = root
        ? { m:"<mroot>" + (x ? x.m : "") + mrow(root.m) + "</mroot>",
            p:root.p + "√(" + (x ? x.p : "") + ")", i:x ? x.i : j }
        : { m:"<msqrt>" + (x ? x.m : "") + "</msqrt>",
            p:"√(" + (x ? x.p : "") + ")", i:x ? x.i : j };
    } else if(c === "bar" || c === "overline" || c === "hat" || c === "vec"){
      x = texAtom(ts, i + 1);
      var acc = c === "hat" ? "&#x5E;" : c === "vec" ? "&#x2192;" : "&#xAF;";
      var acp = c === "hat" ? "̂"  : c === "vec" ? "⃗"   : "̄";
      a = { m:'<mover accent="true">' + (x ? x.m : "") + "<mo>" + acc + "</mo></mover>",
            p:(x ? x.p : "").replace(/(.)$/, "$1" + acp), i:x ? x.i : i + 1 };
    } else if(c === "left" || c === "right" || c === "displaystyle" || c === "limits"){
      return texAtom(ts, i + 1);                                  /* transparent */
    } else if(c === "quad" || c === "qquad"){
      a = { m:'<mspace width="' + (c === "quad" ? "1em" : "2em") + '"/>',
            p:c === "quad" ? "   " : "      ", i:i + 1 };
    } else if(c === "," || c === ";" || c === ":" || c === " "){
      a = { m:'<mspace width="0.28em"/>', p:" ", i:i + 1 };
    } else if(c === "!"){
      a = { m:'<mspace width="-0.17em"/>', p:"", i:i + 1 };
    } else if(c === "%" || c === "$" || c === "#" || c === "&" || c === "{" || c === "}"){
      a = { m:"<mtext>" + esc(c) + "</mtext>", p:c, i:i + 1 };
    } else if(TEX_OP[c]){
      a = { m:"<mo>" + esc(TEX_OP[c]) + "</mo>", p:TEX_OP[c], i:i + 1 };
    } else if(TEX_ID[c]){
      a = { m:"<mi>" + TEX_ID[c] + "</mi>", p:TEX_ID[c], i:i + 1 };
    } else {
      a = { m:'<mi mathvariant="normal">' + esc(c) + "</mi>", p:c, i:i + 1 };
    }
  }
  else return null;

  /* scripts: x^2, D_3, x_i^2 */
  var sup = null, sub = null;
  while(ts[a.i] && (ts[a.i].k === "^" || ts[a.i].k === "_")){
    var kind = ts[a.i].k, s = texAtom(ts, a.i + 1);
    if(!s) break;
    if(kind === "^") sup = s; else sub = s;
    a.i = s.i;
  }
  if(sup && sub){
    a.m = "<msubsup>" + a.m + sub.m + sup.m + "</msubsup>";
    a.p = a.p + plainScript(sub.p, SUB, "_") + plainScript(sup.p, SUP, "^");
  } else if(sup){
    a.m = "<msup>" + a.m + sup.m + "</msup>";
    a.p = a.p + plainScript(sup.p, SUP, "^");
  } else if(sub){
    a.m = "<msub>" + a.m + sub.m + "</msub>";
    a.p = a.p + plainScript(sub.p, SUB, "_");
  }
  return a;
}

function plainScript(txt, map, mark){
  var out = "";
  txt = txt.replace(/\s+/g, "");
  for(var i = 0; i < txt.length; i++){
    if(!map[txt.charAt(i)]) return mark + wrap(txt);
    out += map[txt.charAt(i)];
  }
  return out;
}

function texSeq(ts, i, untilBrace){
  var m = [], parts = [], frac = [];
  while(i < ts.length){
    if(ts[i].k === "}"){ i++; if(untilBrace) break; continue; }
    var a = texAtom(ts, i);
    if(!a){ i++; continue; }
    m.push(a.m); parts.push(a.p); frac.push(!!a.frac); i = a.i;
  }
  /* a/b needs brackets in plain text where the fraction touches its neighbours */
  parts.forEach(function(x, j){
    if(!frac[j]) return;
    if(/[A-Za-z0-9)]$/.test(parts[j - 1] || "") || /^[A-Za-z0-9(]/.test(parts[j + 1] || ""))
      parts[j] = "(" + x + ")";
  });
  var rel = /[=+<>\u2248\u2264\u2265\u2260\u2192\u00b1\u00d7\u00f7\u2212-]/;
  var p = "";
  parts.forEach(function(x){
    if(p && !/\s$/.test(p) && (rel.test(x.charAt(0)) || rel.test(p.slice(-1)))) p += " ";
    p += x;
  });
  return { m:m, p:p, i:i };
}

function texParse(src){
  var r = texSeq(texScan(src), 0, false);
  return { m:mrow(r.m), p:r.p.replace(/[ ]{4,}/g, "   ").trim() };
}

/* MathML is native everywhere current, but check rather than assume. */
var MATH_OK = null;
function mathSupported(){
  if(MATH_OK !== null) return MATH_OK;
  try{
    var d = document.createElement("div");
    d.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden";
    d.innerHTML = '<math><mspace height="23px" width="77px"></mspace></math>';
    document.body.appendChild(d);
    var box = d.firstChild.firstChild.getBoundingClientRect();
    document.body.removeChild(d);
    MATH_OK = Math.abs(box.height - 23) < 2 && Math.abs(box.width - 77) < 2;
  }catch(e){ MATH_OK = false; }
  return MATH_OK;
}

/* one expression */
function mtex(tex, display){
  var r = texParse(tex);
  if(mathSupported())
    return '<math' + (display ? ' display="block"' : "") + ">" + r.m + "</math>";
  return '<span class="eqtxt">' + esc(r.p) + "</span>";
}

/* prose with $…$ islands in it */
function mtxt(s){
  s = String(s);
  var parts = s.split("$");
  if(parts.length % 2 === 0) return esc(s);          /* unbalanced: leave it alone */
  return parts.map(function(part, i){
    return i % 2 ? mtex(part, false) : esc(part);
  }).join("");
}
(function(){

  if(k in mem) return mem[k];

  catch(e){ mem[k] = null; }

}

  if(p && p.picks) for(var k in p.picks){ done++; if(p.picks[k] === BANKS[id].q[k].a) right++; }
  return {done:done, right:right, total:BANKS[id].q.length};
}

  var panel = document.createElement("div"); panel.className="panel"; panel.id="panel";
  panel.innerHTML = '<div class="panel-in">'
    + '<div class="ph"><span class="eyebrow">Answer sheet &middot; '+vis.length+' questions</span>'
    + '<button class="x" id="p-close">Close &times;</button></div>'
    + '<div class="pset">'
    + '<select id="f-topic"><option value="*">All topics</option>'+topics+'</select>'
    + '<button id="t-mode" aria-pressed="'+(state.mode==="exam")+'">Exam mode</button>'
    + '<button id="t-shuffle">Shuffle</button>'
    + '<button id="t-results">Results</button>'
    + '<button id="t-reset">Clear</button></div>'
    + '<div class="grid" id="grid">'+cells+'</div></div>';
  document.body.appendChild(scrim); document.body.appendChild(panel);

  scrim.onclick = function(){ closePanel(); };
  document.getElementById("p-close").onclick = function(){ closePanel(); };
  document.getElementById("f-topic").onchange = function(){
    state.topic = this.value; state.i = 0; closePanel(); renderQuiz(); window.scrollTo(0,0); };
  document.getElementById("t-mode").onclick = function(){
    state.mode = state.mode==="exam" ? "study" : "exam"; persist(); closePanel(); renderQuiz(); };
  document.getElementById("t-shuffle").onclick = function(){
    shuffle(state.order); state.i=0; closePanel(); renderQuiz(); window.scrollTo(0,0); };
  document.getElementById("t-results").onclick = function(){
    closePanel(); go("#"+state.bank+"/results"); };
  document.getElementById("t-reset").onclick = function(){
    if(confirm("Clear every answer in this bank?")){
      state.picks={}; drop(state.bank); persist(); state.i=0; closePanel(); renderQuiz(); } };
  document.getElementById("grid").onclick = function(e){
    var c = e.target.closest("[data-jump]"); if(!c) return;
    state.i = +c.dataset.jump; closePanel(); drawQuestion(); refreshChrome(); window.scrollTo(0,0); };
  var cur = panel.querySelector('[aria-current="true"]');
  if(cur && cur.scrollIntoView) cur.scrollIntoView({block:"center"});
}
function closePanel(silent){
  var s = document.getElementById("scrim"), p = document.getElementById("panel");
  if(s) s.remove(); if(p) p.remove();
  if(!silent) state.panel = false;
}

/* ── results ───────────────────────────────────────────────────── */
function renderResults(){
  closePanel();
  var b = BANKS[state.bank], vis = visible();
  document.body.setAttribute("data-view","quiz");
  document.documentElement.setAttribute("data-course", b.course);

  var right=0, wrong=0, skipped=0, byTopic={}, misses=[];
  vis.forEach(function(i){
    var q=b.q[i], p=state.picks[i];
    if(!byTopic[q.t]) byTopic[q.t]={r:0,n:0};
    if(p===undefined){ skipped++; return; }
    byTopic[q.t].n++;
    if(p===q.a){ right++; byTopic[q.t].r++; } else { wrong++; misses.push({q:q,p:p,i:i}); }
  });
  var answered = right+wrong, pct = answered ? Math.round(right/answered*100) : 0;
  var verdict = !answered ? "Nothing marked yet. Answer some questions and come back."
    : pct>=80 ? "Strong. Work the misses below, then move to the other bank."
    : pct>=60 ? "Solid base. The topic breakdown shows where the marks are leaking."
    : "Worth a second pass. Read the explanations on the misses before you re-run this bank.";

  var rows = Object.keys(byTopic).filter(function(t){ return byTopic[t].n; })
    .sort(function(a,c){ return (byTopic[a].r/byTopic[a].n)-(byTopic[c].r/byTopic[c].n); })
    .map(function(t){ var d=byTopic[t], p=Math.round(d.r/d.n*100);
      return '<div class="trow"><span class="nm">'+esc(t)+'</span>'
        + '<span class="tb"><i style="width:'+p+'%"></i></span>'
        + '<span class="sc">'+d.r+'/'+d.n+'</span></div>'; }).join("");

  var review = misses.slice(0,60).map(function(m){
    return '<div class="rv"><div class="q"><b>'+(m.i+1)+'.</b> '+mtxt(m.q.q)+'</div>'
      + '<div class="a yours"><span class="m">You</span><span>'+LET[m.p]+' &middot; '+mtxt(m.q.o[m.p])+'</span></div>'
      + '<div class="a right"><span class="m">Answer</span><span>'+LET[m.q.a]+' &middot; '+mtxt(m.q.o[m.q.a])+'</span></div>'
      + '<div class="a"><span class="m">Why</span><span>'+mtxt(m.q.w)+'</span></div></div>'; }).join("");

  app.innerHTML = '<div class="qpage">'
    + '<div class="qbar"><div class="qbar-in">'
    + '<button class="exit" data-home>&larr; Banks</button>'
    + '<span class="name">'+esc(b.title)+' &middot; result</span></div>'
    + '<div class="qprog"><i style="width:100%"></i></div></div>'
    + '<div class="qbody"><div class="col">'
    + '<section class="result"><span class="eyebrow">Result'
    + (state.topic==="*" ? "" : " &middot; "+esc(state.topic))+'</span>'
    + '<div class="pct">'+pct+'<span style="font-size:.4em">%</span></div>'
    + '<h2>'+right+' of '+answered+' correct</h2><p class="line">'+verdict+'</p>'
    + '<div class="stats">'
    + '<div class="stat"><div class="v ok">'+right+'</div><div class="l">Right</div></div>'
    + '<div class="stat"><div class="v no">'+wrong+'</div><div class="l">Wrong</div></div>'
    + '<div class="stat"><div class="v">'+skipped+'</div><div class="l">Unanswered</div></div>'
    + '<div class="stat"><div class="v">'+vis.length+'</div><div class="l">In this run</div></div></div>'
    + (rows ? '<span class="eyebrow">By topic &middot; weakest first</span><div class="bytopic">'+rows+'</div>' : '')
    + '</section>'
    + (review ? '<span class="eyebrow" style="display:block;margin:30px 0 0">What you missed</span>'
        + '<div class="review">'+review+'</div>' : '')
    + '</div></div>'
    + '<div class="qfoot"><div class="qfoot-in">'
    + '<button class="btn pri" id="r-back">Back to questions</button>'
    + '<button class="btn" id="r-retry">Retry shuffled</button>'
    + '<button class="btn" data-home>Banks</button></div></div></div>';

  document.getElementById("r-back").onclick = function(){ go("#"+state.bank); };
  document.getElementById("r-retry").onclick = function(){
    state.picks={}; drop(state.bank); persist();
    shuffle(state.order); state.i=0; state.topic="*"; go("#"+state.bank); window.scrollTo(0,0); };
  window.scrollTo(0,0);
}

/* ── theme ─────────────────────────────────────────────────────── */
var THEMES = ["system","light","dark"];
function applyTheme(t){
  if(t==="system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  var btn = document.getElementById("theme-btn");
  if(btn) btn.textContent = t==="system" ? "Theme · auto" : "Theme · "+t;
  save("theme", t);
}
document.getElementById("theme-btn").onclick = function(){
  var cur = load("theme") || "system";
  applyTheme(THEMES[(THEMES.indexOf(cur)+1)%THEMES.length]);
};

/* ── wiring ────────────────────────────────────────────────────── */
document.getElementById("home-btn").onclick = function(){ go("#"); };
app.addEventListener("click", function(e){
  var g = e.target.closest("[data-go]");
  if(g){ go("#"+g.dataset.go); window.scrollTo(0,0); return; }
  if(e.target.closest("[data-home]")){ go("#"); window.scrollTo(0,0); }
});
document.addEventListener("keydown", function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  var tag = document.activeElement ? document.activeElement.tagName : "";
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(tag)) return;
  var k = e.key.toLowerCase();
  if(k==="escape"){ if(state.panel){ closePanel(); } else { go("#"); } return; }
  if(state.view !== "quiz") return;
  if(state.panel) return;
  var vis = visible(), q = vis.length ? BANKS[state.bank].q[vis[state.i]] : null;
  var li = LET.map(function(l){return l.toLowerCase();}).indexOf(k);
  if(li===-1 && k>="1" && k<="6") li = +k-1;
  if(li>-1 && q && li<q.o.length){ e.preventDefault(); choose(li); return; }
  if(k==="arrowright"||k==="enter"){ e.preventDefault(); advance(); }
  else if(k==="arrowleft"){ e.preventDefault(); prev(); }
  else if(k==="j"){ e.preventDefault(); openPanel(); }
});

applyTheme(load("theme") || "system");
route();
})();
</script>
</body>
</html>
