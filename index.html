wheels are alloy — these things can be remedied with money.<\/p><p><b>Conditions<\/b> <b>Warranties<\/b><\/p><p>Importance Major / goes to the root Minor / subsidiary<\/p><p>Breach entitles party to...<\/p><p>Terminate the contract AND claim damages<\/p><p>Claim damages ONLY (cannot terminate)<\/p><p>Example Ordered a car; bicycle delivered<\/p><p>Ordered a black car; white car delivered<\/p><h3 id=\"cil-class-3-11\">C. Innominate (Intermediate) Terms<\/h3><p>Innominate or intermediate terms are the hybrid — they sit between conditions and warranties. Most times, the court might not be able to determine immediately whether a breach should be classified as a breach of a condition or a warranty.<\/p><p><b>Example:<\/b> You order a Toyota car and what is delivered is a Toyota Highlander instead of a Toyota Camry, or even a Honda CR-V. The court might find it difficult to immediately classify that as a breach of a condition or a warranty.<\/p><p>For innominate terms, the court uses the <b>substantial benefit test<\/b>: did the breach deprive the innocent party of <b>substantially all the benefits<\/b> they should have enjoyed under the contract?<\/p><ul><li>If <b>yes<\/b> — the court treats it as a <b>condition<\/b> (innocent party can terminate and claim damages).<\/li><li>If <b>no<\/b> — the court treats it as a <b>warranty<\/b> (innocent party can only claim damages).<\/li><\/ul><h3 id=\"cil-class-3-12\">Q&amp;A;: What If Severity Is Subjective?<\/h3><p><i>Student question: If something is serious to one party but not to another, how does the court judge severity?<\/i><\/p><p>The parties are free to include anything they want, so they might even expressly state in the contract that a particular term is very important — they can label it a condition. The court would most likely agree with whatever the parties have decided, because the aim of the court is not to rewrite the contract for the parties but to enforce it.<\/p><p>However, there are cases where the court has decided that even though both parties agreed that something is a condition, it is not serious enough to be treated as one. In such a case, the court asks: can money fix it? For example, if you want everything pink and the car or house was not painted pink — the court might ask whether the other party can simply pay extra money to have it redone. If money can cure it, the court may treat it as a warranty, not a condition.<\/p><h2 id=\"cil-class-3-13\">4. Types of Contractual Terms<\/h2><p>There are two main types of terms: <b>express terms<\/b> and <b>implied terms<\/b>.<\/p><h3 id=\"cil-class-3-14\">A. Express Terms<\/h3><p>Express terms are those terms that have been precisely agreed upon by the parties. They may be <b>written or<\/b> <b>oral<\/b>. These are the things that the parties explicitly, specifically agreed on — either by written words or spoken words.<\/p><h3 id=\"cil-class-3-15\">B. Implied Terms<\/h3><p>Implied terms, on the other hand, are those terms that the parties did not specifically agree upon. The parties probably did not even discuss them at all. But these terms are read into the contract by the courts, by custom, or by statute. They are deemed part of the contract even though the parties did not expressly state them.<\/p><p>Implied terms are classified into three: terms implied by <b>courts<\/b>, terms implied by <b>custom or usage<\/b>, and terms implied by <b>statute<\/b>.<\/p><h3 id=\"cil-class-3-16\">i. Terms Implied by Courts<\/h3><p>Courts are usually <b>reluctant<\/b> to imply terms into a contract because of the principle of party autonomy — parties are expected to take care of their own agreements and their own interests. The business of the court is to enforce the contract, not to write or rewrite it for the parties.<\/p><p>But there are limited instances where the court has to imply terms into a contract. For the court to do so, it uses two tests:<\/p><h3 id=\"cil-class-3-17\">a. The Officious Bystander Test<\/h3><p>An officious bystander is an imaginary person — not a real person. The court asks: if an officious bystander were asked, 'Do you think the parties would have included this particular term in their contract if they had<\/p><p>thought about it?' If the officious bystander would say 'Of course, yes,' then the court will go ahead and read that term into the contract. If the officious bystander would say 'Not really,' then the court will not imply it.<\/p><p><b>Example — Restaurant and Rotten Food:<\/b> You walk into a restaurant and order rice, plantain, and assorted meat — goat meat, beef, chicken, egg. You and the seller agree on the price: 10,000 naira. Those are the express terms. But when you eat the food, you realise it is rotten and full of stones. The seller says: 'Did we agree that I would sell you fresh food? There is no such term in our contract.' You go to court. The court asks an officious bystander: 'Do you think the parties would have put a term in their contract that the food should be fresh and stone-free, if they had thought about it?' The officious bystander would say: 'Of course, yes.' So the court implies the term that the food should be fresh and free from stones.<\/p><h3 id=\"cil-class-3-18\">b. The Business Efficacy Test<\/h3><p>The court may also imply a term where it is necessary to give business efficacy to the contract — that is, to make the contract workable, more efficient, or even doable in the first place.<\/p><p><b>Example — Mechanic and Towing:<\/b> You hire a mechanic to come and fix your car. The express terms are: the mechanic will come to your location, fix the car, and you will pay a sum of money. But when the mechanic arrives, he realises the problem cannot be fixed on the spot — the car needs to be towed to his workshop. You say: 'We did not agree on towing; I will not pay for it.' The mechanic goes to court. The court uses the business efficacy test and says: to be able to perform this contract, it is necessary that the car be towed to the workshop. So the court implies the term that you must pay for towing, because without it, the contract simply cannot be performed.<\/p><p>The court only implies terms that are beneficial and that the parties would have agreed upon if they had thought about it. The aim is to make the contract easier, more efficient, or doable.<\/p><h3 id=\"cil-class-3-19\">ii. Terms Implied by Custom or Usage<\/h3><p>There are times when certain terms, which the parties did not expressly agree upon, form part of the contract because that particular practice is recognised, is notorious, and is well known in that industry. The parties in that industry are aware that such terms usually apply to their contracts.<\/p><p><b>Example — Agency Fees:<\/b> When you enter into a contract to buy, sell, or lease a house, it has become the custom that agency fees will be paid. Even if the parties did not specifically agree by written or oral words that agency fees will be paid, the court might read such a term into the contract simply because it has been done over time, it has become a custom in that industry, it is notorious — everyone knows it — and it does not go against natural justice.<\/p><p>The same applies in shipping contracts and other industries where certain terms automatically form part of the contract due to established market customs.<\/p><h3 id=\"cil-class-3-20\">iii. Terms Implied by Statute<\/h3><p>Statutes are written laws. Some statutes contain provisions that require certain terms to be read into contracts, whether the parties agreed upon them or not. Examples include the <b>Sale of Goods Act<\/b>, the <b>Federal Competition and Consumer Protection Act (FCCPA)<\/b>, and the <b>Hire Purchase Act<\/b>.<\/p><p>We will focus on the <b>Sale of Goods Act<\/b>, particularly Sections 12 to 15, which imply certain terms into contracts for the sale of goods.<\/p><h2 id=\"cil-class-3-21\">5. Implied Terms Under the Sale of Goods Act<\/h2><h3 id=\"cil-class-3-22\">Section 12 — Implied Condition as to Title<\/h3><p>The Sale of Goods Act implies that the seller must have <b>good title<\/b> — that is, the seller must either own the property or have authority to transfer ownership. You cannot sell what you do not have. If you do not have the right to the property, you cannot sell it.<\/p><p>If the parties enter into a contract and it turns out the seller does not have good title — the seller is not the owner, or is borrowing the property — there is an implied condition that has been breached. Since this is a <b>condition<\/b>, the innocent party can <b>terminate the contract and claim damages<\/b>.<\/p><p>Even though the parties did not expressly agree on a provision about title, Section 12 has read it into the contract: there is a promise that the seller has the right to sell.<\/p><p>Section 12 also implies two <b>warranties<\/b>:<\/p><ul><li><b>Quiet Possession:<\/b> The buyer must be able to enjoy quiet possession of the goods. It should not be the case that the buyer is using the property and people the seller owes keep coming to disturb the buyer's enjoyment. For example, if the seller did not pay customs duties on a car, and customs officials keep harassing the buyer every time they drive it — that is a breach of the implied warranty of quiet possession.<\/li><li><b>Freedom from Undisclosed Charges and Encumbrances:<\/b> If there is some sort of loan that the seller collected and used the property as collateral, the seller has a duty to inform the buyer before the contract is entered into. Undisclosed charges or encumbrances on the property constitute a breach of this implied warranty.<\/li><\/ul><p><b>Case Example:<\/b> There was a case where somebody leased a machine meant to spray the lines on roads. It turned out the seller did not have the right to sell, and the buyer was being disturbed — not allowed to use the machine as someone who now had possession. That was depriving the buyer of quiet possession.<\/p><h3 id=\"cil-class-3-23\">Section 13 — Implied Condition as to Description<\/h3><p>Where goods are sold by description, there is an <b>implied condition<\/b> that the goods will <b>correspond exactly<\/b> <b>with the description<\/b>.<\/p><p>What are goods sold by description? These are goods where, when the buyer was buying them, the buyer did not have the opportunity to see, touch, or feel the physical goods. The only thing used in determining whether to buy was the description provided by the seller — a picture, a listing, specifications, etc.<\/p><p>This is different from buying at a market where you can pick up the item, test it, try it in your mouth, or feel the texture. When you buy from a market, you use your senses to determine how good the goods are.<\/p><p><b>Example — Online Shopping:<\/b> Buying something online is a good example of sale by description. You cannot test or touch the goods — you can only see the picture provided by the seller. Many people have experienced buying what they thought was a full-sized fridge from an online platform like Temu, only to realise it is a miniature decorative toy. The picture was taken in a way that made it look like a full-sized appliance.<\/p><p>If the goods do not correspond with the description, then the implied condition has been breached, and the other party can <b>terminate the contract<\/b>.<\/p><h3 id=\"cil-class-3-24\">Section 14 — Implied Terms as to Quality and Fitness for Purpose<\/h3><p>The general rule is <i><b>caveat emptor<\/b><\/i> — 'let the buyer beware.' The buyer has the responsibility to do due diligence, to inspect the goods, and to make decisions that are in their best interest. The aim of the court is<\/p><p>not simply to protect you from making bad decisions.<\/p><p>However, where the seller sells goods in the course of business, the law implies two important conditions:<\/p><h3 id=\"cil-class-3-25\">(a) Merchantable / Satisfactory Quality<\/h3><p>The goods must be of <b>satisfactory quality<\/b>, meaning a reasonable person would regard them as acceptable considering their description, price, and other relevant circumstances. They do not have to be the best quality, but they must have acceptable quality.<\/p><h3 id=\"cil-class-3-26\">(b) Fitness for Purpose<\/h3><p>For a party to rely on this provision, two things must be shown:<\/p><ul><li>The buyer <b>made known<\/b> to the seller the specific purpose for which the goods are required.<\/li><li>The buyer <b>relied on the seller's skill or judgment<\/b>.<\/li><\/ul><p>If both conditions are met, there is an implied condition that the goods will be reasonably fit for that purpose.<\/p><p><b>Example 1 — Tomatoes:<\/b> If you go to buy tomatoes and you need the hard ones specifically for frying eggs, you cannot go back and sue the seller for selling tomatoes that are not fit for your purpose — unless you informed the seller what you needed them for and relied on the seller's judgment.<\/p><p><b>Example 2 — Running Shoes:<\/b> You need lightweight running shoes that will protect your ankle. You tell the seller the specific purpose, and the seller says: 'Buy these ones.' You rely on that judgment and buy them. If the shoes turn out to be too heavy and not suitable for running, you can sue the seller for breaching the implied condition as to fitness for purpose.<\/p><p><b>Example 3 — Fan for a Child:<\/b> You want a fan that blows air (not the newer AC fans that blow cool mist) specifically because your child likes to stand in front of it and sing, and the air makes their voice shake. You tell the seller this specific purpose and rely on their expertise. If the fan turns out not to be fit for that purpose, you can bring an action.<\/p><p>However, if you told the seller the purpose but <b>did not rely<\/b> on the seller's opinion — you still went ahead and bought something else — you cannot rely on this implied condition.<\/p><h3 id=\"cil-class-3-27\">Section 15 — Implied Condition in Sale by Sample<\/h3><p>Where goods are sold by reference to a sample, three conditions are implied:<\/p><ul><li>The <b>bulk of the goods<\/b> must correspond with the <b>sample in quality<\/b>. You cannot show a high-quality sample and then supply goods of lesser quality.<\/li><li>The buyer must have a <b>reasonable opportunity to compare<\/b> the bulk of the goods with the sample.<\/li><li>The goods must be <b>free from latent defects<\/b> — defects that would not be apparent upon reasonable examination of the sample. If there were defects on the body of the sample, the buyer would have seen them and negotiated accordingly. But if the defects are hidden and not obvious, the law protects the buyer.<\/li><\/ul><p>If the goods do not correspond with the sample or have latent defects, the innocent party can terminate the contract.<\/p><p>Even if the parties did not add this into the contract expressly, the court can read such terms into the contract because the law (the Sale of Goods Act) provides for it.<\/p><h2 id=\"cil-class-3-28\">6. Closing Remarks<\/h2><p>Exclusion clauses were mentioned but not covered in detail in this class. The lecturer noted that slides would be shared for all previous classes.<\/p><p>In the next class, a different lecturer will take over to cover <b>capacity<\/b> and other remaining topics.<\/p><h2 id=\"cil-class-3-29\">Summary — Terms of Contract at a Glance<\/h2><p><b>Topic<\/b> <b>Key Points<\/b><\/p><p>Terms vs. Representations<\/p><p>Terms = legally binding statements that form part of the contract. Representations = non-binding statements made during negotiation.<\/p><p>4 Tests to Distinguish<\/p><p>1. Stage of contract (early = representation, late = term) 2. Reduced to writing (in writing = term, not = representation) 3. Special knowledge (expert = term, layman = representation) 4. Importance communicated (important = term)<\/p><p>3 Categories of Terms<\/p><p>Conditions: major; breach = terminate + damages Warranties: minor; breach = damages only Innominate: hybrid; court uses substantial benefit test<\/p><p>Express vs. Implied Terms<\/p><p>Express: specifically agreed upon (written or oral) Implied: read in by courts, custom/usage, or statute<\/p><p>Implied by Courts<\/p><p>Officious bystander test + Business efficacy test Courts are reluctant; only where necessary<\/p><p>Sale of Goods Act Ss.12-15<\/p><p>S.12: Title (condition) + quiet possession (warranty) S.13: Sale by description — must correspond exactly S.14: Quality and fitness for purpose (caveat emptor) S.15: Sale by sample — bulk must match sample<\/p><p><i>These notes were compiled from a class transcript and lecture slides (June 4, 2025). Transcription errors have been corrected<\/i> <i>using the slide content as reference. The lecturer's intended meaning has been preserved throughout.<\/i><\/p>", "toc": [{"id": "cil-class-3-0", "t": "Recap from Previous Classes", "lv": 2}, {"id": "cil-class-3-1", "t": "1. Terms of Contract — Introduction", "lv": 2}, {"id": "cil-class-3-2", "t": "Terms vs. Representations", "lv": 3}, {"id": "cil-class-3-3", "t": "2. Tests for Distinguishing Terms from Representations", "lv": 2}, {"id": "cil-class-3-4", "t": "Test 1: Stage of the Contract", "lv": 3}, {"id": "cil-class-3-5", "t": "Test 2: Agreements Reduced to Writing", "lv": 3}, {"id": "cil-class-3-6", "t": "Test 3: Special Knowledge and Skill", "lv": 3}, {"id": "cil-class-3-7", "t": "Test 4: Importance of the Statement", "lv": 3}, {"id": "cil-class-3-8", "t": "3. Categories of Contractual Terms", "lv": 2}, {"id": "cil-class-3-9", "t": "A. Conditions", "lv": 3}, {"id": "cil-class-3-10", "t": "B. Warranties", "lv": 3}, {"id": "cil-class-3-11", "t": "C. Innominate (Intermediate) Terms", "lv": 3}, {"id": "cil-class-3-12", "t": "Q&A;: What If Severity Is Subjective?", "lv": 3}, {"id": "cil-class-3-13", "t": "4. Types of Contractual Terms", "lv": 2}, {"id": "cil-class-3-14", "t": "A. Express Terms", "lv": 3}, {"id": "cil-class-3-15", "t": "B. Implied Terms", "lv": 3}, {"id": "cil-class-3-16", "t": "i. Terms Implied by Courts", "lv": 3}, {"id": "cil-class-3-17", "t": "a. The Officious Bystander Test", "lv": 3}, {"id": "cil-class-3-18", "t": "b. The Business Efficacy Test", "lv": 3}, {"id": "cil-class-3-19", "t": "ii. Terms Implied by Custom or Usage", "lv": 3}, {"id": "cil-class-3-20", "t": "iii. Terms Implied by Statute", "lv": 3}, {"id": "cil-class-3-21", "t": "5. Implied Terms Under the Sale of Goods Act", "lv": 2}, {"id": "cil-class-3-22", "t": "Section 12 — Implied Condition as to Title", "lv": 3}, {"id": "cil-class-3-23", "t": "Section 13 — Implied Condition as to Description", "lv": 3}, {"id": "cil-class-3-24", "t": "Section 14 — Implied Terms as to Quality and Fitness for Purpose", "lv": 3}, {"id": "cil-class-3-25", "t": "(a) Merchantable / Satisfactory Quality", "lv": 3}, {"id": "cil-class-3-26", "t": "(b) Fitness for Purpose", "lv": 3}, {"id": "cil-class-3-27", "t": "Section 15 — Implied Condition in Sale by Sample", "lv": 3}, {"id": "cil-class-3-28", "t": "6. Closing Remarks", "lv": 2}, {"id": "cil-class-3-29", "t": "Summary — Terms of Contract at a Glance", "lv": 2}]}]}, "cil-class-4": {"course": "CIL", "ref": "Class 4", "title": "Capacity to Contract", "kicker": "Class notes · Folake Adewumi · Delivered via Zoom", "words": 2251, "parts": [{"label": "", "note": "", "src": "Class 4 - CIL_Law_of_Engineering_Contract_Class4_Notes.pdf", "html": "<h2 id=\"cil-class-4-0\">1. Introduction — What is Capacity to Contract?<\/h2><p>Capacity to contract refers to the <b>legal competence<\/b> of a person or organisation to enter into a binding, enforceable agreement. It requires being of sound mind, of legal age, and not disqualified by law.<\/p><p>In simpler terms, it is the ability — being in the right state of mind — to contract with another party.<\/p><h2 id=\"cil-class-4-1\">2. The General Rule<\/h2><p>The general rule according to law is that <b>everybody is fully capable of entering into a contract<\/b>. That is the general principle.<\/p><p>However, the law is living — it is not static. It evolves with man. When you have general rules, there are always exceptions. Why? Because the law evolves with society. What applied yesterday may not suffice for the present. The law will find exceptions so that there will be equity and justice. The purpose of law is for equity and for justice. Man is not made for law — law is made for man. So we do not let law stand the way it is; we keep improving on it, and it is the improvement of the law that brings about exceptions.<\/p><h2 id=\"cil-class-4-2\">3. Exceptions — Persons with Limited Capacity<\/h2><p>If we say everybody can enter into a contract, there are some people who do not have the prerequisites — they do not have the mental ability or the social ability to be a party to a contract. The law says there is a possibility that those people are victims, and so, in the process of trying to protect those people, we have exceptions.<\/p><p>The law regards certain <b>classes of persons as needing protection<\/b>, so certain limitations are imposed upon their rights to contract. These persons include:<\/p><ul><li><b>Infants<\/b> (children / minors)<\/li><li><b>Insane persons<\/b> (mentally disordered persons)<\/li><li><b>Drunken persons<\/b><\/li><li><b>Illiterate persons<\/b><\/li><li><b>Corporations<\/b><\/li><\/ul><h2 id=\"cil-class-4-3\">4. Infants (Minors)<\/h2><h3 id=\"cil-class-4-4\">A. Who Is an Infant in Law?<\/h3><p>In contractual matters, an infant in Nigeria is a person under the age of 21 years under the common law. Common law has traditionally afforded protection to this category of persons from entering into obligations that they would not have were they more experienced. The degree of protection depends on the category of contract involved.<\/p><h3 id=\"cil-class-4-5\">B. The Age of Majority — 21 or 18?<\/h3><p>The answer to the question 'who is a child?' depends on the context — criminal, marriage, voting, driving, religious, or cultural. The National Child Welfare Policy of 1989 defines a child as anybody who is 12 years or below. The voting age is 18. In criminal law, a child is a person under 14, and young persons are between 14 and 17.<\/p><p>The focus in this class is on <b>contractual capacity<\/b>. Contracts made by infants are governed by the rules of common law as altered by the Infants Relief Act 1874. A child under common law is anyone below the age of 21.<\/p><p>However, the age of majority (maturity), which was formerly 21, had been reduced to 18 in Britain when it was realised that more and more people between 18 and 21 years were playing active roles in the commercial scene.<\/p><p><b>Section 277 of the Child's Rights Act (2003)<\/b>, which has been adopted by 34 states in Nigeria, defines a 'child' as a person under the age of eighteen years. However, <b>Kano<\/b> and <b>Zamfara<\/b> have not yet domesticated the Act.<\/p><h3 id=\"cil-class-4-6\">Relevant Cases<\/h3><p><b>Folata v. Dowoma<\/b> <i>(1970) NWLR 105<\/i> — In this case, a youth sold a family house. It was held that under Muslim law, maturity is determined by physical development or a declaration of the youth in question, or by reaching the age of 15 lunar months.<\/p><p><b>Labinjoh v. Abake<\/b> <i>(1974) 5 NLR 33<\/i> — The argument that contractual capacity in Nigeria should be when a person attains puberty or physical maturity was rejected. 18 years in contract of trade was held not necessary.<\/p><p><b>Discussion Question from the Slide:<\/b> <i>Is the reduction of age of majority in Britain and Nigeria beneficial or<\/i> <i>prejudicial to a child? Will you advocate a further reduction especially in this computer age?<\/i><\/p><h2 id=\"cil-class-4-7\">5. Types of Contracts Under Infant Capacity<\/h2><p>The fact that we said this set of people cannot be involved in contracts does not mean that they are strictly stopped from all contracts. There are categories of contracts that children can enter into, and ones that they obviously should not.<\/p><p><b>Important:<\/b> It is <b>not a criminal offence<\/b> to enter into a contract with someone who is underage. It is only when criminal conduct is involved (e.g., fraud) that criminal law applies. Contracting with a minor is a <b>civil<\/b> matter, not a criminal one. Nobody will be jailed; the issue is about damages and enforceability.<\/p><h3 id=\"cil-class-4-8\">(a) Contracts That Are Binding<\/h3><p>An infant is bound by the following contracts:<\/p><h3 id=\"cil-class-4-9\">(i) Contracts for Necessaries<\/h3><p>Necessaries have been defined as 'goods suitable to the condition in life of the infant and to his actual requirements at the time of sale and delivery.' The term covers essential things such as food, drink, clothing, and shelter. It also covers items which, though not strictly necessary, are appropriate to the infant's financial and social status.<\/p><p>So a person under 18 can go to Yaba market and buy clothing. A child can go to a restaurant and buy food. Some of you got an apartment in Part 1 when you were not even 18 — under the law, that is agreed upon because shelter is a necessary.<\/p><h3 id=\"cil-class-4-10\">(ii) Beneficial Contracts of Service<\/h3><p>These are contracts under which an infant receives training or instruction for their future career. They are a form of necessaries in that by entering into a contract of service, apprenticeship, instruction, or training, the infant receives real benefit by being equipped to earn a livelihood.<\/p><p>The validity of such a contract is, however, subject to the condition that the contract as a whole is substantially to the infant's advantage and benefit. It is possible that while some of the terms may appear to exploit the infant's inexperience, others may be manifestly to his benefit.<\/p><p>Examples include: going to school (education is a beneficial contract), apprenticeships, learning tailoring, carpentry, and other trades. These are contracts you can enter into as a younger person below 18 because they benefit you in the future.<\/p><h3 id=\"cil-class-4-11\">(b) Voidable Contracts<\/h3><p>These are contracts in respect of which an infant acquires an interest in property of a permanent nature, to which continuing obligations attach. Examples include <b>leases<\/b>, <b>partnerships<\/b>, and <b>contracts for the<\/b> <b>purchase of shares<\/b> in a company.<\/p><p>The general rule is that such contracts are regarded as valid and binding on an infant unless they are repudiated either during infancy or within a <b>reasonable time of reaching his majority<\/b>.<\/p><p>The validity of the contract is in the hands of the child. If a 15-year-old girl or 16-year-old boy buys shares or leases a property, the contract will be valid until the child says 'I do not want to go ahead anymore — I want my money back.' The other party has no option but to return the money. This is because the law is trying to protect the child — there are times a child is being taken advantage of.<\/p><p>When the child reaches the age of majority (18 years), they must <b>ratify<\/b> the contract — that is, come back and say 'I want to go ahead with it.' If they do not ratify within a reasonable time, or if they reject or refuse the contract, the contract will not go ahead, and the child can be free from liability.<\/p><h3 id=\"cil-class-4-12\">Example — Sports Betting<\/h3><p>There was an issue on the internet where a 12-year-old boy won millions on SportyBet and they refused to credit him because he was under 18. The betting site's rules state that you must be 18 before you can bet. Should the child have been betting in the first place? They were collecting his money, yes, but was he supposed to have paid it? The betting site had clearly stated the age requirement. The law also encourages morality.<\/p><h3 id=\"cil-class-4-13\">(c) Void Contracts<\/h3><p><b>Section 1 of the Infant's Relief Act 1874<\/b> provides that the following contracts, if entered into by an infant, are <b>absolutely void<\/b> — null and void, with no basis whatsoever:<\/p><ul><li><b>(a) Contracts for the payment of money lent or to be lent.<\/b> You cannot lend money to a child. If they come tomorrow and say they are not paying, they will not pay you. A child cannot borrow money from a bank — it is illegal.<\/li><li><b>(b) Contracts for goods supplied or to be supplied which are not necessaries.<\/b> You cannot buy and sell with a child if the goods are not necessaries (food, shelter, clothing, beneficial services).<\/li><li><b>(c) Accounts stated<\/b> — i.e., an admission of debt or IOU. A child cannot sign an IOU or be involved in account settlements.<\/li><\/ul><h2 id=\"cil-class-4-14\">6. Other Persons with Limited Capacity (From Slides)<\/h2><p>The following categories were shown on the slides but will be covered in more detail in the next class. A brief summary from the slide content:<\/p><h3 id=\"cil-class-4-15\">A. Insane Persons<\/h3><p>Contracts made with mentally disordered persons are <i>prima facie<\/i> valid — that is, the insane person is bound by the contract unless he can prove: (i) that owing to his mental state he did not understand the nature of the contract, and (ii) that his condition was known to the other party. Where these two conditions are proved, the contract becomes voidable and can be set aside at the option of the insane person.<\/p><p>However, contracts entered into by a mentally disordered person during <b>lucid intervals<\/b> are valid and binding. Even while suffering from the disorder, such a person is liable for necessaries (goods and services suitable to his position in life), and the obligation is to pay a <b>reasonable price<\/b>.<\/p><h3 id=\"cil-class-4-16\">B. Drunken Persons<\/h3><p>The rules governing a drunkard's contractual liability are similar to those for insane persons. Where a person enters into a contract in a state of drunkenness, the contract is voidable at the option of the drunkard. However, the contract can be expressly or impliedly ratified when the person returns to a state of soberness.<\/p><h3 id=\"cil-class-4-17\">C. Corporations<\/h3><p>A company registered under the Companies and Allied Matters Decree 1990 is recognised to have a legal personality, independent of the persons who are its members. The <b>Ultra Vires Doctrine<\/b> provides that companies must operate within their stated objectives. Acts beyond their stated objects may be void.<\/p><h2 id=\"cil-class-4-18\">7. Additional Slide Content — Waiver &amp; Promissory Estoppel<\/h2><p>The slides also contained the following topics which the lecturer briefly displayed:<\/p><h3 id=\"cil-class-4-19\">Waiver of a Contractual Right<\/h3><p>The rule that performance of a duty already owed to a promisor is not sufficient consideration applies to waiver of contractual rights as well. Thus, where a contracting party waives his rights under a contract, wholly or in part, the waiver is not binding unless consideration is given for it. This is better understood when discussed in relation to obligations created by debts. This is often referred to as the rule in <b>Pinnel's case<\/b>.<\/p><h3 id=\"cil-class-4-20\">Promissory Estoppel<\/h3><p>The rule in Pinnel's case can be circumvented by the doctrine of <b>promissory estoppel<\/b>. Where a party has waived or promised to waive his contractual rights against another, and that other party has changed his position in reliance on the waiver or promise, it would be unjust to allow an action against him on the original contract to succeed. Equity is fairness, and so it does not look with favour at a man who promises relief to another and then goes back on the promise.<\/p><h3 id=\"cil-class-4-21\">Exemption, Exclusion, or Limitation Clauses<\/h3><p>In entering into a contract, one of the parties may wish to escape from some obligations in certain events. The practice is to insert clauses which either exempt or exclude himself from such obligations, or simply limit the extent of his liability under the contract. In the spirit of freedom of contract, exclusion clauses are perfectly legitimate and the courts are normally prepared to uphold their validity. However, the courts will take into account the relative bargaining power of the parties.<\/p><p>Three requirements for valid exclusion clauses:<\/p><ul><li><b>(a) Notice:<\/b> The document relied on as containing the exclusion clause must be a contractual document, not a voucher or receipt after payment.<\/li><li><b>(b) Notice must be given<\/b> at or before the time of contracting.<\/li><li><b>(c) Signature:<\/b> A party who signs a document is generally bound by its terms, including exclusion clauses.<\/li><\/ul><h2 id=\"cil-class-4-22\">8. Coming Up in the Next Class<\/h2><p>The next class will cover <b>restitution by an infant<\/b>, and more detailed treatment of insane persons, drunken persons, and corporations.<\/p><h2 id=\"cil-class-4-23\">Summary — Capacity to Contract<\/h2><p><b>Topic<\/b> <b>Key Points<\/b><\/p><p>General Rule Everybody is fully capable of entering into a contract.<\/p><p>Protected Classes<\/p><p>Infants, insane persons, drunken persons, illiterate persons, corporations.<\/p><p>Age of Majority<\/p><p>Common law: 21 years. Child's Rights Act 2003: 18 years. Kano and Zamfara have not domesticated the Act.<\/p><p>Binding Contracts (Infants)<\/p><p>(i) Necessaries — food, clothing, shelter (ii) Beneficial contracts of service — education, apprenticeship<\/p><p>Voidable Contracts (Infants)<\/p><p>Shares, leases, partnerships. Valid unless repudiated during infancy or within reasonable time of reaching majority.<\/p><p>Void Contracts (Infants)<\/p><p>S.1 Infant's Relief Act 1874: (a) Money lent (b) Non-necessary goods (c) IOUs<\/p><p>Insane / Drunken<\/p><p>Prima facie valid; voidable if condition proved and known to other party. Still liable for necessaries.<\/p><p>Corporations Legal personality; limited by Ultra Vires Doctrine.<\/p><p><i>These notes were compiled from a Zoom class transcript and lecture slides. Transcription errors have been corrected and slide<\/i> <i>content integrated. Lecturer: Folake Adewumi.<\/i><\/p>", "toc": [{"id": "cil-class-4-0", "t": "1. Introduction — What is Capacity to Contract?", "lv": 2}, {"id": "cil-class-4-1", "t": "2. The General Rule", "lv": 2}, {"id": "cil-class-4-2", "t": "3. Exceptions — Persons with Limited Capacity", "lv": 2}, {"id": "cil-class-4-3", "t": "4. Infants (Minors)", "lv": 2}, {"id": "cil-class-4-4", "t": "A. Who Is an Infant in Law?", "lv": 3}, {"id": "cil-class-4-5", "t": "B. The Age of Majority — 21 or 18?", "lv": 3}, {"id": "cil-class-4-6", "t": "Relevant Cases", "lv": 3}, {"id": "cil-class-4-7", "t": "5. Types of Contracts Under Infant Capacity", "lv": 2}, {"id": "cil-class-4-8", "t": "(a) Contracts That Are Binding", "lv": 3}, {"id": "cil-class-4-9", "t": "(i) Contracts for Necessaries", "lv": 3}, {"id": "cil-class-4-10", "t": "(ii) Beneficial Contracts of Service", "lv": 3}, {"id": "cil-class-4-11", "t": "(b) Voidable Contracts", "lv": 3}, {"id": "cil-class-4-12", "t": "Example — Sports Betting", "lv": 3}, {"id": "cil-class-4-13", "t": "(c) Void Contracts", "lv": 3}, {"id": "cil-class-4-14", "t": "6. Other Persons with Limited Capacity (From Slides)", "lv": 2}, {"id": "cil-class-4-15", "t": "A. Insane Persons", "lv": 3}, {"id": "cil-class-4-16", "t": "B. Drunken Persons", "lv": 3}, {"id": "cil-class-4-17", "t": "C. Corporations", "lv": 3}, {"id": "cil-class-4-18", "t": "7. Additional Slide Content — Waiver & Promissory Estoppel", "lv": 2}, {"id": "cil-class-4-19", "t": "Waiver of a Contractual Right", "lv": 3}, {"id": "cil-class-4-20", "t": "Promissory Estoppel", "lv": 3}, {"id": "cil-class-4-21", "t": "Exemption, Exclusion, or Limitation Clauses", "lv": 3}, {"id": "cil-class-4-22", "t": "8. Coming Up in the Next Class", "lv": 2}, {"id": "cil-class-4-23", "t": "Summary — Capacity to Contract", "lv": 2}]}]}, "cil-class-5": {"course": "CIL", "ref": "Class 5", "title": "Capacity (contd.), Illiterate Persons & Privity of Contract", "kicker": "Class notes · 16 June 2026 · Folake Adewumi", "words": 1139, "parts": [{"label": "", "note": "", "src": "Class 5 - CIL_Law_of_Engineering_Contract_Class5_Notes.pdf", "html": "<h2 id=\"cil-class-5-0\">1. Infants / Minors — Recap<\/h2><p>The general rule when it comes to infants is that they do not have the right to contract. Know the case study of <b>Labinjoh v. Abake<\/b>.<\/p><h3 id=\"cil-class-5-1\">Contracts That Are Binding on Infants<\/h3><ul><li><b>Contracts for Necessaries:<\/b> Includes food, clothing, and shelter.<\/li><li><b>Contracts of Service / Education (Apprenticeship):<\/b> Training contracts that benefit the minor's future.<\/li><\/ul><h3 id=\"cil-class-5-2\">Voidable Contracts<\/h3><p>Contracts for lease, buying shares, and similar interests are <b>voidable<\/b>. Being voidable means the minor can terminate at any point in time.<\/p><p>When a minor comes to lease a property from you, you can enter into a contract signed by the <b>minor's<\/b> <b>guardian<\/b> — so that the minor does not come all of a sudden to void the contract.<\/p><h3 id=\"cil-class-5-3\">When a Child Commits an Offence<\/h3><p>When a child commits a common offence, the law allows it to go, then equity checks for justice (a kind of restitution). Below 12 years, the approach is <b>deterrent<\/b> (warning/correction). From 12 and above, the child is classified as a <b>juvenile<\/b>.<\/p><h2 id=\"cil-class-5-4\">2. Insane Persons<\/h2><p>Insane persons may have signed their contract in a <b>lucid state<\/b>. The general rule is that an insane person <b>can<\/b> enter into a contract.<\/p><p>As with other areas of law, there is a general rule and an exception. The exception is: the insane person can prove to the court that he was insane when he signed the contract. A <b>neurologist and psychiatrist<\/b> can test for his current state before bringing him to court. Additionally, the insane person must prove that <b>the other<\/b> <b>party was aware of his condition<\/b>.<\/p><h3 id=\"cil-class-5-5\">What to Do When an Insane Person Approaches to Enter a Contract<\/h3><p>If an insane person approaches you to enter into a contract, what should you do?<\/p><ul><li>Bring a <b>psychiatrist<\/b> to assess their mental state.<\/li><li>Bring their <b>next of kin<\/b>.<\/li><li>Bring a person whom they can <b>transfer their roles to<\/b> (a representative).<\/li><li>Bring <b>third-party witnesses<\/b>.<\/li><\/ul><h3 id=\"cil-class-5-6\">If Two Insane Persons Enter Into a Contract<\/h3><p>If two insane persons enter into a contract with each other, they can either <b>rectify and ratify<\/b> the contract, or <b>nullify<\/b> it entirely.<\/p><h2 id=\"cil-class-5-7\">3. Drunken Persons<\/h2><p>The same right that an insane person enjoys, a <b>drunkard can also enjoy<\/b> — that is, if he can prove that he was drunk at the time the contract was signed. The contract becomes voidable at the option of the drunkard.<\/p><h2 id=\"cil-class-5-8\">4. Corporations / Companies<\/h2><p>A company can be contracted with, but with some exceptions. There is something called <b>ultra vires<\/b>. When you see and find out that a company is going outside of their stated objectives, and they cannot deliver on what they promised, you can <b>nullify or void<\/b> the contract.<\/p><h2 id=\"cil-class-5-9\">5. Illiterate Persons<\/h2><p>An illiterate is a person who <b>cannot read or write in the language of the contract<\/b>. Special protections and procedures apply when contracting with illiterate persons.<\/p><h3 id=\"cil-class-5-10\">The Illiterate Jurat — Procedure for Contracting with Illiterates<\/h3><p>There is a person known as the <b>writer<\/b> (or jurat writer) — a person who writes the contract on behalf of the illiterate. The writer must:<\/p><ul><li><b>Write the name, thumbprint, and address<\/b> of the illiterate party (the illiterate jurat), so as to find them if anything happens.<\/li><li><b>Write exactly what the illiterate should do<\/b> under the contract.<\/li><li><b>Read out and explain<\/b> the entire contract to the illiterate, and ask if that is what they want.<\/li><li><b>Put a witness<\/b> (and ideally a third party) to witness the signing of the contract. A <b>video recording<\/b> is also advisable.<\/li><\/ul><h3 id=\"cil-class-5-11\">Consequences and Rules Regarding Illiterate Contracts<\/h3><h3 id=\"cil-class-5-12\">Consequence 1: Writer Must Not Benefit<\/h3><p>If the writer is the one benefiting the most from the contract, the contract is <b>void<\/b>. The writer is supposed to be a neutral party who writes, explains, and ensures the illiterate understands. The writer should not be the one gaining from the arrangement.<\/p><h3 id=\"cil-class-5-13\">Consequence 2: Third-Party Rights<\/h3><p>If the document creates rights between a third party and the illiterate, the contract is <b>enforceable<\/b> — but only if the third party can prove to the court that the illiterate was aware of the contract. This is possible provided the writer is not the one benefiting.<\/p><p>For example, if you enter a contract with an illiterate but the illiterate did not sign, the writer can get a third party who was present at the time to prove that the contract was explained and agreed upon.<\/p><h3 id=\"cil-class-5-14\">Consequence 3: Illiterate Can Enforce<\/h3><p>The illiterate can also <b>enforce the document<\/b> — if he can call evidence to prove what happened at the time the document was prepared. For example, in a contract between two illiterates, the law can be more lenient because neither party could read the terms.<\/p><h3 id=\"cil-class-5-15\">Penalty for Non-Compliance<\/h3><p>The fine for failing to follow the illiterate jurat procedure is <b>100 naira<\/b>, or an option of <b>6 months<\/b> <b>imprisonment<\/b>.<\/p><h2 id=\"cil-class-5-16\">6. Privity of Contract<\/h2><p>If Mr. A and Mr. B enter into a contract, they are the <b>only ones<\/b> who should benefit from the contract or seek redress. A third party has <b>no right<\/b> to benefit from or seek redress under the contract.<\/p><h3 id=\"cil-class-5-17\">Exceptions to Privity of Contract<\/h3><p>The following are recognised exceptions where a third party can have rights:<\/p><ul><li><b>Next of Kin / Property Law Cases:<\/b> When the children obtain ownership or letters of administration from the government to administer property left by deceased parents.<\/li><li><b>Transfer of Ownership:<\/b> When a transfer of ownership is made (assignment).<\/li><li><b>Third-Party Insurance Contract:<\/b> The injured third party can claim directly from the insurance company.<\/li><li><b>Trusteeship:<\/b> When a person (trustee) can access a property on behalf of beneficiaries (e.g., inheritance/estates).<\/li><li><b>Contractual Provision for Third Party:<\/b> When you include in your contract that the benefit should go to another person if you are not capable.<\/li><li><b>Agencies:<\/b> An agent acting on behalf of a principal can bind the principal to the contract.<\/li><\/ul><h2 id=\"cil-class-5-18\">Summary — Class 5 at a Glance<\/h2><p><b>Topic<\/b> <b>Key Points<\/b><\/p><p>Infants (Recap)<\/p><p>No right to contract. Binding: necessaries + service/education. Voidable: lease, shares (guardian can sign). Juvenile from 12.<\/p><p>Insane Persons<\/p><p>General rule: can contract. Exception: must prove insanity at time of signing + other party knew. Bring psychiatrist, next of kin, witnesses.<\/p><p>Drunken Persons<\/p><p>Same rights as insane persons. Must prove drunkenness at time of contract.<\/p><p>Corporations Can be contracted with. Ultra vires: if company acts outside stated objectives, contract can be nullified/voided.<\/p><p>Illiterate Persons<\/p><p>Cannot read/write in contract language. Illiterate jurat: writer records name, thumbprint, address; reads out and explains; witness + video. Writer must NOT benefit. Penalty: I100 fine or 6 months imprisonment.<\/p><p><b>Topic<\/b> <b>Key Points<\/b><\/p><p>Privity of Contract<\/p><p>Only parties to the contract can benefit or seek redress. Exceptions: next of kin/property, transfer of ownership, third-party insurance, trusteeship, contractual provision for third party, agencies.<\/p><p><i>These notes were reconstructed from handwritten class notes (dated 16/6/2026). Content has been structured and corrected for<\/i> <i>clarity. Lecturer: Folake Adewumi.<\/i><\/p>", "toc": [{"id": "cil-class-5-0", "t": "1. Infants / Minors — Recap", "lv": 2}, {"id": "cil-class-5-1", "t": "Contracts That Are Binding on Infants", "lv": 3}, {"id": "cil-class-5-2", "t": "Voidable Contracts", "lv": 3}, {"id": "cil-class-5-3", "t": "When a Child Commits an Offence", "lv": 3}, {"id": "cil-class-5-4", "t": "2. Insane Persons", "lv": 2}, {"id": "cil-class-5-5", "t": "What to Do When an Insane Person Approaches to Enter a Contract", "lv": 3}, {"id": "cil-class-5-6", "t": "If Two Insane Persons Enter Into a Contract", "lv": 3}, {"id": "cil-class-5-7", "t": "3. Drunken Persons", "lv": 2}, {"id": "cil-class-5-8", "t": "4. Corporations / Companies", "lv": 2}, {"id": "cil-class-5-9", "t": "5. Illiterate Persons", "lv": 2}, {"id": "cil-class-5-10", "t": "The Illiterate Jurat — Procedure for Contracting with Illiterates", "lv": 3}, {"id": "cil-class-5-11", "t": "Consequences and Rules Regarding Illiterate Contracts", "lv": 3}, {"id": "cil-class-5-12", "t": "Consequence 1: Writer Must Not Benefit", "lv": 3}, {"id": "cil-class-5-13", "t": "Consequence 2: Third-Party Rights", "lv": 3}, {"id": "cil-class-5-14", "t": "Consequence 3: Illiterate Can Enforce", "lv": 3}, {"id": "cil-class-5-15", "t": "Penalty for Non-Compliance", "lv": 3}, {"id": "cil-class-5-16", "t": "6. Privity of Contract", "lv": 2}, {"id": "cil-class-5-17", "t": "Exceptions to Privity of Contract", "lv": 3}, {"id": "cil-class-5-18", "t": "Summary — Class 5 at a Glance", "lv": 2}]}]}, "cil-class-6": {"course": "CIL", "ref": "Class 6", "title": "Privity of Contract & Vitiating Elements (Mistake)", "kicker": "Class notes · Folake Adewumi · Delivered via Zoom / YouTube Live", "words": 1906, "parts": [{"label": "", "note": "", "src": "Class 6 - CIL_Law_of_Engineering_Contract_Class6_Notes.pdf", "html": "<h2 id=\"cil-class-6-0\">1. Privity of Contract — Recap and Scenario<\/h2><p>Privity of contract was introduced in the previous class (Class 5). The general rule is that a person who is not a party to a contract (a stranger to the contract) cannot receive the benefits or bear the obligations under it. A third party cannot enforce the agreement against A or B because they were not a party to the agreement.<\/p><h3 id=\"cil-class-6-1\">Scenario: Yaba Local Government Water Tank<\/h3><p>The Yaba Local Government Council (<b>Party A<\/b>) entered into a contract with a large construction company (<b>Party B<\/b>). Party B purchased a high-capacity automated water tank from a manufacturer (<b>Party C<\/b>). The contract between B and C guaranteed that the tank would operate at at least 95% efficiency. After installation, the tank frequently broke down, reducing efficiency to 60%. This caused Party A to lose a lot of money — they had to hire tankers to bring in water, which affected their budget.<\/p><p><b>Question:<\/b> Can Party A directly sue Party C for breach of contract?<\/p><p><b>Answer: No.<\/b> Party C is a stranger to the contract with Party A. The contract was between A and B, and a separate contract was between B and C. Party A is not in direct contract with Party C. This is the principle of privity of contract.<\/p><p><b>The proper remedy:<\/b> Party A sues Party B (because they were in direct contract). Then Party B's lawyer applies to the court to join Party C as a co-defendant. This way, all necessary parties and evidence are in one case, avoiding duplicate litigation and wasting taxpayers' money.<\/p><h2 id=\"cil-class-6-2\">2. Exceptions to the Doctrine of Privity of Contract<\/h2><p>Strict adherence to the doctrine of privity has been found to cause hardship, especially in commercial practice. The following exceptions have been recognised:<\/p><h3 id=\"cil-class-6-3\">(a) Agency<\/h3><p>Under the law of agency, a person (the <b>agent<\/b>) can enter into a contract on behalf of another person (the <b>principal<\/b>). Whatever the agent does is deemed as if the principal did it. The agent is just an intermediary acting on your behalf. Your letter of authority speaks for you.<\/p><p>The agent does not have to use the principal's name. Even if they sign in their own name, because they have authority from the principal, the principal is bound. If you sue the agent, it is like suing the same person twice — the agent would typically be a witness in the case, not a party.<\/p><p><b>Scenario — Alex the Project Manager:<\/b> Alex, an automation engineer, is hired as project manager by TechCorp. TechCorp gives Alex explicit authority to acquire necessary components. Alex signs a contract with a robotic supplier for three robotic arms. When the arms are delivered, TechCorp refuses to pay, claiming they never directly signed a contract with the supplier. <b>Can the supplier sue TechCorp?<\/b> Yes,<\/p><p>because Alex was acting as an agent with authority from TechCorp. Whatever Alex did is deemed as if TechCorp did it.<\/p><h3 id=\"cil-class-6-4\">(b) Trusteeship<\/h3><p>A trust is the equitable assignment of the benefit of a contract by the party entitled to that benefit to a third party. If a grandparent creates a trust (e.g., a will) with a trustee, and the trustee does not do as directed — does not remit the benefits to the beneficiary — the beneficiary can sue the trustee, even though the beneficiary was not present when the will was signed.<\/p><h3 id=\"cil-class-6-5\">(c) Assignment<\/h3><p>This relates especially to landed property. If Mr. A sells land to Mr. B, and after some years Mr. B sells it to Mr. C, Mr. C has rights over the property. If parents leave a property for their children and they are no longer around, the children can sue anyone who infringes on the property. The original company does not need to be aware of the assignment — it is not their business.<\/p><h3 id=\"cil-class-6-6\">(d) Covenants Relating to Land<\/h3><p>Anything that has to do with land — covenants (promises attached to the land) run with the land and can be enforced by successors.<\/p><h3 id=\"cil-class-6-7\">(e) Third-Party Insurance<\/h3><p>If you own a car and have insured it, and you cause an accident, the injured third party can apply directly to your insurance company without going through you. They just need your car registration number and other details that the insurance company holds.<\/p><h3 id=\"cil-class-6-8\">(f) Statutory Exceptions<\/h3><p>A third party may take the benefit of a contract of which he was not a party. The Workmen's Compensation Act is an example — if an employee is a process defendant in a policy, he can bring a claim against the insurance company directly.<\/p><h3 id=\"cil-class-6-9\">(g) Restrictive Covenants / Conditions Relating to Use of Land<\/h3><p>Restrictions relating to the use of land can bind subsequent purchasers even if they were not party to the original agreement.<\/p><h2 id=\"cil-class-6-10\">3. Vitiating Elements — Introduction<\/h2><p>The <b>vitiating elements<\/b> are factors that can make a contract void or voidable. A party to a contract may make it void or of no manner of effect whatsoever.<\/p><p>The vitiating elements include:<\/p><ul><li><b>Mistake<\/b><\/li><li><b>Misrepresentation<\/b><\/li><li><b>Duress<\/b> and <b>undue influence<\/b><\/li><li><b>Illegality<\/b><\/li><\/ul><p>For example, a contractor buys a car, thinking they are getting a good bargain. Later, a discovery is made that the car had been in a major accident and the frame was compromised. If it can be said that the car was<\/p><p>structurally unsafe and the engineer could not have discovered this even with reasonable care, the effect is that no contract may have resulted.<\/p><h2 id=\"cil-class-6-11\">4. Mistake in Contract Law<\/h2><h3 id=\"cil-class-6-12\">A. What Is (and Is Not) Mistake in Law<\/h3><p>Mistake in the legal sense is <b>more limited in meaning<\/b> than in general usage. In law, mistake relates to the <b>identity<\/b> of the subject matter or its <b>existence<\/b>.<\/p><p><b>Analogy — Ladipo Market Engine:<\/b> You are an engineer and you go to Ladipo Market to buy a used generator engine. You see one that looks right, the price is good, and you buy it. At home, you discover it cannot generate as much power as you expected. In the normal sense, you made a mistake. But in law, <b>that<\/b> <b>is not a mistake<\/b>. You went to the market, you saw what you wanted, and you bought it. You got what you asked for.<\/p><p>It becomes a mistake in law when you <b>specifically told them<\/b> you wanted an engine with 500 capacity, and they gave you one with 300 capacity instead. You specified the identity, but they gave you a different one. <b>That<\/b> is mistake in law.<\/p><p>The law limits the scope of mistake so that you cannot claim for what you did not ask for. It would not be fair to the seller if you went back and said 'it did not do what I wanted' when you never told them what you wanted. The law is trying to ensure fairness, equity, and justice.<\/p><h3 id=\"cil-class-6-13\">B. Mistake at Common Law<\/h3><p>Under common law, mistake generally renders a contract <b>void<\/b> — as though the contract never existed. Its effect is that no contract may have resulted. However, equity may try to find a remedy if the mistake does not affect the very foundation of the contract.<\/p><h2 id=\"cil-class-6-14\">5. Types of Mistake<\/h2><p>Mistake in law manifests itself in three forms: <b>common mistake<\/b>, <b>mutual mistake<\/b>, and <b>unilateral mistake<\/b>.<\/p><h3 id=\"cil-class-6-15\">(i) Common Mistake<\/h3><p>Common mistake occurs where <b>both parties share the same mistake<\/b>. In this case, the intentions of the parties are known to each other — they are looking at the same thing — but they are both wrong about something crucial.<\/p><p><b>Example — Steel Beams:<\/b> An engineer and a supplier sign a contract for a specific batch of steel beams. Unknown to both parties, the warehouse where the beams were stored had caught fire the night before, and all the beams were destroyed. At the time of signing the contract, the subject matter of the contract no longer existed. Both parties made the same mistake — they both believed the beams still existed. Neither party is at fault. The contract is void because the thing they agreed upon was not existing at the time of the agreement.<\/p><p>In common mistake, <b>none of the parties are liable<\/b>. They both bear the loss. The thing was not existing at the time they signed the contract.<\/p><h3 id=\"cil-class-6-16\">(ii) Mutual Mistake<\/h3><p>Mutual mistake occurs where <b>both parties make mistakes, but about different things<\/b>. They are at cross-purposes — each party is thinking of something different, and neither knows what the other truly intended.<\/p><p><b>Example — MTN vs Airtel:<\/b> Your mother sends you to buy 200 naira MTN credit. You mistakenly buy 200 naira Airtel credit instead. On getting back, she says to return it immediately because she does not use Airtel. This is a mutual mistake — you bought something different from what was requested. The credit card itself works fine; it is the <b>identity<\/b> that is wrong. If you can prove you bought the wrong one and have not used it, the seller should be able to take it back.<\/p><p>Mutual mistake has a lot to do with <b>identifying<\/b> something, not with whether the subject matter itself works.<\/p><h3 id=\"cil-class-6-17\">(iii) Unilateral Mistake<\/h3><p>Unilateral mistake occurs where <b>only one party is mistaken<\/b>, and the other party either knew or should have known about the mistake. The mistaken party can contain their contract. In other words, one party knows something that the other party does not.<\/p><p><b>Example — Solar Grid Bid Error:<\/b> An electrical engineer is submitting a digital bid to install a solar grid. While copying and pasting data in a spreadsheet, a formula breaks, accidentally dropping a zero from the total price — making the bid 50,000 naira instead of 500,000 naira. The client notices the error and knows it is a calculation mistake, but immediately clicks 'Accept Bid' to trap the engineer into a low price.<\/p><p><b>Can the engineer be forced to complete the contract at 50,000?<\/b> No. This is a unilateral mistake. The client knew the bid was an error and took advantage of it. The engineer can have the contract set aside.<\/p><h2 id=\"cil-class-6-18\">Summary — Types of Mistake<\/h2><p><b>Type<\/b> <b>Who Is Mistaken?<\/b> <b>About What?<\/b> <b>Example<\/b><\/p><p>Common Mistake<\/p><p>Both parties (same mistake)<\/p><p>Something crucial; subject may not exist<\/p><p>Steel beams destroyed in warehouse fire<\/p><p>Mutual Mistake<\/p><p>Both parties (different mistakes)<\/p><p>Identity of the subject matter<\/p><p>Buying Airtel credit instead of MTN<\/p><p>Unilateral Mistake<\/p><p>Only one party; other party knows<\/p><p>One party is mistaken and the other exploits it<\/p><p>Engineer's bid error: 50k instead of 500k<\/p><h2 id=\"cil-class-6-19\">Full Class Summary<\/h2><p><b>Topic<\/b> <b>Key Points<\/b><\/p><p>Privity of Contract<\/p><p>Only parties to a contract can sue or be sued under it. A sues B, then B joins C as co-defendant.<\/p><p>Exceptions to Privity<\/p><p>Agency, trusteeship, assignment, covenants relating to land, third-party insurance, statutory exceptions.<\/p><p>Vitiating Elements<\/p><p>Factors that make a contract void/voidable: mistake, misrepresentation, duress, undue influence, illegality.<\/p><p><b>Topic<\/b> <b>Key Points<\/b><\/p><p>Mistake in Law<\/p><p>More limited than everyday meaning. Relates to identity or existence. Must specify what you want to claim mistake.<\/p><p>Common Mistake<\/p><p>Both parties share the exact same mistake. Subject matter may not exist. Contract is void. No party is at fault.<\/p><p>Mutual Mistake<\/p><p>Both parties mistaken about different things (cross-purposes). Relates to identity of subject matter.<\/p><p>Unilateral Mistake<\/p><p>Only one party mistaken; the other knows/exploits it. Contract can be set aside.<\/p><p><i>These notes were compiled from a YouTube live class (SRT subtitles) and lecture slides. Lecturer: Folake Adewumi. Transcription<\/i> <i>errors corrected and slide content integrated.<\/i><\/p>", "toc": [{"id": "cil-class-6-0", "t": "1. Privity of Contract — Recap and Scenario", "lv": 2}, {"id": "cil-class-6-1", "t": "Scenario: Yaba Local Government Water Tank", "lv": 3}, {"id": "cil-class-6-2", "t": "2. Exceptions to the Doctrine of Privity of Contract", "lv": 2}, {"id": "cil-class-6-3", "t": "(a) Agency", "lv": 3}, {"id": "cil-class-6-4", "t": "(b) Trusteeship", "lv": 3}, {"id": "cil-class-6-5", "t": "(c) Assignment", "lv": 3}, {"id": "cil-class-6-6", "t": "(d) Covenants Relating to Land", "lv": 3}, {"id": "cil-class-6-7", "t": "(e) Third-Party Insurance", "lv": 3}, {"id": "cil-class-6-8", "t": "(f) Statutory Exceptions", "lv": 3}, {"id": "cil-class-6-9", "t": "(g) Restrictive Covenants / Conditions Relating to Use of Land", "lv": 3}, {"id": "cil-class-6-10", "t": "3. Vitiating Elements — Introduction", "lv": 2}, {"id": "cil-class-6-11", "t": "4. Mistake in Contract Law", "lv": 2}, {"id": "cil-class-6-12", "t": "A. What Is (and Is Not) Mistake in Law", "lv": 3}, {"id": "cil-class-6-13", "t": "B. Mistake at Common Law", "lv": 3}, {"id": "cil-class-6-14", "t": "5. Types of Mistake", "lv": 2}, {"id": "cil-class-6-15", "t": "(i) Common Mistake", "lv": 3}, {"id": "cil-class-6-16", "t": "(ii) Mutual Mistake", "lv": 3}, {"id": "cil-class-6-17", "t": "(iii) Unilateral Mistake", "lv": 3}, {"id": "cil-class-6-18", "t": "Summary — Types of Mistake", "lv": 2}, {"id": "cil-class-6-19", "t": "Full Class Summary", "lv": 2}]}]}, "cil-class-7": {"course": "CIL", "ref": "Class 7", "title": "Misrepresentation", "kicker": "Class notes · 2 July 2026 · Folake Adewumi", "words": 1531, "parts": [{"label": "", "note": "", "src": "Class 7 - CIL_Law_of_Engineering_Contract_Class7_Notes.pdf", "html": "<h2 id=\"cil-class-7-0\">1. Opening Scenario — AI Navigation Vans<\/h2><p>A company pitches AI-navigation vans to a transport firm. During the pitch, the company states: 'Our AI navigation system is fully capable of navigating without any human intervention. We tested it extensively in Jos under extreme weather conditions — the cold, the rain — and it was working perfectly.' Impressed, the firm signs a <b>10 billion naira<\/b> contract.<\/p><p>Three months later, during the very first rain, three vans lose track of the road and crash into ditches, causing massive traffic chaos. When the black box data is downloaded, two shocking things are discovered: (1) the AI sensor goes blind when water drops on the sensor casing, and (2) the manufacturers <b>never actually tested<\/b> <b>it in Jos<\/b> — they only simulated the weather conditions on a computer in a lab.<\/p><p><b>Can the buyer tear up the contract and get their 10 billion naira back?<\/b> The statements were made during the pitch — before the contract — and were not written into the terms of the contract. This is the topic of today's class: <b>misrepresentation<\/b>.<\/p><h2 id=\"cil-class-7-1\">2. What is Misrepresentation?<\/h2><p>Misrepresentation is an <b>untrue statement<\/b> made by <b>one party<\/b> to a contract, to <b>the other<\/b>, <b>before or at the<\/b> <b>time of contracting<\/b>, with regard to some <b>existing fact<\/b> or to some <b>past event<\/b>, which is one of the causes that <b>induced<\/b> the other party to enter into the contract.<\/p><p>Statements made at the initial stage of a contract are called <b>representations<\/b>. When those representations turn out to be wrong, they become <b>misrepresentations<\/b>. Even if those things are not written in the terms of the contract, you can be sued.<\/p><p>You have to watch what you say. As an engineer, if you want to get a deal or contract, you may start saying things that indirectly or later you will not or cannot do. The law holds you accountable for those statements.<\/p><h2 id=\"cil-class-7-2\">3. Effect of Misrepresentation<\/h2><p>If misrepresentation is detected, the resultant effect is that the contract can either be <b>void<\/b> or <b>voidable<\/b>.<\/p><h2 id=\"cil-class-7-3\">4. Conditions for Misrepresentation<\/h2><h3 id=\"cil-class-7-4\">(a) Must Be of Fact, Not of Law<\/h3><p>A misrepresentation must be a statement of <b>fact<\/b>, not of <b>law<\/b>. Citizens are expected to know the law. If someone tells you 'the Lagos Land Use Act says you can build a three-storey building here' when in reality only one storey is allowed, and you relied on that — the law does not consider this misrepresentation<\/p><p>because you should have checked the law yourself.<\/p><h3 id=\"cil-class-7-5\">(b) Must Be of Fact, Not of Opinion or Intention<\/h3><p>If someone says 'I <i>think<\/i> you can build three storeys' — that is an opinion, and you should not rely on it. Similarly, if someone says 'I <i>intend<\/i> to give you this house' or 'I <i>promise<\/i> to renovate the property' — those are statements of intention, not of fact. If they do not follow through, it is not misrepresentation. If someone wants to give you something, <b>let it be written down<\/b> — a deed of gift, for instance.<\/p><h3 id=\"cil-class-7-6\">(c) Statement Must Be Addressed to the Party with Intention to Induce<\/h3><p>The statement must have been addressed to the specific person with the intention to induce them to enter into the contract.<\/p><h2 id=\"cil-class-7-7\">5. Silence and Misrepresentation<\/h2><p><b>General rule:<\/b> Silence does not amount to misrepresentation. If you assumed something and the other party simply stayed quiet, that is not their problem — it is business. You should do your own investigation.<\/p><p><b>Example:<\/b> You want to buy land for your company. You tell the seller 'I heard there will be an expressway near this axis.' The seller stays quiet. You buy, only to discover the expressway is very far. The seller's silence is not misrepresentation.<\/p><h3 id=\"cil-class-7-8\">Exceptions — Contracts of Utmost Good Faith (Uberrimae Fidei)<\/h3><p>In certain types of contracts, silence <b>can<\/b> amount to misrepresentation:<\/p><ul><li><b>Insurance contracts<\/b> — you must disclose everything; what you do not tell them, you cannot hold against them later.<\/li><li><b>Land acquisition<\/b> — if you are not the owner, you must not stay silent and sell property that is not yours.<\/li><li><b>Shares<\/b> — material information must be disclosed.<\/li><li><b>Position of credit<\/b> — full disclosure required.<\/li><li><b>Family arrangements<\/b> — silence in family deals is at your own peril.<\/li><\/ul><h2 id=\"cil-class-7-9\">6. Three Types of Misrepresentation<\/h2><h3 id=\"cil-class-7-10\">(i) Fraudulent Misrepresentation<\/h3><p>A misrepresentation is fraudulent when the false statement is made <b>knowingly<\/b>, <b>without believing in its<\/b> <b>truth<\/b>, or <b>recklessly/carelessly<\/b> as to whether it is true or false. The focus is on <b>intention<\/b> — the person intended to make a false statement to deceive the other party.<\/p><p><b>Case Example — Property No. 19 vs No. 21:<\/b> An agent wanted to sell property No. 19, but described it to the buyer using the specifications of property No. 21 (which matched what the buyer wanted). They signed the agreement for No. 21. There was already a court decision that had assigned No. 21 to another person, which the seller failed to disclose. The court found this was a pure level of fraud — the agent knowingly misrepresented which property was being sold.<\/p><p><b>Remedy: Rescission + Damages<\/b><\/p><h3 id=\"cil-class-7-11\">(ii) Innocent Misrepresentation<\/h3><p>Innocent misrepresentation arises where the party making the statement has <b>no intention to deceive<\/b> and has an <b>honest belief<\/b> in the truth of the statement.<\/p><p><b>Example — Machine Labelled 2024:<\/b> You wanted a 2024 machine. The supplier told you it was a 2024 model. But there was a labelling error by the manufacturer — it was actually made in 2021, with the label mistakenly showing 2024. The supplier genuinely believed it was a 2024 model. The supplier should not be punished for what they did not do deliberately.<\/p><p><b>Remedy: Rescission + Indemnity<\/b> (NO damages)<\/p><p>Common law did not provide damages for innocent misrepresentation. Equity provides <b>indemnity<\/b> instead.<\/p><h3 id=\"cil-class-7-12\">(iii) Negligent Misrepresentation<\/h3><p>A negligent misrepresentation is one made <b>carelessly<\/b>, or without reasonable grounds to believe it to be true. It often manifests in <b>fiduciary or professional relationships<\/b> where trust is placed in the person making the statement.<\/p><p><b>Example — Civil Engineer and Bridge:<\/b> A civil engineer tells a client that a bridge can support 50 tons, but he used outdated formulas and skipped the mandatory safety recalculation. As a professional, you cannot afford to be careless — such mistakes can cost lives. People who give you the job trust you.<\/p><p><b>Remedy: Rescission + Damages<\/b><\/p><p><b>Type<\/b> <b>Intention<\/b> <b>Example<\/b> <b>Remedy<\/b><\/p><p>Fraudulent Knows it is false; intends to deceive<\/p><p>Agent describes property No. 19 as No. 21<\/p><p>Rescission + Damages<\/p><p>Innocent No intention to deceive; honest belief<\/p><p>Machine labelled 2024 but actually 2021<\/p><p>Rescission + Indemnity (NO damages)<\/p><p>Negligent Careless; no reasonable grounds to believe true<\/p><p>Engineer uses outdated formulas for bridge<\/p><p>Rescission + Damages<\/p><h2 id=\"cil-class-7-13\">7. Remedies Explained<\/h2><h3 id=\"cil-class-7-14\">Rescission<\/h3><p>The purpose of rescission is to <b>restore the parties to their status quo<\/b> — the position they were in before the contract ever occurred. The person who paid money gets their money back; the person who supplied goods gets their goods back. It is as if the contract never happened.<\/p><h3 id=\"cil-class-7-15\">Damages<\/h3><p>Damages are monetary compensation for losses suffered as a result of the misrepresentation. They can include medical costs, emotional trauma, and exemplary damages (to make an example of the wrongdoer). Damages can even exceed the original contract value — for example, a product worth 2 million naira could result in damages of 50 million naira depending on the harm caused.<\/p><p>Damages are available for <b>fraudulent and negligent<\/b> misrepresentation. They are <b>NOT available<\/b> for innocent misrepresentation.<\/p><h3 id=\"cil-class-7-16\">Indemnity<\/h3><p>Indemnity is an equitable remedy that covers <b>foreseeable expenses<\/b> incurred in reliance on the contract. It applies where damages are not available (i.e., innocent misrepresentation).<\/p><p><b>Example:<\/b> The item you want to buy is in Sokoto. You spend 500,000 naira on logistics to go and pick it up. On arrival, you discover it does not meet specifications. Even though the misrepresentation was innocent, equity says it is not fair for you to lose the 500,000 naira you spent on logistics. Indemnity covers that cost.<\/p><p>However, indemnity only covers what was <b>foreseeable<\/b> at the time of the contract. If you then shipped the item to America and employed people there — those costs were not foreseeable and are NOT covered by indemnity.<\/p><h2 id=\"cil-class-7-17\">Summary — Class 7 at a Glance<\/h2><p><b>Topic<\/b> <b>Key Points<\/b><\/p><p>Definition Untrue statement by one party to the other, before/at time of contracting, regarding existing fact/past event, that induced the other to enter into the contract.<\/p><p>Effect Contract can be void or voidable.<\/p><p>Conditions Must be of fact (not law, opinion, or intention). Must be addressed to the party with intent to induce.<\/p><p>Silence Generally NOT misrepresentation. Exceptions: insurance, land acquisition, shares, credit, family arrangements.<\/p><p>Fraudulent Knowingly false, no belief in truth, reckless. Remedy: Rescission + Damages.<\/p><p>Innocent Honest belief, no intention to deceive. Remedy: Rescission + Indemnity (no damages).<\/p><p>Negligent Careless, no reasonable grounds to believe true. Remedy: Rescission + Damages.<\/p><p>Rescission Restores parties to pre-contract position (status quo ante).<\/p><p>Damages Monetary compensation; can exceed contract value. Available for fraudulent and negligent only.<\/p><p>Indemnity Equitable remedy: foreseeable expenses only. Available for innocent misrepresentation.<\/p><p><i>These notes were compiled from a class transcript (July 2, 2026). Transcription errors corrected and content structured for clarity.<\/i> <i>Lecturer: Folake Adewumi.<\/i><\/p>", "toc": [{"id": "cil-class-7-0", "t": "1. Opening Scenario — AI Navigation Vans", "lv": 2}, {"id": "cil-class-7-1", "t": "2. What is Misrepresentation?", "lv": 2}, {"id": "cil-class-7-2", "t": "3. Effect of Misrepresentation", "lv": 2}, {"id": "cil-class-7-3", "t": "4. Conditions for Misrepresentation", "lv": 2}, {"id": "cil-class-7-4", "t": "(a) Must Be of Fact, Not of Law", "lv": 3}, {"id": "cil-class-7-5", "t": "(b) Must Be of Fact, Not of Opinion or Intention", "lv": 3}, {"id": "cil-class-7-6", "t": "(c) Statement Must Be Addressed to the Party with Intention to Induce", "lv": 3}, {"id": "cil-class-7-7", "t": "5. Silence and Misrepresentation", "lv": 2}, {"id": "cil-class-7-8", "t": "Exceptions — Contracts of Utmost Good Faith (Uberrimae Fidei)", "lv": 3}, {"id": "cil-class-7-9", "t": "6. Three Types of Misrepresentation", "lv": 2}, {"id": "cil-class-7-10", "t": "(i) Fraudulent Misrepresentation", "lv": 3}, {"id": "cil-class-7-11", "t": "(ii) Innocent Misrepresentation", "lv": 3}, {"id": "cil-class-7-12", "t": "(iii) Negligent Misrepresentation", "lv": 3}, {"id": "cil-class-7-13", "t": "7. Remedies Explained", "lv": 2}, {"id": "cil-class-7-14", "t": "Rescission", "lv": 3}, {"id": "cil-class-7-15", "t": "Damages", "lv": 3}, {"id": "cil-class-7-16", "t": "Indemnity", "lv": 3}, {"id": "cil-class-7-17", "t": "Summary — Class 7 at a Glance", "lv": 2}]}]}, "cil-class-8": {"course": "CIL", "ref": "Class 8", "title": "Duress, Undue Influence, Illegality & Void Contracts", "kicker": "Class notes · 30 July 2026", "words": 1355, "parts": [{"label": "", "note": "", "src": "Class 8 - CIL_Law_of_Engineering_Contract_Class8_Notes.pdf", "html": "<h2 id=\"cil-class-8-0\">1. Recap — Elements of a Valid Contract<\/h2><p>The elements of a valid contract are: <b>offer<\/b>, <b>acceptance<\/b> (which must be unequivocal), <b>consideration<\/b> (which must be furnished by both parties), <b>capacity<\/b> to contract, and <b>intention to create a legal relationship<\/b>. When all of these elements are present, you have a valid and binding contract.<\/p><p>However, even when all these elements are present, there are <b>vitiating elements<\/b> that can render the contract void or voidable. The vitiating elements discussed so far include <b>mistake<\/b> and <b>misrepresentation<\/b>. Today we add <b>duress and undue influence<\/b>, and <b>illegality<\/b>.<\/p><h3 id=\"cil-class-8-1\">Voidable vs. Void — Quick Distinction<\/h3><p><b>Voidable:<\/b> The contract exists but the aggrieved party has the option to either continue with it or set it aside (rescission). For example, if Emmanuel posts on his WhatsApp status 'I want to sell one of my cars,' and a buyer sends money thinking it is the Lexus but Emmanuel intended to sell the Volvo — the buyer might decide to keep the Volvo (perhaps use the extra money to buy something else) or demand rescission. The choice is the aggrieved party's.<\/p><p><b>Void:<\/b> The contract is void from inception. It can never be valid. There is an illegality in it. No court will enforce it.<\/p><h2 id=\"cil-class-8-2\">2. Duress<\/h2><p>Duress is a vitiating element that affects the validity of a contract. Every contract should reflect <b>consensus<\/b> <b>ad idem<\/b> — a meeting of the minds. Both parties must agree willingly. If at the time you were making your acceptance, there was a gun behind you — that is duress. The consent was not freely given.<\/p><p>There is a principle in law: <i><b>Non est factum<\/b><\/i> — when you sign a document, you are bound by its terms. However, if you signed under duress (under threat of violence, coercion, or physical harm), the contract is voidable at your option because the essential element of free consent was absent.<\/p><p>While duress may not necessarily involve moral turpitude or criminal acts, the law refuses to enforce the contract because it lacks the essential contractual element of voluntary consent.<\/p><h2 id=\"cil-class-8-3\">3. Undue Influence<\/h2><p>Undue influence is closely related to duress but is more subtle. It occurs when one party uses their position of power or authority over the other to obtain consent.<\/p><p><b>Example:<\/b> You are in your chairman's office. A document is placed in front of you. The chairman is on a phone call. There is a certain silence and pressure in the room. You feel compelled to sign. Was that a voluntary contract freely entered into? There was no physical threat, but the power dynamic influenced your<\/p><p>decision.<\/p><p>The consensus ad idem — the meeting of the minds — must be genuine. If consent was obtained through the exercise of undue influence, the contract is voidable.<\/p><h2 id=\"cil-class-8-4\">4. Professional Duty and Negligent Advice<\/h2><p>As professionals — whether engineers, lawyers, or other experts — if a party comes to you for professional advice and you are not sure of the answer, <b>do not give an immediate answer<\/b>. Say 'Can I get back to you on that?' You can then consult your colleagues, do your research, and confirm the correct position before advising.<\/p><p>In countries abroad — the UK, Canada, and the US — professionals have lost their licences permanently for giving negligent advice. Their right to practise has been completely taken away. So as an engineer, if you give non-professional advice and there is a problem, you risk losing your licence.<\/p><h2 id=\"cil-class-8-5\">5. Illegal Contracts<\/h2><p>Something becomes illegal <b>only when the law says it is illegal<\/b>. If the law does not prohibit it, it is not illegal.<\/p><h3 id=\"cil-class-8-6\">Definition<\/h3><p>An illegal contract is a contract that involves the <b>commission of a crime<\/b>, a <b>civil wrong<\/b>, or an act <b>contrary<\/b> <b>to public policy<\/b>, or which violates an <b>explicit statutory provision<\/b>.<\/p><h3 id=\"cil-class-8-7\">Latin Maxim<\/h3><p><i><b>Ex turpi causa non oritur actio<\/b><\/i> — no action arises from a dishonorable cause. Courts will refuse to enforce an illegal contract. No court will grant relief on an illegal contract.<\/p><h3 id=\"cil-class-8-8\">Scenario — Election Rigging<\/h3><p>Victor wants to contest a senatorial seat. He approaches Barnabas and says 'I will give you 10 million naira — 5 million upfront, 5 million when the job is done — to rig the election in my favour.' Barnabas takes the 5 million but does not deliver. Victor cannot go to court to demand the balance or specific performance, because the contract is illegal and contrary to public policy. Courts will not enforce it.<\/p><h3 id=\"cil-class-8-9\">In Pari Delicto — Both Parties Equally at Fault<\/h3><p>When both parties are <b>in pari delicto<\/b> (equally at fault), benefits received are generally <b>irrecoverable<\/b>. In the election rigging example, the 5 million naira already paid is gone — it cannot be recovered. The balance of 5 million is also gone. Both parties lose.<\/p><h3 id=\"cil-class-8-10\">Examples of Illegal Contracts<\/h3><ul><li>Contracts to commit <b>murder<\/b><\/li><li>Contracts for <b>bribery<\/b><\/li><li>Contracts for <b>drug trafficking<\/b><\/li><li>Contracts involving <b>corruption in public procurement<\/b><\/li><li>Contracts for <b>prostitution<\/b> (prohibited by law)<\/li><li>Contracts for <b>tax evasion<\/b><\/li><li>Contracts that violate <b>statutory restrictions<\/b> (e.g., parking where the law says you cannot)<\/li><\/ul><h2 id=\"cil-class-8-11\">6. Void Contracts<\/h2><p>A void contract is one that is <b>void from inception<\/b>. From the very beginning, the contract has no legal effect. It is as if it never existed.<\/p><h3 id=\"cil-class-8-12\">Examples of Void Contracts<\/h3><ul><li><b>Agreements with a minor<\/b> — subject to exceptions (contracts for necessaries like food, clothing, shelter; and beneficial contracts of service like education).<\/li><li><b>Contracts to perform an impossible act<\/b> — you cannot enforce rights in a void contract because the act itself is impossible.<\/li><li><b>Contracts without consideration<\/b> — subject to exceptions (deeds do not require consideration).<\/li><li><b>Contracts based on mutual mistake<\/b> — where both parties are mistaken about a fundamental fact, the contract is void from inception.<\/li><li><b>Illegal contracts<\/b> — since they lack legal effect by definition.<\/li><\/ul><h3 id=\"cil-class-8-13\">Characteristics of Void Contracts<\/h3><ul><li>Void from inception — never had legal force.<\/li><li>Do not necessarily involve criminal conduct — they are simply void.<\/li><li>You cannot enforce rights under a void contract.<\/li><li>Impossibility of performance or illegality can make a contract void.<\/li><\/ul><h3 id=\"cil-class-8-14\">Illegal vs. Void — Key Distinction<\/h3><p>Not all void contracts are illegal, and not all illegal contracts are void in the same way. Void contracts simply have no legal effect from
