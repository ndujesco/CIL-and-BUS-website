 the beginning (e.g., contracts with a minor for non-necessaries). Illegal contracts go further — they involve an act that the law actively prohibits, and courts will not only refuse to enforce them but may also impose penalties.<\/p><h2 id=\"cil-class-8-15\">7. Importance of These Rules<\/h2><p>The rules on illegality and void contracts serve to:<\/p><ul><li><b>Protect public interest<\/b> and criminal activities from being legitimised.<\/li><li><b>Protect innocent members<\/b> of society.<\/li><li><b>Encourage lawful business practices.<\/b><\/li><li><b>Preserve judicial integrity<\/b> — courts should not be instruments of illegality.<\/li><li><b>Maintain economic order.<\/b><\/li><li><b>Protect contractual fairness<\/b> and prevent abuse of legal processes.<\/li><\/ul><h3 id=\"cil-class-8-16\">Challenges in Nigeria<\/h3><p>The class discussed the following challenges to enforcement in Nigeria:<\/p><ul><li><b>Corruption<\/b> — widespread in the system.<\/li><li><b>Insecurity<\/b> — affects commerce and contract enforcement.<\/li><li><b>Executive interference in the judiciary<\/b> — undermining independence of courts.<\/li><li><b>Lack of civic education<\/b> — many citizens do not know their rights.<\/li><\/ul><h2 id=\"cil-class-8-17\">Summary — Class 8 at a Glance<\/h2><p><b>Topic<\/b> <b>Key Points<\/b><\/p><p>Recap Elements: offer, acceptance, consideration, capacity, intention. Vitiating elements: mistake, misrepresentation, duress, illegality.<\/p><p>Voidable vs. Void<\/p><p>Voidable: exists but can be set aside at aggrieved party's option. Void: void from inception; no legal effect; cannot be enforced.<\/p><p>Duress Consent obtained by force/threat. Consensus ad idem absent. Non est factum: signing = bound, but not if under duress.<\/p><p>Undue Influence<\/p><p>Consent obtained through position of power. More subtle than duress. Contract voidable.<\/p><p>Professional Duty<\/p><p>Do not give advice you are not sure of. Consult colleagues. Abroad: professionals lose licences for negligent advice.<\/p><p>Illegal Contracts<\/p><p>Involves crime, civil wrong, or act contrary to public policy. Ex turpi causa non oritur actio. Courts will not enforce. In pari delicto: benefits irrecoverable.<\/p><p>Void Contracts<\/p><p>Void from inception. Examples: minor (with exceptions), impossible acts, no consideration, mutual mistake, illegality.<\/p><p>Importance Protect public interest, innocent parties, judicial integrity, economic order. Nigeria challenges: corruption, insecurity.<\/p><p><i>These notes were compiled from a class transcript (July 30, 2026). Transcription errors corrected and content structured for clarity.<\/i><\/p>", "toc": [{"id": "cil-class-8-0", "t": "1. Recap — Elements of a Valid Contract", "lv": 2}, {"id": "cil-class-8-1", "t": "Voidable vs. Void — Quick Distinction", "lv": 3}, {"id": "cil-class-8-2", "t": "2. Duress", "lv": 2}, {"id": "cil-class-8-3", "t": "3. Undue Influence", "lv": 2}, {"id": "cil-class-8-4", "t": "4. Professional Duty and Negligent Advice", "lv": 2}, {"id": "cil-class-8-5", "t": "5. Illegal Contracts", "lv": 2}, {"id": "cil-class-8-6", "t": "Definition", "lv": 3}, {"id": "cil-class-8-7", "t": "Latin Maxim", "lv": 3}, {"id": "cil-class-8-8", "t": "Scenario — Election Rigging", "lv": 3}, {"id": "cil-class-8-9", "t": "In Pari Delicto — Both Parties Equally at Fault", "lv": 3}, {"id": "cil-class-8-10", "t": "Examples of Illegal Contracts", "lv": 3}, {"id": "cil-class-8-11", "t": "6. Void Contracts", "lv": 2}, {"id": "cil-class-8-12", "t": "Examples of Void Contracts", "lv": 3}, {"id": "cil-class-8-13", "t": "Characteristics of Void Contracts", "lv": 3}, {"id": "cil-class-8-14", "t": "Illegal vs. Void — Key Distinction", "lv": 3}, {"id": "cil-class-8-15", "t": "7. Importance of These Rules", "lv": 2}, {"id": "cil-class-8-16", "t": "Challenges in Nigeria", "lv": 3}, {"id": "cil-class-8-17", "t": "Summary — Class 8 at a Glance", "lv": 2}]}]}, "cil-class-9": {"course": "CIL", "ref": "Class 9", "title": "Duress, Undue Influence, Discharge & Remedies", "kicker": "Class notes · 6 August 2026 · Delivered via Zoom", "words": 1443, "parts": [{"label": "", "note": "", "src": "Class 9 - CIL_Law_of_Engineering_Contract_Class9_Notes.pdf", "html": "<h2 id=\"cil-class-9-0\">1. Duress — Detailed Treatment<\/h2><h3 id=\"cil-class-9-1\">Essential Elements of Duress<\/h3><ul><li><b>Threat<\/b> — to life, body, or goods, before the contract was accepted and signed.<\/li><li><b>Lack of free will<\/b> — the party did not sign at their own will.<\/li><li><b>Illegitimate pressure<\/b> — the pressure applied was not part of legitimate negotiation.<\/li><li><b>Pressure induced the contract<\/b> — the contract became a 'total package' because the party was forced to sign.<\/li><\/ul><h3 id=\"cil-class-9-2\">Types of Duress<\/h3><ul><li><b>Physical duress<\/b> — threat of violence or bodily harm (e.g., gun pointed at your head).<\/li><li><b>Economic duress<\/b> — exploiting economic pressure (e.g., engineers in a partnership where the mechanical engineer demands 60% at the critical point of the project, knowing the others cannot proceed without him).<\/li><li><b>Duress to goods<\/b> — threat to damage or withhold someone's property.<\/li><\/ul><h3 id=\"cil-class-9-3\">Importance and Benefits<\/h3><p>Duress as a legal concept protects contractual freedom, promotes fairness, prevents exploitation, and upholds justice. Its benefits include protecting weaker parties, discouraging coercion, ensuring voluntary agreements (consensus ad idem), and strengthening commercial confidence. If someone makes you sign a document under duress, you can go to court and have it nullified.<\/p><h3 id=\"cil-class-9-4\">Challenges of Proving Duress<\/h3><ul><li><b>Difficult to prove<\/b> — you must have solid evidence (documents, voice notes, photos).<\/li><li><b>Economic pressure<\/b> is hard to distinguish from legitimate negotiation.<\/li><li><b>Delays in seeking rescission<\/b> may bar relief — if you do not challenge promptly, you may lose your right.<\/li><li><b>Evidentiary challenges<\/b> — do you have a picture of the gun? Do you have the voice notes of the threats?<\/li><\/ul><h3 id=\"cil-class-9-5\">Case Law<\/h3><p><b>Okonkwo v. Cooperative Commerce Bank PLC<\/b> — the court recognised that consent obtained under improper pressure may render a transaction voidable where coercion is established.<\/p><h3 id=\"cil-class-9-6\">Student Q&amp;A Highlights<\/h3><p><i>Q: Are there objective standards for determining duress?<\/i> The court listens to the parties, examines documents, hears witnesses, and deduces the actual problem objectively.<\/p><p><i>Q: What if I expended more energy than my partners?<\/i> You must prove it to the satisfaction of the court. If you cannot, the original agreement (e.g., 50-50) stands.<\/p><h2 id=\"cil-class-9-7\">2. Undue Influence — Detailed Treatment<\/h2><p>Undue influence occurs when one party uses a position of dominance or trust to improperly influence another party's decision to enter into a contract.<\/p><h3 id=\"cil-class-9-8\">Types of Undue Influence<\/h3><ul><li><b>Actual undue influence<\/b> — there is direct evidence of improper pressure being applied.<\/li><li><b>Presumed undue influence<\/b> — arises automatically from certain types of relationships where one party is in a position of trust or authority over the other.<\/li><\/ul><h3 id=\"cil-class-9-9\">Relationships Where Undue Influence Is Presumed<\/h3><ul><li>Solicitor (lawyer) and client<\/li><li>Doctor and patient<\/li><li>Parent and child<\/li><li>Trustee and beneficiary<\/li><li>Spiritual adviser and follower (imam and members of his mosque, pastor and his congregants)<\/li><\/ul><p><b>Important:<\/b> A fiduciary relationship does <b>not automatically<\/b> prove undue influence. The court will listen to the parties and then determine whether advantage was taken. It must still be proved.<\/p><h3 id=\"cil-class-9-10\">Example — Landlord and Tenant<\/h3><p>A landlord who constantly increases rent to frustrate a tenant into leaving is exercising undue influence. The lecturer shared a case where a landlord would check the tenant's dustbin — seeing corned beef, assorted food — and conclude the tenant had enough money to pay more rent. That is undue influence. Most states, including Lagos, have laws against such exploitation and set standard rent levels for each area.<\/p><h2 id=\"cil-class-9-11\">3. Discharge of Contracts<\/h2><p>Discharge of contract refers to the <b>termination of contractual obligations<\/b>. Everything that has a beginning has an end. At what point does the contractual obligation come to an end?<\/p><h3 id=\"cil-class-9-12\">Modes of Discharge<\/h3><h3 id=\"cil-class-9-13\">(a) Discharge by Performance<\/h3><p>The parties completely perform their obligations. Example: a contractor completes construction according to the contract, hands over the key, there is an opening ceremony — the contractor is discharged and gets paid.<\/p><h3 id=\"cil-class-9-14\">(b) Discharge by Agreement<\/h3><p>The parties mutually agree to terminate or vary the contract. Both sides consent to end the arrangement.<\/p><h3 id=\"cil-class-9-15\">(c) Discharge by Breach<\/h3><p>A serious (fundamental) breach allows the innocent party to terminate the contract and sue for damages. Example: a contractor is given two years to build a hall, but after two years, the person is still on the<\/p><p>foundation. That is a serious breach.<\/p><h3 id=\"cil-class-9-16\">(d) Discharge by Frustration<\/h3><p>A supervening event makes performance impossible or radically different from what was contemplated. Examples include:<\/p><ul><li>Destruction of subject matter (e.g., the hall booked for a wedding reception burns down).<\/li><li>Death in contracts requiring personal performance (e.g., a musician hired for a wedding passes away).<\/li><li>Natural disasters making performance impossible.<\/li><li>Change in law rendering the contract impossible or illegal.<\/li><\/ul><h3 id=\"cil-class-9-17\">(e) Discharge by Operation of Law<\/h3><p>Examples include bankruptcy, merger, and limitation periods (time bars). These bring contractual obligations to an end by force of law.<\/p><h3 id=\"cil-class-9-18\">Importance of Discharge Rules<\/h3><ul><li>Protects commercial certainty.<\/li><li>Encourages contractual performance and proper completion.<\/li><li>Provides orderly termination — no chaos, no 'area boys.'<\/li><\/ul><h3 id=\"cil-class-9-19\">Challenges<\/h3><ul><li>Determining whether a breach is fundamental enough to terminate.<\/li><li>Establishing frustration where the event is not obvious.<\/li><li>Delays in litigation (<i>laches<\/i> and <i>acquiescence<\/i>).<\/li><li>Proof of losses.<\/li><\/ul><h2 id=\"cil-class-9-20\">4. Contractual Remedies<\/h2><p>A remedy is a <b>legal relief<\/b> available to an innocent party following a breach of contract. When you go to court, what are you asking for?<\/p><h3 id=\"cil-class-9-21\">(a) Damages<\/h3><p>The most common remedy. Damages involve <b>monetary compensation<\/b> for the breach. Types of damages:<\/p><ul><li><b>General damages<\/b> — naturally flowing from the breach.<\/li><li><b>Special damages<\/b> — specifically proved losses.<\/li><li><b>Nominal damages<\/b> — token amount where breach occurred but no real loss.<\/li><li><b>Exemplary damages<\/b> — to make an example of the wrongdoer (e.g., neighbour ignores warnings, boasts about connections, and damages your building).<\/li><li><b>Liquidated damages<\/b> — pre-agreed amount stated in the contract itself.<\/li><\/ul><h3 id=\"cil-class-9-22\">(b) Specific Performance<\/h3><p>An equitable order compelling a party to perform their contractual obligations. Granted where damages would be <b>inadequate<\/b> — where no amount of money can compensate for the breach. Example: sale of unique land or rare property. Under equity, the court can order quantum meruit ('as much as earned') — payment for work already performed even if the contract was not fully completed (e.g., a contractor has done 60% of the work).<\/p><h3 id=\"cil-class-9-23\">(c) Injunction<\/h3><p>A court order that <b>restrains a party from committing or continuing a breach<\/b>. Example: if a neighbour's construction is threatening your building's foundation, you can quickly get an injunction to stop them before the damage is done.<\/p><h3 id=\"cil-class-9-24\">(d) Rescission<\/h3><p>Setting aside the contract and <b>restoring parties to their original positions<\/b>. Most commonly arises in cases of misrepresentation or mistake.<\/p><h3 id=\"cil-class-9-25\">(e) Quantum Meruit<\/h3><p><i><b>Quantum meruit<\/b><\/i> (Latin: 'as much as earned'). Allows payment for work already performed where a contract cannot be fully completed or has been discharged in circumstances justifying compensation. Example: a contractor has built 60% of a structure — the court orders payment for the 60% completed.<\/p><h3 id=\"cil-class-9-26\">(f) Restitution<\/h3><p>Requires <b>restoration of benefits unjustly obtained<\/b>. The court orders you to return whatever you gained from the contract. Puts the party back in the position they were before the contract.<\/p><p><b>Remedy<\/b> <b>What It Does<\/b> <b>When Used<\/b><\/p><p>Damages Monetary compensation Most common; various types<\/p><p>Specific Performance<\/p><p>Court orders party to perform obligations<\/p><p>Where damages are inadequate (unique land, rare property)<\/p><p>Injunction Restrains party from continuing breach<\/p><p>Urgent: prevent ongoing or imminent harm<\/p><p>Rescission Sets aside contract; restores original positions<\/p><p>Misrepresentation, mistake<\/p><p>Quantum Meruit<\/p><p>Payment for work already performed<\/p><p>Contract incomplete but work done in good faith<\/p><p>Restitution Returns unjustly obtained benefits<\/p><p>Breach; unjust enrichment<\/p><h3 id=\"cil-class-9-27\">Importance of Remedies<\/h3><ul><li>Upholds the sanctity of contracts.<\/li><li>Facilitates commercial certainty.<\/li><li>Protects economic interests.<\/li><li>Enhances confidence in business transactions.<\/li><\/ul><h3 id=\"cil-class-9-28\">Challenges of Remedies<\/h3><ul><li>Delay in obtaining judgments (matters drag on for years in Nigeria).<\/li><li>Difficulty enforcing court orders (party claims inability to pay — but courts can place a lien on property).<\/li><li>High litigation costs (discourages people; some resort to self-help).<\/li><li>Difficulty proving the quantum of damages suffered.<\/li><li>Limited availability of equitable remedies where claimant has not acted equitably.<\/li><\/ul><h3 id=\"cil-class-9-29\">Case Law<\/h3><p><b>Bilante International Limited v. NDIC<\/b> — the court affirmed that parties are bound by the terms of their agreement, and that remedies depend on the nature of the breach and the terms of the contract.<\/p><h2 id=\"cil-class-9-30\">5. Conclusion<\/h2><p>The doctrines of illegal and void contracts, duress, undue influence, discharge of contracts, and contractual remedies are central to Nigerian contract law. They ensure that only lawful and voluntary agreements are enforced, protect parties from coercion and exploitation, provide clear mechanisms for terminating contractual obligations, and offer appropriate remedies when breaches occur.<\/p><p>Nigerian courts continue to apply common law principles, equitable doctrines, and statutory provisions to balance contractual freedom with justice, fairness, and public policy. These principles are indispensable for maintaining certainty and confidence in commercial and private transactions in Nigeria.<\/p><p><i>These notes were compiled from a Zoom class transcript with timestamps and speaker labels (August 6, 2026). Transcription<\/i> <i>errors corrected and content structured for clarity.<\/i><\/p>", "toc": [{"id": "cil-class-9-0", "t": "1. Duress — Detailed Treatment", "lv": 2}, {"id": "cil-class-9-1", "t": "Essential Elements of Duress", "lv": 3}, {"id": "cil-class-9-2", "t": "Types of Duress", "lv": 3}, {"id": "cil-class-9-3", "t": "Importance and Benefits", "lv": 3}, {"id": "cil-class-9-4", "t": "Challenges of Proving Duress", "lv": 3}, {"id": "cil-class-9-5", "t": "Case Law", "lv": 3}, {"id": "cil-class-9-6", "t": "Student Q&A Highlights", "lv": 3}, {"id": "cil-class-9-7", "t": "2. Undue Influence — Detailed Treatment", "lv": 2}, {"id": "cil-class-9-8", "t": "Types of Undue Influence", "lv": 3}, {"id": "cil-class-9-9", "t": "Relationships Where Undue Influence Is Presumed", "lv": 3}, {"id": "cil-class-9-10", "t": "Example — Landlord and Tenant", "lv": 3}, {"id": "cil-class-9-11", "t": "3. Discharge of Contracts", "lv": 2}, {"id": "cil-class-9-12", "t": "Modes of Discharge", "lv": 3}, {"id": "cil-class-9-13", "t": "(a) Discharge by Performance", "lv": 3}, {"id": "cil-class-9-14", "t": "(b) Discharge by Agreement", "lv": 3}, {"id": "cil-class-9-15", "t": "(c) Discharge by Breach", "lv": 3}, {"id": "cil-class-9-16", "t": "(d) Discharge by Frustration", "lv": 3}, {"id": "cil-class-9-17", "t": "(e) Discharge by Operation of Law", "lv": 3}, {"id": "cil-class-9-18", "t": "Importance of Discharge Rules", "lv": 3}, {"id": "cil-class-9-19", "t": "Challenges", "lv": 3}, {"id": "cil-class-9-20", "t": "4. Contractual Remedies", "lv": 2}, {"id": "cil-class-9-21", "t": "(a) Damages", "lv": 3}, {"id": "cil-class-9-22", "t": "(b) Specific Performance", "lv": 3}, {"id": "cil-class-9-23", "t": "(c) Injunction", "lv": 3}, {"id": "cil-class-9-24", "t": "(d) Rescission", "lv": 3}, {"id": "cil-class-9-25", "t": "(e) Quantum Meruit", "lv": 3}, {"id": "cil-class-9-26", "t": "(f) Restitution", "lv": 3}, {"id": "cil-class-9-27", "t": "Importance of Remedies", "lv": 3}, {"id": "cil-class-9-28", "t": "Challenges of Remedies", "lv": 3}, {"id": "cil-class-9-29", "t": "Case Law", "lv": 3}, {"id": "cil-class-9-30", "t": "5. Conclusion", "lv": 2}]}]}, "bus-block-1": {"course": "BUS", "ref": "Block 1", "title": "Inventory Management", "kicker": "Block 1 · Dr Glorious Adekoya", "words": 1248, "parts": [{"label": "Inventory Management — BUS 323", "note": "", "src": "1.1 Inventory Management (transcript).md", "html": "<h4>Page 1<\/h4><p><b>Inventory<\/b> [covers] resources used in the day-to-day service of the org. There are three resources, which are:<\/p><ol><li>R.M — semi-finished and finished gds <i>(physical)<\/i><\/li><li>Human resources — labour (skilled / unskilled)<\/li><li>Financial resources — capital<\/li><\/ol><p>Inventory refers to any kind of resource having economic value and is maintained to fulfil the present and future needs of an org. Such resources may be classified into 3:<\/p><ol><li><b>Physical resources<\/b> → r.m, semi-finished gds, finished gds, spare parts<\/li><li><b>Human resources<\/b> — unused labour or man power<\/li><li><b>Financial resources<\/b> → working capital<\/li><\/ol><p>Inventory are the sole and life wire of any manufacturing org; they are also referred to as <b>stock items<\/b> in the operation of the bus[iness].<\/p><p><b>Example of resources in diff org.<\/b> Manufacturer: (Nestlé, Dunlop, breweries, UAC [?]) Semi-finished goods in a particular [firm] will be a finished gds or r.m to other firm.<\/p><h3 id=\"bus-block-1-0\">Reasons for Carrying Inventory — why must an org [carry inventory]?<\/h3><ol><li>They enhance an uninterrupted flow of production by ensuring the necessary input [is] available to permit economic production runs.<\/li><li>In case of variation in product dd, inventory is kept to combat incidence of stockout.<\/li><li>It allows flexibility in production scheduling to get the gds out at any cost; it relieves the pressure on the production system.<\/li><li>They help to decouple successive stages of operation.<\/li><li>It provides a means of hedging against future prices and delivery uncertainties.<\/li><li>They provide a means of obtaining economic lot size and quantity discount.<\/li><\/ol><blockquote>★ <b>When should an order be placed to replenish inventory?<\/b> There are 3 diff approaches to check the status of inventory.<\/blockquote><ol><li><b>Periodic Review System<\/b> — is a system in which orders are placed at regular intervals of time; the qty varies depending on the inventory on hand and at [the] time of review. This system is often used in those situations where the level of inventory is reviewed at the end of [a] fixed interval of time and units are replenished.<\/li><\/ol><h4>Page 2<\/h4><ol><li><b>Fixed Order Qty System<\/b> — is a system in which the level of inventory is monitored regularly, and when it drops to a specified level, a replenish order for a fixed qty is placed. Variation in dd is allowed by changing the time b/w orders.<\/li><li><b>Optional Replenishment System<\/b> — it comprises a periodic review system with a minimum order qty restriction. If the calculated order qty is less than the minimum forecasted value, no order is placed. This avoids replacement of small orders.<\/li><\/ol><h3 id=\"bus-block-1-1\">Cost Involved in the Mgt of Inventories<\/h3><p>In order to achieve an optimal level of inventory, an effective balance b/w the inventory cost[s] are involved in inventory mgt.<\/p><ol><li><b>Ordering cost<\/b> — are the cost incurred in the process of obtaining or ordering r.m, components or parts from the suppliers (or making an order), e.g. phone call, text messages, email.<\/li><\/ol><p><i>Graph:<\/i> cost of ordering (y-axis) vs qty ordered (x-axis) — a downward-sloping curve labelled &quot;ordering cost&quot;.<\/p><ol><li><b>Holding or Carrying cost<\/b> — in order for any qty to be kept, a unit of items ordered for in inventory, certain cost must be incurred. The higher the qty of item purchased, the higher the holding cost. This includes storage or rent, salary for store keepers, insurance/security, depreciation or breakage, electricity bills, taxes and interest cost, obsolescence.<\/li><\/ol><p><i>Graph:<\/i> cost of holding (y-axis) vs qty (x-axis) — an upward-sloping curve labelled &quot;holding or carrying cost&quot;.<\/p><blockquote><b>N.B.<\/b> The inventory carrying cost per unit may sometimes be expressed as a fixed percentage of the unit cost price of the item; in some cases it may be expressed in Naira value.<\/blockquote><ol><li><b>Stockout or Shortage cost<\/b> — this are the cost of running out of stock, e.g. loss of sales, goodwill, customers.<\/li><\/ol><h4>Page 3<\/h4><ol><li><b>Set-up cost<\/b> — are cost incurred by the producer when starting up a batch, usually at the beginning of the production system: in setting up, cleaning, adjusting and adapting the machine and equipment in readiness for the next production run (batch).<\/li><li><b>Total Inventory Cost<\/b> — is made up of purchase cost, ordering cost, carrying cost and shortage cost.<\/li><\/ol><p><b>TC = Pc + Oc + Ho + So<\/b> = (Price × Qty) + (D/Q)O + (Q/2)H <i>(where (D/Q)O = ordering cost and (Q/2)H = holding cost)<\/i><\/p><h3 id=\"bus-block-1-2\">Factors Involved in Inventory Problem Analysis<\/h3><ol><li>Relevant inventory cost — summation of I.C.<\/li><li>Dd for inventory item.<\/li><li>Replenishment lead time — length [of time] it will take suppliers to [deliver].<\/li><li>Length of planning period.<\/li><li>Constraints on the inventory system — space, budget, cash, inventory <i>(obstacles / limitations)<\/i>.<\/li><li>Customers service level — or commitment; the degree of mgt attention to inventory.<\/li><\/ol><h3 id=\"bus-block-1-3\">2 Ways of Modelling in Inventory System<\/h3><ol><li>Deterministic inventory modelling<\/li><li>Stochastic model or probability<\/li><\/ol><p><b>What differentiates the 2 models?<\/b><\/p><ol><li>In deterministic, price is constant, while in probability price varies.<\/li><li>In deterministic, dd is constant, while [in] stochastic everything varies (holding, ordering cost).<\/li><li>Deterministic inventory model relates to those situations in which inventory dd pattern are known and constant. Besides, other relevant variables such as lead time and other cost parameters are also known and constant.<\/li><\/ol><p><b>EOQ:<\/b> Under the deterministic model, the simplest of all the models is what is referred to as the simple …<\/p><h4>Page 4<\/h4><p>… [EOQ model]. This model was formulated in 1915 by <b>F. W. Harris<\/b>.<\/p><h3 id=\"bus-block-1-4\">Assumptions — EOQ model<\/h3><ol><li>The dd is known and constant.<\/li><li>Lead time is zero (instantaneous replenishment).<\/li><li>Back order is not allowed.<\/li><li>No constraints on order size.<\/li><li>Cost of order is fixed.<\/li><li>Unit price of items is fixed.<\/li><\/ol><p><b>EOQ = √(2DO / H)<\/b><\/p><p><i>Graph:<\/i> cost (y-axis) vs qty (x-axis) — U-shaped total cost curve with EOQ at the minimum.<\/p><p><b>Example:<\/b> Kofo Nig Ltd experiences the dd for his product yearly as 600,000 units. It incurred 70k/unit as carrying cost; the cost per order is given as ₦20.<\/p><ol><li>What order lot size will minimize total inventory cost for the company?<\/li><li>What is the number of times to order per year?<\/li><li>What is the annual TIC if the unit price is ₦50?<\/li><li>What is the lot size if the carrying cost is 15% of the unit price?<\/li><\/ol><p><b>Solution<\/b><\/p><ol><li>Dd = 600,000; O = ₦20; H = ₦0.70<\/li><\/ol><p>EOQ = √(2DO/H) = √(2 × 600,000 × 20 / 0.70) = 5,855.400 ≈ <b>5,856 units<\/b><\/p><ol><li>No. of times to order = 600,000 / 5,856 = 102.46 ≈ <b>103 times<\/b><\/li><\/ol><p>How often, or interval in days: (5,856 / 600,000) × (360 / 1) = 3.5 ≈ <b>4 days<\/b><\/p><h4>Page 5<\/h4><ol><li><b>TIC = P × Q + (D/Q)O + (Q/2)H<\/b><\/li><\/ol><p>= 50 × 600,000 + (600,000/5,856 × 20/1) + (5,856/2 × 0.70/1) = 30,000,000 + 2,049.2 + 2,049.6 = <b>₦30,004,098.8k<\/b><\/p><ol><li>EOQ = √(2 × 600,000 × 20 / 7.5) = 1,788.8 ≈ <b>1,789 units<\/b><\/li><\/ol><p><i>(D = 600,000; H = 15% of ₦50 = 7.5; O = ₦20)<\/i><\/p><h3 id=\"bus-block-1-5\">Discount<\/h3><blockquote>The one that gives u the least is where you go for.<\/blockquote><table><tr><th>Quantity<\/th><th>Unit price<\/th><\/tr><tr><td>1,000 – 2,000 units<\/td><td>₦50 (discount 2% of ₦50)<\/td><\/tr><tr><td>2,001 – 4,000 units<\/td><td>₦48<\/td><\/tr><tr><td>4,001 – 6,000 units<\/td><td>₦45<\/td><\/tr><tr><td>6,001 and above<\/td><td>₦30<\/td><\/tr><\/table><p>TC₁ = (50 × 600,000) + (600,000/1,000 × 20/1) + (1,000/2 × 0.70/1) = <b>30,012,350<\/b> TC₂ = (48 × 600,000) + (600,000/2,001 × 20/1) + (2,001/2 × 0.70) = <b>28,806,697.35<\/b> TC₃ = (45 × 600,000) + (600,000/4,001 × 20/1) + (4,001/2 × 0.70) = <b>27,004,399.6<\/b> TC₄ = (30 × 600,000) + (600,000/6,001 × 20/1) + (6,000/2 × 0.70) = <b>18,004,100.02<\/b> TC₅ = (45 × 5,856) + (5,856/4,001 × 20/1) + (4,001/2 × 0.70/1) = <b>264,949.62<\/b><\/p><h3 id=\"bus-block-1-6\">Assumptions for EBQ<\/h3><p>Using the 6 in EOQ + 2 other assumptions:<\/p><ol><li>…<\/li><li>…<\/li><\/ol>", "toc": [{"id": "bus-block-1-0", "t": "Reasons for Carrying Inventory — why must an org [carry inventory]?", "lv": 3}, {"id": "bus-block-1-1", "t": "Cost Involved in the Mgt of Inventories", "lv": 3}, {"id": "bus-block-1-2", "t": "Factors Involved in Inventory Problem Analysis", "lv": 3}, {"id": "bus-block-1-3", "t": "2 Ways of Modelling in Inventory System", "lv": 3}, {"id": "bus-block-1-4", "t": "Assumptions — EOQ model", "lv": 3}, {"id": "bus-block-1-5", "t": "Discount", "lv": 3}, {"id": "bus-block-1-6", "t": "Assumptions for EBQ", "lv": 3}]}]}, "bus-block-2": {"course": "BUS", "ref": "Block 2", "title": "Management: Evolution, Definition and Functions", "kicker": "Block 2 · Dr S. Edegwa", "words": 4113, "parts": [{"label": "Lecture note", "note": "Course Topic: Evolution of Management, Definition of Management, and Functions of Management", "src": "2. BUS 440 LECTURE NOTE 2025-2026 UNIVERSITY OF LAGOS.docx", "html": "<h3 id=\"bus-block-2-0\">Learning Objectives<\/h3><p>At the end of this lecture, students should be able to:<\/p><ul><li>Explain the meaning and importance of management.<\/li><li>Trace the historical evolution of management thought.<\/li><li>Discuss the major schools of management.<\/li><li>Explain the functions of management.<\/li><li>Apply management principles to engineering projects and industrial organizations.<\/li><\/ul><h2 id=\"bus-block-2-1\">1. Introduction<\/h2><p>Engineering is not only about technical knowledge but also about managing people, projects, materials, finances, and technology. Most engineering failures are not caused by poor technical design alone but by poor planning, ineffective leadership, inadequate communication, and weak control mechanisms. Management provides engineers with the knowledge and skills needed to coordinate resources efficiently to achieve organisational objectives.<\/p><p>Engineering managers are responsible for:<\/p><ul><li>Planning engineering projects<\/li><li>Managing human and material resources<\/li><li>Supervising production<\/li><li>Coordinating multidisciplinary teams<\/li><li>Ensuring quality and safety<\/li><li>Meeting project deadlines and budgets<\/li><\/ul><h2 id=\"bus-block-2-2\">2. Definition of Management<\/h2><p>Management has been defined by several scholars.<\/p><p><b>(a) Henri Fayol (1916):<\/b> Management is the process of forecasting, planning, organising, commanding, coordinating, and controlling. This definition emphasises management as a continuous process.<\/p><p><b>(b) Harold Koontz and Cyril O'Donnell (1976):<\/b> Management is the process of designing and maintaining an environment in which individuals, working together in groups, efficiently accomplish selected objectives. This definition stresses teamwork and organisational effectiveness.<\/p><p><b>(c) Mary Parker Follett (1941):<\/b> Management is the art of getting things done through people. This definition highlights human relations.<\/p><p><b>(d) Peter Drucker (1974):<\/b> Management is the organ of institutions that converts resources into productive performance. This definition views management as a productivity tool.<\/p><p><b>(e) George Terry (1977):<\/b> Management is a distinct process consisting of planning, organizing, actuating, and controlling performed to determine and accomplish objectives by the use of people and resources.<\/p><p><b>Comprehensive Definition:<\/b> Management is the process of planning, organizing, staffing, directing, coordinating, and controlling human, financial, material, and technological resources efficiently and effectively to achieve organisational goals.<\/p><h3 id=\"bus-block-2-3\">Characteristics of Management<\/h3><p>Management is:<\/p><ul><li>Goal-oriented<\/li><li>Universal<\/li><li>Continuous<\/li><li>Dynamic<\/li><li>Decision-making<\/li><li>People-centered<\/li><li>Multidisciplinary<\/li><li>Resource-oriented<\/li><li>Science and art<\/li><li>Results-oriented<\/li><\/ul><h3 id=\"bus-block-2-4\">Importance of Management in Engineering<\/h3><p>Management enables engineers to:Complete projects within schedule; Control project costs; improve quality; coordinate technical teams, enhance productivity, reduce waste; improve innovation; ensure safety compliance; and achieve customer satisfaction.<\/p><p>Example: Constructing a bridge requires: Engineers, Architects, Quantity surveyors, Procurement officers, Contractors, and Government agencies<\/p><p>Without proper management, even an excellent engineering design may fail during implementation.<\/p><h2 id=\"bus-block-2-5\">3. Evolution of Management<\/h2><p>Management practices have evolved over thousands of years. The evolution can be divided into several stages.<\/p><h3 id=\"bus-block-2-6\">Stage One: Ancient Management (3000 BC–1800 AD)<\/h3><p>Management principles existed long before formal theories. Examples include:<\/p><h3 id=\"bus-block-2-7\">Ancient Egypt<\/h3><p>Construction of pyramids required:<\/p><ul><li>Planning<\/li><li>Labour organization<\/li><li>Material management<\/li><li>Time scheduling<\/li><\/ul><h3 id=\"bus-block-2-8\">China<\/h3><p>Large irrigation systems and the Great Wall involved:<\/p><ul><li>Division of labour<\/li><li>Coordination<\/li><li>Supervision<\/li><\/ul><h3 id=\"bus-block-2-9\">Roman Empire<\/h3><p>Management principles were applied in:<\/p><ul><li>Military organization<\/li><li>Tax administration<\/li><li>Public works<\/li><li>Road construction<\/li><\/ul><h3 id=\"bus-block-2-10\">Industrial Crafts<\/h3><p>During the medieval period:<\/p><ul><li>Guilds controlled production.<\/li><li>Masters trained apprentices.<\/li><li>Quality standards were maintained.<\/li><\/ul><p>Although informal, these practices laid the foundation for modern management.<\/p><h3 id=\"bus-block-2-11\">Stage Two: Industrial Revolution (1760–1840)<\/h3><p>The Industrial Revolution transformed production from handcraft to machine production.<\/p><p>Major changes included:<\/p><ul><li>Large factories<\/li><li>Mass production<\/li><li>Specialized labour<\/li><li>Capital investment<\/li><li>Need for professional managers<\/li><\/ul><p>Problems emerged:<\/p><ul><li>Poor supervision<\/li><li>Low productivity<\/li><li>Labour conflicts<\/li><li>Inefficient production<\/li><\/ul><p>These challenges led scholars to develop formal management theories.<\/p><h3 id=\"bus-block-2-12\">Stage Three: Scientific Management School<\/h3><h3 id=\"bus-block-2-13\">Founder<\/h3><p>Frederick Winslow Taylor (1856–1915)<\/p><p>Known as the Father of Scientific Management.<\/p><p>Taylor believed work should be based on science rather than guesswork.<\/p><h3 id=\"bus-block-2-14\">Principles of Scientific Management<\/h3><ul><li>Science instead of rule of thumb<\/li><li>Scientific selection of workers<\/li><li>Scientific training<\/li><li>Cooperation between workers and managers<\/li><li>Equal division of work<\/li><\/ul><h3 id=\"bus-block-2-15\">Contributions<\/h3><ul><li>Time study<\/li><li>Motion study<\/li><li>Standardization<\/li><li>Incentive wage system<\/li><li>Productivity improvement<\/li><\/ul><h3 id=\"bus-block-2-16\">Applications in Engineering<\/h3><p>Scientific management is widely used in:<\/p><ul><li>Manufacturing<\/li><li>Production engineering<\/li><li>Assembly lines<\/li><li>Construction scheduling<\/li><li>Quality control<\/li><\/ul><h3 id=\"bus-block-2-17\">Criticisms<\/h3><ul><li>Treated workers like machines<\/li><li>Ignored social needs<\/li><li>Increased work pressure<\/li><li>Encouraged repetitive jobs<\/li><\/ul><h3 id=\"bus-block-2-18\">Summary of the Evolution of Management<\/h3><table><tr><th>Period<\/th><th>Major Focus<\/th><th>Key Contributors<\/th><\/tr><tr><td>Ancient Era<\/td><td>Organization of labour<\/td><td>Egyptians, Chinese, Romans<\/td><\/tr><tr><td>Industrial Revolution<\/td><td>Factory management<\/td><td>Industrialists<\/td><\/tr><tr><td>Scientific Management<\/td><td>Efficiency and productivity<\/td><td>F. W. Taylor<\/td><\/tr><tr><td>Administrative Theory<\/td><td>Organizational management<\/td><td>Henri Fayol<\/td><\/tr><tr><td>Bureaucratic Theory<\/td><td>Rules and structure<\/td><td>Max Weber<\/td><\/tr><tr><td>Human Relations<\/td><td>Employee motivation<\/td><td>Elton Mayo<\/td><\/tr><tr><td>Behavioural Science<\/td><td>Human behaviour<\/td><td>Maslow, McGregor, Herzberg<\/td><\/tr><tr><td>Modern Management<\/td><td>Systems, quality, technology<\/td><td>Contemporary scholars<\/td><\/tr><\/table><h3 id=\"bus-block-2-19\">Functions of Management<\/h3><p>The functions of management describe the core activities managers perform. A widely accepted framework includes five functions.<\/p><p><b>1. Planning:<\/b> Planning is deciding in advance what to do, how to do it, when to do it, and who should do it.<\/p><h3 id=\"bus-block-2-20\">Importance<\/h3><ul><li>Reduces uncertainty<\/li><li>Improves resource allocation<\/li><li>Sets objectives<\/li><li>Supports decision-making<\/li><li>Minimizes risk<\/li><\/ul><p><b>Engineering Example:<\/b> Developing a project schedule, budget, and risk management plan before constructing a highway.<\/p><p><b>2. Organizing:<\/b> Organizing involves arranging resources and assigning responsibilities to achieve organizational objectives.<\/p><h3 id=\"bus-block-2-21\">Activities<\/h3><ul><li>Designing organizational structures<\/li><li>Allocating tasks<\/li><li>Delegating authority<\/li><li>Coordinating departments<\/li><\/ul><p><b>Engineering Example:<\/b> Assigning civil, electrical, and mechanical engineers to different work packages on a construction project.<\/p><p><b>3. Staffing:<\/b> Staffing involves acquiring, developing, and retaining competent employees.<\/p><h3 id=\"bus-block-2-22\">Activities<\/h3><ul><li>Recruitment<\/li><li>Selection<\/li><li>Training<\/li><li>Performance appraisal<\/li><li>Career development<\/li><\/ul><p><b>Engineering Example:<\/b> Hiring qualified project engineers and providing training on new design software and safety procedures.<\/p><p><b>4. Directing (Leading):<\/b> Directing involves influencing and motivating employees to achieve organizational goals.<\/p><h3 id=\"bus-block-2-23\">Activities<\/h3><ul><li>Leadership<\/li><li>Motivation<\/li><li>Communication<\/li><li>Supervision<\/li><li>Conflict resolution<\/li><\/ul><p><b>Engineering Example:<\/b> A project manager motivating site engineers to meet milestones while maintaining safety standards.<\/p><p><b>5. Controlling:<\/b> Controlling is the process of measuring actual performance against planned objectives and taking corrective action where necessary.<\/p><h3 id=\"bus-block-2-24\">Steps<\/h3><ul><li>Set performance standards.<\/li><li>Measure actual performance.<\/li><li>Compare results with standards.<\/li><li>Identify deviations.<\/li><li>Take corrective action.<\/li><\/ul><p><b>Engineering Example:<\/b> Monitoring project costs, quality, and timelines, and addressing delays or budget overruns promptly.<\/p><h3 id=\"bus-block-2-25\">Relationship Among the Functions of Management<\/h3><p>The functions are interdependent and form a continuous cycle:<\/p><ul><li><b>Planning<\/b> sets objectives.<\/li><li><b>Organising<\/b> allocates resources.<\/li><li><b>Staffing<\/b> provides competent personnel.<\/li><li><b>Directing<\/b> guides and motivates employees.<\/li><li><b>Controlling<\/b> measures performance and feeds information back into future planning.<\/li><\/ul><h3 id=\"bus-block-2-26\">Application of Management Functions in Engineering<\/h3><table><tr><th>Function<\/th><th>Engineering Application<\/th><\/tr><tr><td>Planning<\/td><td>Project scheduling, budgeting, feasibility studies<\/td><\/tr><tr><td>Organizing<\/td><td>Team formation, work allocation, procurement<\/td><\/tr><tr><td>Staffing<\/td><td>Recruitment of engineers and technicians, training<\/td><\/tr><tr><td>Directing<\/td><td>Leadership, communication, safety supervision<\/td><\/tr><tr><td>Controlling<\/td><td>Quality assurance, cost control, schedule monitoring<\/td><\/tr><\/table><p><b>Conclusion:<\/b> Management has evolved from informal administrative practices in ancient civilizations to sophisticated theories and modern approaches that combine technical, behavioural, and analytical perspectives. For engineers, technical expertise alone is insufficient; successful project delivery requires effective planning, organizing, staffing, leadership, and control. Mastery of management principles enables engineers to deliver projects on time, within budget, to the required quality standards, and safely and sustainably.<\/p><h3 id=\"bus-block-2-27\">Suggested References<\/h3><ul><li>Daft, R. L. (2022). <i>Management<\/i> (14th ed.). Cengage Learning.<\/li><li>Drucker, P. F. (2008). <i>Management: Revised Edition<\/i>. HarperBusiness.<\/li><li>Fayol, H. (1949). <i>General and Industrial Management<\/i>. Pitman Publishing.<\/li><li>Koontz, H., Weihrich, H., &amp; Cannice, M. V. (2020). <i>Essentials of Management<\/i> (11th ed.). McGraw-Hill.<\/li><li>Robbins, S. P., &amp; Coulter, M. (2022). <i>Management<\/i> (15th ed.). Pearson.<\/li><li>Schermerhorn, J. R. (2021). <i>Management<\/i> (14th ed.). Wiley.<\/li><li>Taylor, F. W. (1911). <i>The Principles of Scientific Management<\/i>. Harper &amp; Brothers.<\/li><\/ul><h3 id=\"bus-block-2-28\">Lecture II: Management as an Art, a Science, or Both?<\/h3><h3 id=\"bus-block-2-29\">Learning Objectives<\/h3><p>At the end of this lecture, students should be able to:<\/p><ul><li>Define management as an art.<\/li><li>Explain management as a science.<\/li><li>Distinguish between management as an art and management as a science.<\/li><li>Discuss why management is regarded as both an art and a science.<\/li><li>Apply the concept to engineering practice and project management.<\/li><\/ul><h3 id=\"bus-block-2-30\">Introduction<\/h3><p>One of the oldest debates in management is whether management should be regarded as an <b>art<\/b>, a <b>science<\/b>, or <b>both<\/b>. Some scholars argue that management is an art because it requires creativity, leadership, intuition, judgment, and experience in dealing with people. Others argue that management is a science because it is based on systematic knowledge, established principles, theories, and analytical techniques. Modern management scholars generally agree that management combines both characteristics. Managers require scientific knowledge to make rational decisions and artistic skills to apply that knowledge effectively in real-world situations. For engineers, this debate is particularly important because engineering management requires both technical competence and the ability to lead people and manage projects successfully.<\/p><p><b>Meaning of Art:<\/b> Art is the practical application of knowledge, skills, creativity, and personal judgment to achieve desired objectives. Art is learned through:<\/p><ul><li>Practice<\/li><li>Experience<\/li><li>Observation<\/li><li>Creativity<\/li><li>Innovation<\/li><\/ul><p>Examples include: Medicine, Architecture, Music, Engineering design, and Teaching.<\/p><p>Like these professions, management requires practical skills that improve with experience.<\/p><h3 id=\"bus-block-2-31\">Characteristics of Art<\/h3><p>Management is regarded as an art because it possesses the following characteristics:<\/p><p><b>1. Practical Application of Knowledge:<\/b> Art involves applying theoretical knowledge to practical situations. Managers use management principles to solve organisational problems. <b>Example:<\/b> An engineering manager applies project scheduling principles to complete a bridge construction project within budget.<\/p><p><b>2. Personal Skills:<\/b> Every manager performs differently. Although managers may possess similar educational qualifications, their effectiveness depends on their personal abilities. Examples include:<\/p><ul><li>Communication<\/li><li>Leadership<\/li><li>Negotiation<\/li><li>Problem-solving<\/li><\/ul><h3 id=\"bus-block-2-32\">3.Creativity: Managers frequently encounter situations without standard solutions. Creativity enables managers to:<\/h3><ul><li>Develop innovative ideas<\/li><li>Improve production processes<\/li><li>Introduce new technologies<\/li><li>Solve unexpected problems<\/li><\/ul><p>Engineering managers often develop innovative construction methods to reduce project costs.<\/p><p><b>4. Experience:<\/b> Management skills improve through experience.<\/p><p>A manager with many years of industrial experience often handles crises more effectively than a newly appointed manager.<\/p><p><b>5. Result-Oriented:<\/b> Like every art, management aims at producing results.<\/p><p>Successful managers achieve:<\/p><ul><li>High productivity<\/li><li>Employee satisfaction<\/li><li>Customer satisfaction<\/li><li>Organizational growth<\/li><\/ul><h3 id=\"bus-block-2-33\">6. Continuous Improvement: Artists continually improve their skills through practice.<\/h3><p>Similarly, managers improve through: Training, Experience, Professional development, and Feedback<\/p><h3 id=\"bus-block-2-34\">Why Management is an Art<\/h3><p>Management is considered an art because managers must:<\/p><ul><li>Lead people<\/li><li>Motivate employees<\/li><li>Inspire teamwork<\/li><li>Resolve conflicts<\/li><li>Negotiate contracts<\/li><li>Make sound judgments<\/li><li>Exercise creativity<\/li><\/ul><p>No two management situations are exactly alike.<\/p><h3 id=\"bus-block-2-35\">Meaning of Science<\/h3><p>Science is a systematic body of knowledge developed through observation, experimentation, measurement, analysis, and verification.<\/p><p>Scientific knowledge is: Organized, Objective, Testable, Predictable, and Universal<\/p><p>Examples include:<\/p><ul><li>Physics<\/li><li>Chemistry<\/li><li>Mathematics<\/li><li>Engineering<\/li><li>Biology<\/li><\/ul><h2 id=\"bus-block-2-36\">Characteristics of Science<\/h2><h3 id=\"bus-block-2-37\">1. Systematic Body of Knowledge: Science is organized into principles and theories. Management has developed systematic theories such as:<\/h3><ul><li>Scientific Management<\/li><li>Administrative Theory<\/li><li>Bureaucratic Theory<\/li><li>Human Relations Theory<\/li><li>Systems Theory<\/li><li>Contingency Theory<\/li><\/ul><h3 id=\"bus-block-2-38\">2. Universal Principles: Scientific principles apply in many situations.<\/h3><p>Examples of management principles include:<\/p><ul><li>Division of labour<\/li><li>Unity of command<\/li><li>Delegation<\/li><li>Span of control<\/li><li>Planning<\/li><li>Coordination<\/li><\/ul><p>These principles are applied in organizations worldwide, although they may require adaptation to local conditions.<\/p><p><b>3. Cause-and-Effect Relationship:<\/b> Science identifies relationships between variables.<\/p><p>Management studies relationships such as:<\/p><ul><li>Motivation → Productivity<\/li><li>Training → Employee performance<\/li><li>Leadership → Organizational effectiveness<\/li><li>Planning → Project success<\/li><\/ul><h3 id=\"bus-block-2-39\">4. Observation and Experimentation: Management knowledge has developed through research and observation.<\/h3><p>Examples include:<\/p><ul><li>Time and motion studies<\/li><li>The Hawthorne experiments<\/li><li>Organizational behaviour research<\/li><li>Leadership studies<\/li><\/ul><p><b>5. Predictability:<\/b> Scientific knowledge helps managers predict outcomes. For example,<\/p><p>Effective planning generally reduces project delays and cost overruns.<\/p><p><b>6. Continuous Development:<\/b> Management knowledge continually expands through research in:<\/p><ul><li>Artificial Intelligence<\/li><li>Digital transformation<\/li><li>Strategic management<\/li><li>Supply chain management<\/li><li>Engineering project management<\/li><\/ul><h3 id=\"bus-block-2-40\">Why Management is a Science<\/h3><p>Management is regarded as a science because:<\/p><ul><li>It has established theories.<\/li><li>It uses systematic research.<\/li><li>It applies scientific methods.<\/li><li>It relies on measurable data.<\/li><li>It develops general principles.<\/li><li>It supports evidence-based decision-making.<\/li><\/ul><h3 id=\"bus-block-2-41\">Differences Between Management as an Art and Management as a Science<\/h3><table><tr><th>Management as an Art<\/th><th>Management as a Science<\/th><\/tr><tr><td>Based on practical skills<\/td><td>Based on systematic knowledge<\/td><\/tr><tr><td>Learned through experience<\/td><td>Learned through education and research<\/td><\/tr><tr><td>Requires creativity<\/td><td>Requires analysis and logical reasoning<\/td><\/tr><tr><td>Concerned with application<\/td><td>Concerned with theory and principles<\/td><\/tr><tr><td>Subjective<\/td><td>More objective<\/td><\/tr><tr><td>Focuses on judgment<\/td><td>Focuses on facts and evidence<\/td><\/tr><tr><td>Developed through practice<\/td><td>Developed through scientific investigation<\/td><\/tr><\/table><h3 id=\"bus-block-2-42\">Why Management is Both an Art and a Science<\/h3><p>Modern scholars agree that management is <b>both an art and a science<\/b> because successful managers combine theoretical knowledge with practical skills. Science provides the <b>knowledge<\/b>, while art provides the <b>ability to apply that knowledge effectively<\/b>.<\/p><p>For example: A project manager understands scientific techniques such as:<\/p><ul><li>Critical Path Method (CPM)<\/li><li>Project Evaluation and Review Technique (PERT)<\/li><li>Risk analysis<\/li><li>Budgeting<\/li><li>Forecasting<\/li><\/ul><p>However, completing a project successfully also requires:<\/p><ul><li>Leadership<\/li><li>Negotiation<\/li><li>Conflict resolution<\/li><li>Motivation<\/li><li>Emotional intelligence<\/li><\/ul><p>Thus, management cannot rely solely on scientific knowledge or artistic ability; both are essential.<\/p><h3 id=\"bus-block-2-43\">Engineering Perspective<\/h3><p>Engineering management clearly demonstrates the integration of art and science.<\/p><h3 id=\"bus-block-2-44\">Management as Science in Engineering<\/h3><p>Engineering managers use:<\/p><ul><li>Engineering economics<\/li><li>Operations research<\/li><li>Statistical quality control<\/li><li>Linear programming<\/li><li>Simulation models<\/li><li>Cost analysis<\/li><li>Risk assessment<\/li><li>Project scheduling software<\/li><\/ul><p>These involve scientific methods and quantitative analysis.<\/p><h3 id=\"bus-block-2-45\">Management as Art in Engineering<\/h3><p>Engineering managers also need to:<\/p><ul><li>Lead multidisciplinary teams<\/li><li>Communicate with stakeholders<\/li><li>Motivate employees<\/li><li>Resolve workplace conflicts<\/li><li>Make ethical decisions<\/li><li>Handle uncertainty<\/li><li>Encourage innovation<\/li><\/ul><p>These activities depend on interpersonal and leadership skills.<\/p><p><b>Practical Example:<\/b> Suppose an engineering company is constructing a highway.<\/p><p><b>Scientific Aspect:<\/b> The project manager uses:<\/p><ul><li>Gantt Charts<\/li><li>CPM<\/li><li>PERT<\/li><li>Cost estimation<\/li><li>Productivity analysis<\/li><li>Risk management software<\/li><\/ul><p>These are scientific tools.<\/p><h3 id=\"bus-block-2-46\">Artistic Aspect<\/h3><p>The same manager must:<\/p><ul><li>Motivate workers<\/li><li>Resolve disputes among contractors<\/li><li>Negotiate with government agencies<\/li><li>Inspire teamwork<\/li><li>Make quick decisions during emergencies<\/li><\/ul><p>These require managerial artistry.<\/p><h3 id=\"bus-block-2-47\">Advantages of Viewing Management as Both Art and Science<\/h3><ul><li>Promotes evidence-based decision-making.<\/li><li>Encourages creativity and innovation.<\/li><li>Improves organizational performance.<\/li><li>Supports effective leadership.<\/li><li>Enhances project success.<\/li><li>Facilitates problem-solving.<\/li><li>Balances technical and human factors.<\/li><li>Produces competent engineering managers.<\/li><\/ul><h3 id=\"bus-block-2-48\">Criticisms<\/h3><p>Some scholars argue that management is <b>not a pure science<\/b> because:<\/p><ul><li>Human behaviour cannot always be predicted.<\/li><li>Organizational environments constantly change.<\/li><li>Managerial decisions involve subjective judgment.<\/li><li>Cultural differences affect management practices.<\/li><\/ul><p>Others argue that management is <b>more than an art<\/b> because:<\/p><ul><li>It has developed established theories.<\/li><li>Research continually improves management knowledge.<\/li><li>Many managerial decisions rely on quantitative analysis.<\/li><\/ul><p>These criticisms reinforce the view that management is best understood as both an art and a science.<\/p><h3 id=\"bus-block-2-49\">Contemporary View<\/h3><p>Today, management is increasingly regarded as a profession that integrates scientific knowledge with practical competence. Advances in data analytics, artificial intelligence, and digital technologies have strengthened its scientific foundation, while globalization and diverse workforces have increased the importance of leadership, communication, adaptability, and ethical judgment. Successful managers therefore combine analytical skills with interpersonal effectiveness.<\/p><h3 id=\"bus-block-2-50\">Conclusion<\/h3><p>The debate over whether management is an art or a science has largely been resolved by recognizing that it embodies both dimensions. The scientific aspect provides theories, principles, methods, and analytical tools that guide managerial decision-making. The artistic aspect enables managers to apply those principles creatively, lead people effectively, and respond to complex organizational challenges. For engineering professionals, success depends not only on technical expertise but also on the ability to integrate scientific methods with the art of leadership and people management.<\/p><h3 id=\"bus-block-2-51\">Key Takeaways<\/h3><ul><li><b>Management as an Art:<\/b> Emphasizes practical application, creativity, experience, leadership, and judgment.<\/li><li><b>Management as a Science:<\/b> Emphasizes systematic knowledge, research, principles, evidence, and analytical methods.<\/li><li><b>Management as Both:<\/b> Effective managers integrate scientific knowledge with practical skills to achieve organisational goals<\/li><\/ul><h3 id=\"bus-block-2-52\">Topic: Evolution of Management Theories<\/h3><h3 id=\"bus-block-2-53\">Learning Objectives<\/h3><p>At the end of this lecture, students should be able to:<\/p><ul><li>Explain the concept of management theory.<\/li><li>Describe the historical evolution of management theories.<\/li><li>Discuss the major schools of management thought and their proponents.<\/li><li>Compare classical, neo-classical, and modern management theories.<\/li><li>Evaluate the relevance of management theories to engineering organizations and project management.<\/li><li>Apply management theories to contemporary engineering and industrial challenges.<\/li><\/ul><h2 id=\"bus-block-2-54\">1. Introduction<\/h2><p>Management theories are systematic frameworks that explain how organizations should be managed to achieve efficiency, productivity, and organizational goals. They provide managers with principles, models, and guidelines for planning, organizing, leading, motivating, and controlling organizational activities.<\/p><p>The evolution of management theories reflects changes in economic conditions, technological advancements, industrial development, globalization, and the increasing complexity of organizations. As organizations evolved from small workshops to multinational corporations, management thinking also evolved from simple supervisory practices to sophisticated strategic and systems-oriented approaches.<\/p><p>For engineers, understanding management theories is essential because engineering projects involve not only technical expertise but also leadership, teamwork, resource allocation, decision-making, innovation, and project control.<\/p><h2 id=\"bus-block-2-55\">2. Meaning of Management Theory<\/h2><p>Management theory refers to the systematic collection of ideas, principles, concepts, and practices developed to explain how organizations should be managed effectively and efficiently.<\/p><p>According to scholars, management theories help managers:<\/p><ul><li>Understand organizational behaviour.<\/li><li>Improve decision-making.<\/li><li>Increase productivity.<\/li><li>Motivate employees.<\/li><li>Solve organizational problems.<\/li><li>Achieve strategic objectives.<\/li><\/ul><p>Management theories have developed over more than a century and continue to evolve in response to new organizational challenges.<\/p><h2 id=\"bus-block-2-56\">3. Evolution of Management Theories<\/h2><p>The development of management thought can be divided into three major periods:<\/p><ul><li><b>Classical Management Theories (1880–1930)<\/b><\/li><li><b>Neo-Classical (Behavioural) Management Theories (1930–1950)<\/b><\/li><li><b>Modern Management Theories (1950–Present)<\/b><\/li><\/ul><h3 id=\"bus-block-2-57\">I. Classical Management Theories (1880–1930)<\/h3><p>The Classical School emerged during the Industrial Revolution when factories expanded rapidly and organizations sought ways to improve productivity and efficiency.<\/p><p>The classical theorists believed that organizations should be managed scientifically through specialization, standardization, hierarchy, and formal structures.<\/p><p>The classical school consists of three major theories:<\/p><ul><li>Scientific Management Theory<\/li><li>Administrative Management Theory<\/li><li>Bureaucratic Management Theory<\/li><\/ul><h3 id=\"bus-block-2-58\">A. Scientific Management Theory<\/h3><h3 id=\"bus-block-2-59\">Proponent<\/h3><p>Frederick Winslow Taylor (1856–1915)<\/p><p>Known as the <b>Father of Scientific Management<\/b>.<\/p><h3 id=\"bus-block-2-60\">Background<\/h3><p>Taylor observed that workers often used inefficient methods and that production depended largely on personal experience rather than scientific analysis.<\/p><p>He proposed replacing the &quot;rule of thumb&quot; with scientifically developed methods.<\/p><h3 id=\"bus-block-2-61\">Principles of Scientific Management<\/h3><ul><li>Science instead of rule of thumb.<\/li><li>Scientific selection of workers.<\/li><li>Scientific training and development.<\/li><li>Cooperation between management and workers.<\/li><li>Equal division of work and responsibility.<\/li><\/ul><h3 id=\"bus-block-2-62\">Contributions<\/h3><ul><li>Time study<\/li><li>Motion study<\/li><li>Standardization<\/li><li>Differential wage system<\/li><li>Work specialization<\/li><li>Productivity improvement<\/li><\/ul><h3 id=\"bus-block-2-63\">Advantages<\/h3><ul><li>Increased efficiency<\/li><li>Reduced production costs<\/li><li>Higher productivity<\/li><li>Better work methods<\/li><li>Standardized operations<\/li><\/ul><h3 id=\"bus-block-2-64\">Criticisms<\/h3><ul><li>Treated workers like machines.<\/li><li>Ignored employee emotions.<\/li><li>Reduced creativity.<\/li><li>Encouraged repetitive work.<\/li><\/ul><h3 id=\"bus-block-2-65\">Engineering Application<\/h3><p>Scientific management is widely applied in:<\/p><ul><li>Manufacturing systems<\/li><li>Production engineering<\/li><li>Assembly-line operations<\/li><li>Industrial automation<\/li><li>Lean production<\/li><li>Construction scheduling<\/li><\/ul><h3 id=\"bus-block-2-66\">B. Administrative Management Theory<\/h3><h3 id=\"bus-block-2-67\">Proponent<\/h3><p>Henri Fayol (1841–1925)<\/p><p>Known as the <b>Father of Administrative Management<\/b>.<\/p><p>Unlike Taylor, Fayol focused on managing the entire organization rather than individual workers.<\/p><h3 id=\"bus-block-2-68\">Fayol's 14 Principles of Management<\/h3><ul><li>Division of work<\/li><li>Authority and responsibility<\/li><li>Discipline<\/li><li>Unity of command<\/li><li>Unity of direction<\/li><li>Subordination of individual interest<\/li><li>Remuneration<\/li><li>Centralization<\/li><li>Scalar chain<\/li><li>Order<\/li><li>Equity<\/li><li>Stability of tenure<\/li><li>Initiative<\/li><li>Esprit de corps<\/li><\/ul><h3 id=\"bus-block-2-69\">Fayol's Functions of Management<\/h3><p>Originally, Fayol identified:<\/p><ul><li>Planning<\/li><li>Organizing<\/li><li>Commanding<\/li><li>Coordinating<\/li><li>Controlling<\/li><\/ul><p>These have evolved into the modern management functions of planning, organizing, staffing, leading, and controlling<\/p><h3 id=\"bus-block-2-70\">Contributions<\/h3><ul><li>Universal management principles<\/li><li>Management education<\/li><li>Organizational coordination<\/li><li>Administrative efficiency<\/li><\/ul><h3 id=\"bus-block-2-71\">Criticisms<\/h3><ul><li>Principles may not fit every situation.<\/li><li>Overemphasized formal authority.<\/li><li>Limited attention to employee motivation.<\/li><\/ul><h3 id=\"bus-block-2-72\">Engineering Application<\/h3><p>Engineering firms use Fayol's principles in:<\/p><ul><li>Project planning<\/li><li>Organizational design<\/li><li>Construction management<\/li><li>Infrastructure development<\/li><li>Resource coordination<\/li><\/ul><h3 id=\"bus-block-2-73\">C. Bureaucratic Management Theory<\/h3><h3 id=\"bus-block-2-74\">Proponent<\/h3><p>Max Weber (1864–1920)<\/p><p>Weber believed organizations should be governed by rational rules rather than personal relationships.<\/p><h3 id=\"bus-block-2-75\">Characteristics<\/h3><ul><li>Division of labour<\/li><li>Formal hierarchy<\/li><li>Rules and regulations<\/li><li>Merit-based recruitment<\/li><li>Written documentation<\/li><li>Impersonal relationships<\/li><\/ul><h3 id=\"bus-block-2-76\">Advantages<\/h3><ul><li>Consistency<\/li><li>Accountability<\/li><li>Fairness<\/li><li>Efficiency<\/li><li>Professionalism<\/li><\/ul><h3 id=\"bus-block-2-77\">Criticisms<\/h3><ul><li>Excessive rigidity<\/li><li>Slow decision-making<\/li><li>Too much paperwork<\/li><li>Resistance to innovation<\/li><\/ul><h3 id=\"bus-block-2-78\">Engineering Application<\/h3><p>Bureaucratic principles are common in:<\/p><ul><li>Government engineering agencies<\/li><li>Public works departments<\/li><li>Regulatory organizations<\/li><li>Large construction firms<\/li><\/ul><h3 id=\"bus-block-2-79\">II. Neo-Classical (Behavioural) Management Theories (1930–1950)<\/h3><p>The behavioural school emerged because classical theories paid insufficient attention to the human side of organizations.<\/p><p>Behavioural theorists argued that employee motivation, leadership, communication, and social relationships strongly influence organizational performance.<\/p><h3 id=\"bus-block-2-80\">A. Human Relations Theory<\/h3><h3 id=\"bus-block-2-81\">Proponent<\/h3><p>Elton Mayo<\/p><h3 id=\"bus-block-2-82\">Hawthorne Studies (1924–1932)<\/h3><p>Conducted at the Western Electric Company.<\/p><h3 id=\"bus-block-2-83\">Major Findings<\/h3><ul><li>Employees are motivated by recognition.<\/li><li>Informal groups influence behaviour.<\/li><li>Leadership affects productivity.<\/li><li>Communication improves performance.<\/li><li>Social factors matter.<\/li><\/ul><h3 id=\"bus-block-2-84\">Contributions<\/h3><ul><li>Human-centred management<\/li><li>Employee welfare<\/li><li>Teamwork<\/li><li>Participation<\/li><li>Communication<\/li><\/ul><h3 id=\"bus-block-2-85\">Engineering Application<\/h3><p>Useful in:<\/p><ul><li>Team management<\/li><li>Safety culture<\/li><li>Employee engagement<\/li><li>Project collaboration<\/li><\/ul><h3 id=\"bus-block-2-86\">B. Behavioural Science Theory<\/h3><p>Major contributors include:<\/p><ul><li>Abraham Maslow<\/li><li>Douglas McGregor<\/li><li>Frederick Herzberg<\/li><li>Chris Argyris<\/li><\/ul><h3 id=\"bus-block-2-87\">Main Ideas<\/h3><p>Behavioural scientists studied:<\/p><ul><li>Motivation<\/li><li>Leadership<\/li><li>Personality<\/li><li>Learning<\/li><li>Organizational culture<\/li><li>Employee satisfaction<\/li><\/ul><h3 id=\"bus-block-2-88\">Contributions<\/h3><ul><li>Improved leadership<\/li><li>Better motivation systems<\/li><li>Organizational development<\/li><li>Employee participation<\/li><\/ul><h3 id=\"bus-block-2-89\">Engineering Application<\/h3><p>Behavioural theories improve:<\/p><ul><li>Team leadership<\/li><li>Innovation<\/li><li>Knowledge sharing<\/li><li>Research and development<\/li><li>Cross-functional collaboration<\/li><\/ul><h3 id=\"bus-block-2-90\">III. Modern Management Theories (1950–Present)<\/h3><p>Modern theories recognize that organizations operate in dynamic and complex environments.<\/p><p>Managers must adapt to technological, economic, political, and social changes.<\/p><p>Major modern theories include:<\/p><h3 id=\"bus-block-2-91\">A. Systems Theory<\/h3><h3 id=\"bus-block-2-92\">Proponent<\/h3><p>Often associated with Ludwig von Bertalanffy.<\/p><h3 id=\"bus-block-2-93\">Main Idea<\/h3><p>Organizations are systems made up of interrelated and interdependent parts that work together to achieve common goals.<\/p><h3 id=\"bus-block-2-94\">Components of a System<\/h3><ul><li>Inputs<\/li><li>Transformation process<\/li><li>Outputs<\/li><li>Feedback<\/li><li>Environment<\/li><\/ul><h3 id=\"bus-block-2-95\">Engineering Application<\/h3><p>Engineering projects involve interconnected systems such as:<\/p><ul><li>Procurement<\/li><li>Design<\/li><li>Production<\/li><li>Quality control<\/li><li>Logistics<\/li><li>Customer service<\/li><\/ul><p>Failure in one subsystem affects the entire project.<\/p><h3 id=\"bus-block-2-96\">B. Contingency Theory<\/h3><h3 id=\"bus-block-2-97\">Major Contributors<\/h3><ul><li>Fred Fiedler<\/li><li>Paul Lawrence<\/li><li>Jay Lorsch<\/li><\/ul><h3 id=\"bus-block-2-98\">Main Idea<\/h3><p>There is <b>no one best way<\/b> to manage.<\/p><p>Management decisions depend on:<\/p><ul><li>Organizational size<\/li><li>Technology<\/li><li>Environment<\/li><li>Employees<\/li><li>Organizational goals<\/li><\/ul><h3 id=\"bus-block-2-99\">Engineering Application<\/h3><p>Engineering managers adopt different leadership styles depending on:<\/p><ul><li>Project complexity<\/li><li>Team experience<\/li><li>Safety risks<\/li><li>Technology<\/li><li>Deadlines<\/li><\/ul><h3 id=\"bus-block-2-100\">C. Quantitative (Management Science) Theory<\/h3><p>This theory applies mathematics and analytical models to managerial decision-making.<\/p><h3 id=\"bus-block-2-101\">Techniques<\/h3><ul><li>Operations research<\/li><li>Linear programming<\/li><li>Simulation<\/li><li>Inventory models<\/li><li>Forecasting<\/li><li>Queuing theory<\/li><li>Decision analysis<\/li><\/ul><h3 id=\"bus-block-2-102\">Engineering Application<\/h3><p>Widely used in:<\/p><ul><li>Production planning<\/li><li>Logistics<\/li><li>Transportation<\/li><li>Manufacturing<\/li><li>Project scheduling<\/li><li>Supply chain optimization<\/li><\/ul><h3 id=\"bus-block-2-103\">D. Total Quality Management (TQM)<\/h3><p>TQM focuses on continuous improvement and customer satisfaction through organization-wide participation.<\/p><h3 id=\"bus-block-2-104\">Key Principles<\/h3><ul><li>Customer focus<\/li><li>Continuous improvement<\/li><li>Employee involvement<\/li><li>Process management<\/li><li>Data-driven decision-making<\/li><\/ul><p>Engineering organizations use TQM to improve product quality and reduce defects.<\/p><h3 id=\"bus-block-2-105\">E. Lean Management<\/h3><p>Lean Management seeks to eliminate waste while maximizing customer value.<\/p><h3 id=\"bus-block-2-106\">Types of Waste<\/h3><ul><li>Overproduction<\/li><li>Waiting time<\/li><li>Excess inventory<\/li><li>Defects<\/li><li>Unnecessary transportation<\/li><li>Excess motion<\/li><li>Overprocessing<\/li><\/ul><p>Engineering firms adopt Lean to improve productivity and reduce costs.<\/p><h3 id=\"bus-block-2-107\">F. Agile Management<\/h3><p>Agile emphasizes flexibility, collaboration, iterative development, and rapid response to change.<\/p><p>It is widely used in:<\/p><ul><li>Software engineering<\/li><li>Product development<\/li><li>Innovation projects<\/li><li>Research and development<\/li><\/ul><h3 id=\"bus-block-2-108\">Comparison of Major Management Theories<\/h3><table><tr><th>Theory<\/th><th>Main Focus<\/th><th>Strengths<\/th><th>Weaknesses<\/th><\/tr><tr><td>Scientific Management<\/td><td>Efficiencyand productivity<\/td><td>High productivity<\/td><td>Ignores human needs<\/td><\/tr><tr><td>Administrative Theory<\/td><td>Organizational structure<\/td><td>Universal principles<\/td><td>Rigid in some situations<\/td><\/tr><tr><td>Bureaucratic Theory<\/td><td>Rules and hierarchy<\/td><td>Accountability<\/td><td>Excessive formalization<\/td><\/tr><tr><td>Human Relations<\/td><td>Employee satisfaction<\/td><td>Better morale<\/td><td>May underemphasize productivity<\/td><\/tr><tr><td>Behavioural Science<\/td><td>Human behaviour<\/td><td>Improved leadership<\/td><td>Human behaviour is difficult to predict<\/td><\/tr><tr><td>Systems Theory<\/td><td>Organizational interdependence<\/td><td>Holistic perspective<\/td><td>Can be complex to implement<\/td><\/tr><tr><td>Contingency Theory<\/td><td>Situational management<\/td><td>Flexible<\/td><td>No universal guidelines<\/td><\/tr><tr><td>Quantitative Theory<\/td><td>Data-driven decisions<\/td><td>Analytical accuracy<\/td><td>May overlook human factors<\/td><\/tr><tr><td>TQM<\/td><td>Continuous improvement<\/td><td>Quality enhancement<\/td><td>Requires organizational commitment<\/td><\/tr><tr><td>Lean Management<\/td><td>Waste reduction<\/td><td>Cost efficiency<\/td><td>Difficult cultural change<\/td><\/tr><tr><td>Agile Management<\/td><td>Adaptability<\/td><td>Innovation and speed<\/td><td>Less suitable for highly rigid environments<\/td><\/tr><\/table><h3 id=\"bus-block-2-109\">Relevance of Management Theories to Engineering<\/h3><p>Engineering organizations apply these theories in:<\/p><ul><li>Project management<\/li><li>Production management<\/li><li>Quality assurance<\/li><li>Supply chain management<\/li><li>Construction management<\/li><li>Manufacturing systems<\/li><li>Research and development<\/li><li>Innovation management<\/li><li>Risk management<\/li><li>Sustainability initiatives<\/li><\/ul><p>An effective engineering manager integrates ideas from multiple theories rather than relying on a single approach.<\/p><h3 id=\"bus-block-2-110\">Contemporary Trends in Management Theory<\/h3><p>Management theory continues to evolve in response to global challenges. Emerging areas include:<\/p><ul><li>Digital Transformation<\/li><li>Artificial Intelligence (AI)-enabled Management<\/li><li>Industry 4.0 and Smart Manufacturing<\/li><li>Sustainability and Green Management<\/li><li>Knowledge Management<\/li><li>Strategic Management<\/li><li>Innovation Management<\/li><li>Remote and Hybrid Work Management<\/li><li>Data Analytics for Decision-Making<\/li><\/ul><p>These developments are particularly relevant for engineering managers working in technologically advanced and globally connected industries.<\/p><h3 id=\"bus-block-2-111\">Conclusion<\/h3><p>The evolution of management theories reflects the continuous search for better ways to manage organizations. From the efficiency-driven Classical School to the human-centred Neo-Classical School and the adaptive, technology-driven Modern School, each theory has contributed valuable insights. Contemporary engineering managers should understand the strengths and limitations of each perspective and apply them appropriately to improve organizational performance, innovation, and project success.<\/p><h3 id=\"bus-block-2-112\">Key Takeaways<\/h3><ul><li>Management theories evolved from <b>Classical<\/b> to <b>Neo-Classical<\/b> and <b>Modern<\/b> perspectives.<\/li><li>No single theory is universally applicable; effective managers combine ideas from multiple schools.<\/li><li>Engineering management requires balancing efficiency, organizational structure, human relations, and adaptability.<\/li><li>Modern theories emphasize systems thinking, contingency, data-driven decisions, quality, lean practices, and agility.<\/li><li>Understanding the evolution of management thought enables engineering graduates to manage complex projects and organizations effectively.<\/li><\/ul><h3 id=\"bus-block-2-113\">TOPIC: MANAGEMENT AND ADMINISTRATION: Conceptual Clarification<\/h3><p><b>Management<\/b> is the process of planning, organizing, staffing, directing, coordinating, and controlling organizational resources to achieve predetermined objectives efficiently and effectively.<\/p><p><b>Administration<\/b> is the process of determining organizational objectives, formulating policies, and coordinating resources for achieving those objectives. Administration deals primarily with policy formulation, strategic planning, governance, and organizational direction.<\/p><p>Definitions<\/p><p>Theo Haimann: Administration is the overall determination of policies, setting of major objectives, identification of general purposes and laying down broad programmes.<\/p><p>E.F.L. Brech: Administration is concerned with determining the objectives and major policies of an organization.<\/p><h3 id=\"bus-block-2-114\">Characteristics of Administration<\/h3><p>Determines organizational goals.<\/p><p>Formulates policies.<\/p><p>Represents top-level authority.<\/p><p>Focuses on long-term direction.<\/p><p>Coordinates organizational activities.<\/p><p>Allocates strategic resources.<\/p><h3 id=\"bus-block-2-115\">DIFFERENCE BETWEEN MANAGEMENT AND ADMINISTRATION<\/h3><table><tr><th>Management<\/th><th>Administration<\/th><\/tr><tr><td>Implements policies<\/td><td>Formulates policies<\/td><\/tr><tr><td>Concerned with execution<\/td><td>Concerned with decision making<\/td><\/tr><tr><td>Middle and lower levels<\/td><td>Top management level<\/td><\/tr><tr><td>Operational in nature<\/td><td>Strategic in nature<\/td><\/tr><tr><td>Focuses on efficiency<\/td><td>Focuses on effectiveness<\/td><\/tr><tr><td>Supervises employees<\/td><td>Directs managers<\/td><\/tr><tr><td>Concerned with &quot;how&quot; work is done<\/td><td>Concerned with &quot;what&quot; and &quot;why&quot;<\/td><\/tr><\/table><h2 id=\"bus-block-2-116\">5. RELATIONSHIP BETWEEN MANAGEMENT AND ADMINISTRATION<\/h2><p>Although management and administration have different emphases, they are complementary. Administration establishes organizational objectives and policies, while management implements these policies by coordinating people and resources. Successful engineering organizations require both sound administrative leadership and effective managerial execution.<\/p>", "toc": [{"id": "bus-block-2-0", "t": "Learning Objectives", "lv": 3}, {"id": "bus-block-2-1", "t": "1. Introduction", "lv": 2}, {"id": "bus-block-2-2", "t": "2. Definition of Management", "lv": 2}, {"id": "bus-block-2-3", "t": "Characteristics of Management", "lv": 3}, {"id": "bus-block-2-4", "t": "Importance of Management in Engineering", "lv": 3}, {"id": "bus-block-2-5", "t": "3. Evolution of Management", "lv": 2}, {"id": "bus-block-2-6", "t": "Stage One: Ancient Management (3000 BC–1800 AD)", "lv": 3}, {"id": "bus-block-2-7", "t": "Ancient Egypt", "lv": 3}, {"id": "bus-block-2-8", "t": "China", "lv": 3}, {"id": "bus-block-2-9", "t": "Roman Empire", "lv": 3}, {"id": "bus-block-2-10", "t": "Industrial Crafts", "lv": 3}, {"id": "bus-block-2-11", "t": "Stage Two: Industrial Rev lv": 3}, {"id": "bus-block-2-95", "t": "Engineering Application", "lv": 3}, {"id": "bus-block-2-96", "t": "B. Contingency Theory", "lv": 3}, {"id": "bus-block-2-97", "t": "Major Contributors", "lv": 3}, {"id": "bus-block-2-98", "t": "Main Idea", "lv": 3}, {"id": "bus-block-2-99", "t": "Engineering Application", "lv": 3}, {"id": "bus-block-2-100", "t": "C. Quantitative (Management Science) Theory", "lv": 3}, {"id": "bus-block-2-101", "t": "Techniques", "lv": 3}, {"id": "bus-block-2-102", "t": "Engineering Application", "lv": 3}, {"id": "bus-block-2-103", "t": "D. Total Quality Management (TQM)", "lv": 3}, {"id": "bus-block-2-104", "t": "Key Principles", "lv": 3}, {"id": "bus-block-2-105", "t": "E. Lean Management", "lv": 3}, {"id": "bus-block-2-106", "t": "Types of Waste", "lv": 3}, {"id": "bus-block-2-107", "t": "F. Agile Management", "lv": 3}, {"id": "bus-block-2-108", "t": "Comparison of Major Management Theories", "lv": 3}, {"id": "bus-block-2-109", "t": "Relevance of Management Theories to Engineering", "lv": 3}, {"id": "bus-block-2-110", "t": "Contemporary Trends in Management Theory", "lv": 3}, {"id": "bus-block-2-111", "t": "Conclusion", "lv": 3}, {"id": "bus-block-2-112", "t": "Key Takeaways", "lv": 3}, {"id": "bus-block-2-113", "t": "TOPIC: MANAGEMENT AND ADMINISTRATION: Conceptual Clarification", "lv": 3}, {"id": "bus-block-2-114", "t": "Characteristics of Administration", "lv": 3}, {"id": "bus-block-2-115", "t": "DIFFERENCE BETWEEN MANAGEMENT AND ADMINISTRATION", "lv": 3}, {"id": "bus-block-2-116", "t": "5. RELATIONSHIP BETWEEN MANAGEMENT AND ADMINISTRATION", "lv": 2}]}]}, "bus-block-3": {"course": "BUS", "ref": "Block 3", "title": "Total Quality Management", "kicker": "Block 3 · Dr O. G. Oyenuga", "words": 10741, "parts": [{"label": "Introduction to Total Quality Management", "note": "OYENUGA, O. G. Ph.D.", "src": "3.1 INTRODUCTION TO TOTAL QUALITY MANAGEMENT.pptx", "html": "<h3 id=\"bus-block-3-0\">NATURE AND SCOPE<\/h3><ul><li>Total Quality Management = Total + Quality + Management<\/li><li>Total means complete amount or a whole, Quality talks about the degree of excellence while, Management means the act of getting things done through other people.<\/li><li>Thus total-quality-management stands for a management philosophy that emphasizes continuous improvement in all aspects of an organisation’s operations, with the ultimate goal of achieving customer satisfaction.<\/li><li><b>Total Quality Management<\/b> is a technique of managing the organisation to achieve excellence with focus on <b>CUSTOMER…<\/b><\/li><li><b>Simply…<\/b> It means “Do the right things, right the first time, every time”<\/li><\/ul><h3 id=\"bus-block-3-1\">CORE PRINCIPLES OF TQM<\/h3><ul><li>Customer Focus<\/li><li>Continuous Improvement<\/li><li>Employee Involvement<\/li><li>Process Approach<\/li><li>Integrated System<\/li><li>Strategic and Systematic Approach<\/li><li>Decision-making based on Data<\/li><li>Effective communication<\/li><\/ul><h3 id=\"bus-block-3-2\">DIMENSIONS OF TQM<\/h3><ul><li>Leadership Commitment: Commitment from top management.<\/li><li>Customer Satisfaction: Understanding and meeting customer needs not wants.<\/li><li>Employee Involvement: Training, empowerment, and participation.<\/li><li>Process Management: Systematic approach to managing processes.<\/li><li>Continuous Improvement (Kaizen): Ongoing effort to enhance firm’s performance.<\/li><li>Fact-Based Decision-making: Using data for decision making.<\/li><\/ul><h3 id=\"bus-block-3-3\">TQM TOOLS<\/h3><ul><li><b>Pareto Charts<\/b>: used for identifying most significant factors.<\/li><li><b>Fishbone Diagram<\/b>: used for root cause analysis.<\/li><li><b>Control Charts<\/b>: used for monitoring process variation.<\/li><li><b>Flow Charts<\/b>: used for visualizing process steps.<\/li><li><b>Check Sheets<\/b>: used for data collection.<\/li><li><b>Scatter Diagrams<\/b>: used for identifying correlations.<\/li><li><b>Histograms<\/b>: used for understanding data distribution.<\/li><\/ul><h3 id=\"bus-block-3-4\">OBSTACLES IN IMPLEMENTING TQM<\/h3><ul><li>Lack of management commitment<\/li><li>Poor employee engagement<\/li><li>Insufficient training<\/li><li>Resistance to change<\/li><li>Inadequate resources<\/li><li>Misunderstanding of TQM principles<\/li><li>Short-term focus over long-term goals<\/li><\/ul><h3 id=\"bus-block-3-5\">STRATEGIES TO OVERCOME TQM BARRIERS<\/h3><ul><li>Secure top management support<\/li><li>Provide continuous training and education<\/li><li>Encourage open communication<\/li><li>Align TQM with organisational goals<\/li><li>Recognise and reward quality improvements.<\/li><\/ul><h3 id=\"bus-block-3-6\">ISO 9000<\/h3><ul><li><b>ISO 9000 series<\/b><\/li><li>These are international standards for quality management systems that focus on process consistency and customer satisfaction.<\/li><li>It helps in documentation and continuous improvement of the production/service system.<\/li><\/ul><h3 id=\"bus-block-3-7\">Other Quality Systems<\/h3><ul><li>ISO 14000 series<\/li><li>ISO 14000: Environmental management<\/li><li>ISO 14001: Occupational health and safety<\/li><li>Six sigma<\/li><li>Lean management<\/li><li>Baldrige Performance Excellence Program<\/li><li>NAFDAC<\/li><li>NUC<\/li><\/ul><h3 id=\"bus-block-3-8\">BENEFITS OF TQM<\/h3><ul><li>Higher customer satisfaction<\/li><li>Improved product and service quality<\/li><li>Increased efficiency and productivity<\/li><li>Better employee morale<\/li><li>Enhanced competitive advantage<\/li><li>Cost reduction and fewer errors<\/li><\/ul>", "toc": [{"id": "bus-block-3-0", "t": "NATURE AND SCOPE", "lv": 3}, {"id": "bus-block-3-1", "t": "CORE PRINCIPLES OF TQM", "lv": 3}, {"id": "bus-block-3-2", "t": "DIMENSIONS OF TQM", "lv": 3}, {"id": "bus-block-3-3", "t": "TQM TOOLS", "lv": 3}, {"id": "bus-block-3-4", "t": "OBSTACLES IN IMPLEMENTING TQM", "lv": 3}, {"id": "bus-block-3-5", "t": "STRATEGIES TO OVERCOME TQM BARRIERS", "lv": 3}, {"id": "bus-block-3-6", "t": "ISO 9000",
