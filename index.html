ot;, &quot;…0,000&quot;, &quot;…0,000&quot;.<\/p>", "toc": [{"id": "bus-block-6-15", "t": "Project Management", "lv": 3}]}, {"label": "Lecture 3: Control Charts, Project Evaluation, Appraisal & Control", "note": "L3 — July 24", "src": "6.3 Lecture 3 - July 24 (transcript).md", "html": "<h4>Page 1<\/h4><p><b>Illustration<\/b><\/p><p>25 engine mounts are sampled each day and found to have an average width of 2 inches with a standard measure of 0.1 inch. What are the control limits?<\/p><p><b>X̄ ± 3(σ/√n)<\/b><\/p><p>n = 2.5 X̄ = 2 σ = 0.1<\/p><p>UCL = X̄ + 3(σ/√n) = 2 + 3(0.1/√2.5) = <b>2.06<\/b><\/p><p>LCL = X̄ − 3(σ/√n) = 2 − 3(0.1/√2.5) = <b>1.94<\/b><\/p><pre>UCL ├──────────────────────  2.06\nCL  ├──────────────────────  2\nLCL ├──────────────────────  1.94\n    └──────────────────────<\/pre><blockquote>Note (as written): n is recorded as 2.5 rather than 25, and √2.5 is used in the working — the arithmetic in the notes follows from that.<\/blockquote><h4>Page 2<\/h4><p>Project B has an initial investment of ₦400,000 and a projected cash flow of ₦110,000 for 5 years. What is the PBP and can both projects be accepted?<\/p><p>Project A = ₦700,000 / ₦225,000 = <b>3.18 years<\/b><\/p><p>Project B = ₦400,000 / ₦110,000 = <b>3.6 years<\/b><\/p><h3 id=\"bus-block-6-16\">Accounting Rate of Return<\/h3><p><b>ARR = Annual Cash Flow / Savings ÷ Initial Investment / Cost<\/b><\/p><p><b>Example 1<\/b><\/p><p>A project needs ₦40,000 and it will generate equal cash flows of ₦10,000 for 10 years. What is the ARR?<\/p><p>ARR = 10,000 / 40,000 = 0.25 × 100% = <b>25%<\/b><\/p><h4>Page 3<\/h4><p><b>Example 2<\/b><\/p><p>Project A has ₦20,000 as initial investment, and an annual cash flow of ₦10,000, while Project B has ₦30,000 as initial investment and an annual cash flow of ₦10,000. What is the ARR of each project, and which project will you recommend and why?<\/p><p>Project A: ARR = 10,000 / 20,000 = 0.5 × 100 = <b>50%<\/b><\/p><p>Project B: ARR = 10,000 / 30,000 = 0.33 × 100 = <b>33%<\/b><\/p><p>Project A should be recommended because it has a higher ARR, which makes it more feasible.<\/p><h4>Page 4<\/h4><h3 id=\"bus-block-6-17\">Net Present Value<\/h3><p><b>Decision rule<\/b><\/p><ul><li>NPV &gt; 0 → Accept project<\/li><li>NPV &lt; 0 → Reject project<\/li><li>NPV = 0 → Accept/Reject depending on other factors<\/li><\/ul><p><b>Example 1<\/b><\/p><p>The sum of ₦40,000 is invested in an IT project. Given a cost of capital at 8% and series of projected cash inflows, what is NPV?<\/p><table><tr><th>(40,000)<\/th><th>Cash inflow<\/th><th>Discounted Cash Flow<\/th><th>PV<\/th><\/tr><tr><td>Yr 1<\/td><td>70,000<\/td><td>0.926<\/td><td>64,820<\/td><\/tr><tr><td>Yr 2<\/td><td>120,000<\/td><td>0.857<\/td><td>102,840<\/td><\/tr><tr><td>Yr 3<\/td><td>140,000<\/td><td>0.794<\/td><td>111,160<\/td><\/tr><tr><td>Yr 4<\/td><td>140,000<\/td><td>0.735<\/td><td>102,900<\/td><\/tr><tr><td>Yr 5<\/td><td>40,000<\/td><td>0.681<\/td><td>27,240<\/td><\/tr><\/table><p>408,960 − 40,000 = <b>₦368,960<\/b><\/p><p>FV = PV(1 + r)ⁿ PV = FV / (1 + r)ⁿ = FV(1 + r)⁻ⁿ<\/p><h4>Page 5<\/h4><h3 id=\"bus-block-6-18\">Project Appraisal<\/h3><p>It is the process of analysing technical feasibility, economic viability and potential impact of a project.<\/p><p><b>Methods of Appraisal (or areas?)<\/b><\/p><ol><li>Market Appraisal<\/li><li>Technical Appraisal<\/li><li>Industrial Appraisal<\/li><li>Managerial Appraisal<\/li><li>Economic Appraisal<\/li><li>Environmental Appraisal<\/li><\/ol><h3 id=\"bus-block-6-19\">Project Control<\/h3><p>Project Control is a process of comparing actual performance against plan to identify deviations, evaluate alternative course of actions and take appropriate corrective actions.<\/p><p><b>Steps:<\/b><\/p><ol><li>Set up baseline plan<\/li><li>Measure performance and progress<\/li><li>Compare results against actual plans<\/li><li>Take action<\/li><\/ol>", "toc": [{"id": "bus-block-6-16", "t": "Accounting Rate of Return", "lv": 3}, {"id": "bus-block-6-17", "t": "Net Present Value", "lv": 3}, {"id": "bus-block-6-18", "t": "Project Appraisal", "lv": 3}, {"id": "bus-block-6-19", "t": "Project Control", "lv": 3}]}]}};

    } else if(c === "!"){
      a = { m:'<mspace width="-0.17em"/>', p:"", i:i + 1 };
    } else if(c === "%" || c === "$" || c === "#" || c === "&" || c === "{" || c === "}"){
      a = { m:"<mtext>" + texEsc(c) + "</mtext>", p:c, i:i + 1 };
    } else if(TEX_OP[c]){
      a = { m:"<mo>" + texEsc(TEX_OP[c]) + "</mo>", p:TEX_OP[c], i:i + 1 };
    } else if(TEX_ID[c]){
      a = { m:"<mi>" + TEX_ID[c] + "</mi>", p:TEX_ID[c], i:i + 1 };
    } else {
      a = { m:'<mi mathvariant="normal">' + texEsc(c) + "</mi>", p:c, i:i + 1 };
    }
  }
  else return null;

  /* scripts: x^2, D_3, x_i^2 */
  var sup = null, sub = null;
  while(ts[a.i] && (ts[a.i].k === "^" || ts[a.i].k === "_")){
    var kind = ts[a.i].k, s = texAtom(ts, a.i + 1);
    if(!s) break;
    if(kind === "^") sup = s; else sub = s;
    a.i = s.i;
  }
  if(sup && sub){
    a.m = "<msubsup>" + a.m + sub.m + sup.m + "</msubsup>";
    a.p = a.p + plainScript(sub.p, SUB, "_") + plainScript(sup.p, SUP, "^");
  } else if(sup){
    a.m = "<msup>" + a.m + sup.m + "</msup>";
    a.p = a.p + plainScript(sup.p, SUP, "^");
  } else if(sub){
    a.m = "<msub>" + a.m + sub.m + "</msub>";
    a.p = a.p + plainScript(sub.p, SUB, "_");
  }
  return a;
}

function plainScript(txt, map, mark){
  var out = "";
  txt = txt.replace(/\s+/g, "");
  for(var i = 0; i < txt.length; i++){
    if(!map[txt.charAt(i)]) return mark + wrap(txt);
    out += map[txt.charAt(i)];
  }
  return out;
}

function texSeq(ts, i, untilBrace){
  var m = [], parts = [], frac = [];
  while(i < ts.length){
    if(ts[i].k === "}"){ i++; if(untilBrace) break; continue; }
    var a = texAtom(ts, i);
    if(!a){ i++; continue; }
    m.push(a.m); parts.push(a.p); frac.push(!!a.frac); i = a.i;
  }
  /* a/b needs brackets in plain text where the fraction touches its neighbours */
  parts.forEach(function(x, j){
    if(!frac[j]) return;
    if(/[A-Za-z0-9)]$/.test(parts[j - 1] || "") || /^[A-Za-z0-9(]/.test(parts[j + 1] || ""))
      parts[j] = "(" + x + ")";
  });
  var rel = /[=+<>\u2248\u2264\u2265\u2260\u2192\u00b1\u00d7\u00f7\u2212-]/;
  var p = "";
  parts.forEach(function(x){
    if(p && !/\s$/.test(p) && (rel.test(x.charAt(0)) || rel.test(p.slice(-1)))) p += " ";
    p += x;
  });
  return { m:m, p:p, i:i };
}

function texParse(src){
  var r = texSeq(texScan(src), 0, false);
  return { m:mrow(r.m), p:r.p.replace(/[ ]{4,}/g, "   ").trim() };
}

/* MathML is native everywhere current, but check rather than assume. */
var MATH_OK = null;
function mathSupported(){
  if(MATH_OK !== null) return MATH_OK;
  try{
    var d = document.createElement("div");
    d.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden";
    d.innerHTML = '<math><mspace height="23px" width="77px"></mspace></math>';
    document.body.appendChild(d);
    var box = d.firstChild.firstChild.getBoundingClientRect();
    document.body.removeChild(d);
    MATH_OK = Math.abs(box.height - 23) < 2 && Math.abs(box.width - 77) < 2;
  }catch(e){ MATH_OK = false; }
  return MATH_OK;
}

/* one expression */
function mtex(tex, display){
  var r = texParse(tex);
  if(mathSupported())
    return '<math' + (display ? ' display="block"' : "") + ">" + r.m + "</math>";
  return '<span class="eqtxt">' + texEsc(r.p) + "</span>";
}

/* prose with $…$ islands in it */
function mtxt(s){
  s = String(s);
  var parts = s.split("$");
  if(parts.length % 2 === 0) return texEsc(s);       /* unbalanced: leave it alone */
  return parts.map(function(part, i){
    return i % 2 ? mtex(part, false) : texEsc(part);
  }).join("");
}

    + '<div class="stat"><div class="v no">'+wrong+'</div><div class="l">Wrong</div></div>'
    + '<div class="stat"><div class="v">'+skipped+'</div><div class="l">Unanswered</div></div>'
    + '<div class="stat"><div class="v">'+vis.length+'</div><div class="l">In this run</div></div></div>'
    + (rows ? '<span class="eyebrow">By topic &middot; weakest first</span><div class="bytopic">'+rows+'</div>' : '')
    + '</section>'
    + (review ? '<span class="eyebrow" style="display:block;margin:30px 0 0">What you missed</span>'
        + '<div class="review">'+review+'</div>' : '')
    + '</div></div>'
    + '<div class="qfoot"><div class="qfoot-in">'
    + '<button class="btn pri" id="r-back">Back to questions</button>'
    + '<button class="btn" id="r-retry">Retry shuffled</button>'
    + '<button class="btn" data-home>Banks</button></div></div></div>';

  document.getElementById("r-back").onclick = function(){ go("#"+state.bank); };
  document.getElementById("r-retry").onclick = function(){
    state.picks={}; drop(state.bank); persist();
    shuffle(state.order); state.i=0; state.topic="*"; go("#"+state.bank); window.scrollTo(0,0); };
  window.scrollTo(0,0);
}

/* ── materials ─────────────────────────────────────────────────────
   Every question names the class, deck or lecturer block its answer was
   worked from. Those names are the keys of REF, so the label on the card
   is also the way into the document itself. */
function refsOf(q){
  return String(q && q.s || "").split("·").map(function(s){ return s.trim(); })
    .filter(function(s){ return s; });
}
/* wikipedia.org out of https://en.wikipedia.org/wiki/… , to say where a link goes */
function siteOf(url){
  var host = String(url).split("/")[2].replace(/^www\./, "").split(".");
  return host.length > 2 ? host.slice(1).join(".") : host.join(".");
}
function srcHTML(q){
  return refsOf(q).map(function(label){
    if(REF[label]) return '<button class="ref" data-doc="'+REF[label]+'">'+esc(label)+'</button>';
    if(LINKS[label]) return '<a class="ref" href="'+esc(LINKS[label])
      + '" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>';
    return esc(label);
  }).join(" &middot; ");
}
/* The citation offered under a revealed answer: the document it was worked
   from, or a page on the web where the materials do not cover the point. The
   paper a question came from ("Examination") is neither, and stays as text. */
function whenceHTML(q){
  var any = false;
  var cites = refsOf(q).map(function(label){
    var id = REF[label], url = LINKS[label];
    if(id){
      any = true;
      return '<button class="cite" data-doc="'+id+'">'
        + '<span class="tag">'+esc(label)+'</span>'
        + '<span class="nm">'+esc(DOCS[id].title)+'</span></button>';
    }
    if(url){
      any = true;
      return '<a class="cite ext" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'
        + '<span class="tag">'+esc(siteOf(url))+'</span>'
        + '<span class="nm">'+esc(label)+'</span></a>';
    }
    return '<span class="plain">'+esc(label)+'</span>';
  }).join("");
  return any ? '<div class="whence"><span class="eyebrow">Source</span>'+cites+'</div>' : "";
}

function docOrder(){
  var out = [];
  SHELVES.forEach(function(s){ s.groups.forEach(function(g){ out = out.concat(g.ids); }); });
  return out;
}
function partHTML(p){
  var body = p.html.replace(/<table>/g, '<div class="tw"><table>')
                   .replace(/<\/table>/g, "</table></div>");
  var head = "";
  if(p.label || p.note){
    head = '<div class="phead">'
      + (p.label ? "<h2>"+esc(p.label)+"</h2>" : "")
      + (p.note ? "<p>"+esc(p.note)+"</p>" : "")
      + '<span class="file">'+esc(p.src)+"</span></div>";
  }
  return '<section class="part">'+head+'<div class="prose">'+body+"</div></section>";
}
function tocHTML(d){
  var items = [];
  d.parts.forEach(function(p){
    var top = p.toc.filter(function(t){ return t.lv === 2; });
    items = items.concat(top.length ? top : p.toc);
  });
  if(items.length < 4 || items.length > 60) return "";
  return '<nav class="toc"><span class="eyebrow">Contents</span><ul>'
    + items.map(function(t){
        return '<li><button data-scroll="'+t.id+'">'+esc(t.t)+"</button></li>"; }).join("")
    + "</ul></nav>";
}
function docHTML(d){
  return tocHTML(d) + d.parts.map(partHTML).join("");
}

function renderDoc(id){
  closePanel();
  var d = DOCS[id], order = docOrder(), at = order.indexOf(id);
  state.view = "doc";
  document.body.setAttribute("data-view", "notes");
  document.documentElement.setAttribute("data-course", d.course);

  var step = function(n, txt){
    var o = order[n];
    return o ? '<button class="btn" data-go="notes/'+o+'">'+txt+"</button>" : "";
  };
  app.innerHTML = '<div class="wrap"><article class="doc">'
    + '<div class="dhead"><span class="eyebrow">'
    + '<button class="ref" data-go="notes">Materials</button> &nbsp;/&nbsp; '
    + esc(d.ref)+'</span><h1>'+esc(d.title)+"</h1>"
    + '<div class="dmeta"><span>'+esc(d.kicker)+"</span>"
    + "<span><b>"+d.words.toLocaleString()+"</b> words</span>"
    + (d.parts.length > 1 ? "<span><b>"+d.parts.length+"</b> sources</span>" : "")
    + "</div></div>"
    + docHTML(d)
    + '<div class="dfoot">'+step(at-1, "&larr; Previous")+'<span class="sp"></span>'
    + step(at+1, "Next &rarr;")+"</div>"
    + "</article></div>";
  window.scrollTo(0, 0);
}

function renderNotes(){
  closePanel();
  state.view = "notes";
  document.body.setAttribute("data-view", "notes");
  document.documentElement.removeAttribute("data-course");
  var n = Object.keys(DOCS).length, words = 0;
  for(var k in DOCS) words += DOCS[k].words;

  var shelves = SHELVES.map(function(s){
    var count = 0;
    var groups = s.groups.map(function(g){
      count += g.ids.length;
      var rows = g.ids.map(function(id){
        var d = DOCS[id];
        return '<button class="docrow" data-go="notes/'+id+'">'
          + '<span class="ref">'+esc(d.ref)+"</span>"
          + '<span class="nm">'+esc(d.title)+"<em>"+esc(d.kicker)+"</em></span>"
          + '<span class="w">'+d.words.toLocaleString()+" w</span></button>";
      }).join("");
      return '<div class="group">'+esc(g.label)+'</div><div class="docs">'+rows+"</div>";
    }).join("");
    return '<section class="shelf" data-course="'+s.course+'">'
      + '<div class="sh"><span class="code">'+esc(s.code)+"</span><h2>"+esc(s.name)+"</h2>"
      + '<span class="n">'+count+" documents</span></div>"
      + '<p class="blurb">'+esc(s.note)+"</p>"
      + (s.course === "BUS" ? OUTLINE : "") + groups + "</section>";
  }).join("");

  app.innerHTML = '<div class="wrap"><section class="hero">'
    + '<span class="eyebrow">2025/26 course materials</span>'
    + "<h1>The notes the answers were worked from.</h1>"
    + "<p>Every class, deck and lecturer block behind the four question banks, "
    + "set as text you can read here. Nothing is summarised: this is what the "
    + "lecturers handed out, with the duplicates dropped and the handwritten "
    + "notes transcribed.</p>"
    + '<div class="tally"><span><b>'+n+"</b> documents</span>"
    + "<span><b>"+words.toLocaleString()+"</b> words</span>"
    + "<span><b>2</b> courses</span></div></section>"
    + '<div style="height:38px"></div>'+shelves+"</div>";

  document.getElementById("foot-note").textContent =
    "Transcribed and set as text from the 2025/26 CIL 524 and BUS 440 course folders. "
    + "Wording follows the source; layout does not. Where a lecturer's notes were "
    + "handwritten, what you are reading is a transcript of the photographs. "
    + "Check anything that matters against the original.";
  window.scrollTo(0, 0);
}

/* Reading a document without leaving the question you are on. */
function openReader(id){
  var d = DOCS[id];
  if(!d) return;
  closePanel(true);
  state.panel = true;
  var scrim = document.createElement("div"); scrim.className = "scrim"; scrim.id = "scrim";
  var panel = document.createElement("div"); panel.className = "panel reader"; panel.id = "panel";
  panel.innerHTML = '<div class="panel-in">'
    + '<div class="rh"><span class="ref">'+esc(d.ref)+'</span>'
    + '<span class="nm">'+esc(d.title)+"</span>"
    + '<span class="acts"><a href="#notes/'+id+'">Full page &rarr;</a>'
    + '<button class="x" id="p-close">Close &times;</button></span></div>'
    + docHTML(d)+"</div>";
  document.body.appendChild(scrim); document.body.appendChild(panel);
  scrim.onclick = function(){ closePanel(); };
  document.getElementById("p-close").onclick = function(){ closePanel(); };
}

/* ── theme ─────────────────────────────────────────────────────── */
var THEMES = ["system","light","dark"];
function applyTheme(t){
  if(t==="system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  var btn = document.getElementById("theme-btn");
  if(btn) btn.textContent = t==="system" ? "Theme · auto" : "Theme · "+t;
  save("theme", t);
}
document.getElementById("theme-btn").onclick = function(){
  var cur = load("theme") || "system";
  applyTheme(THEMES[(THEMES.indexOf(cur)+1)%THEMES.length]);
};

/* ── wiring ────────────────────────────────────────────────────── */
document.getElementById("home-btn").onclick = function(){ go("#"); };
document.getElementById("notes-btn").onclick = function(){ go("#notes"); window.scrollTo(0,0); };
app.addEventListener("click", function(e){
  var d = e.target.closest("[data-doc]");
  /* From a question the material opens over the page, so the place you had
     reached in the bank is still there behind it. */
  if(d){ if(state.view === "quiz") openReader(d.dataset.doc);
         else go("#notes/"+d.dataset.doc); return; }
  var g = e.target.closest("[data-go]");
  if(g){ go("#"+g.dataset.go); window.scrollTo(0,0); return; }
  if(e.target.closest("[data-home]")){ go("#"); window.scrollTo(0,0); }
});
document.addEventListener("click", function(e){
  var s = e.target.closest("[data-scroll]");
  if(!s) return;
  var el = document.getElementById(s.dataset.scroll);
  if(el && el.scrollIntoView) el.scrollIntoView({block:"start", behavior:"smooth"});
});
document.addEventListener("keydown", function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  var tag = document.activeElement ? document.activeElement.tagName : "";
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(tag)) return;
  var k = e.key.toLowerCase();
  if(k==="escape"){
    if(state.panel) closePanel();
    else if(state.view === "doc") go("#notes");
    else go("#");
    return;
  }
  if(state.view !== "quiz") return;
  if(state.panel) return;
  var vis = visible(), q = vis.length ? BANKS[state.bank].q[vis[state.i]] : null;
  var li = LET.map(function(l){return l.toLowerCase();}).indexOf(k);
  if(li===-1 && k>="1" && k<="6") li = +k-1;
  if(li>-1 && q && li<q.o.length){ e.preventDefault(); choose(li); return; }
  if(k==="arrowright"||k==="enter"){ e.preventDefault(); advance(); }
  else if(k==="arrowleft"){ e.preventDefault(); prev(); }
  else if(k==="j"){ e.preventDefault(); openPanel(); }
});

applyTheme(load("theme") || "system");
route();
})();
</script>
