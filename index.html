<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shade The Appropriate Answer</title>
<meta name="description" content="418 worked multiple-choice questions for CIL 524 Law of Engineering Contracts and BUS 440 Management for Engineers: both past papers plus fresh questions from the 2025/26 course materials.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDEFEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101315" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%232F3E7E' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%232F3E7E'/%3E%3C/svg%3E">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Finlandica:ital,wght@0,400;0,500;0,600;1,400&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<style>
/* ─── tokens ─────────────────────────────────────────────────────── */
:root{
  --ground:#EDEFEA; --paper:#FBFCF9; --sunk:#E3E6DF; --veil:rgba(19,23,26,.34);
  --ink:#14181A; --ink2:#4C5754; --ink3:#79837F;
  --rule:#D1D7CF; --rule2:#E2E6DE;
  --cil:#2C3E76; --cil-bg:#2C3E7614; --cil-edge:#2C3E763D;
  --bus:#8B5310; --bus-bg:#8B531014; --bus-edge:#8B53103D;
  --ok:#2B6A4A; --ok-bg:#2B6A4A14; --ok-edge:#2B6A4A4D;
  --no:#A53026; --no-bg:#A5302614; --no-edge:#A530264D;
  --flag:#7C5A10; --flag-bg:#7C5A1014;
  --shadow:0 1px 2px rgba(19,23,26,.05), 0 12px 30px -18px rgba(19,23,26,.28);
  --lift:0 -1px 0 var(--rule), 0 -10px 26px -20px rgba(19,23,26,.4);
  --accent:var(--cil); --accent-bg:var(--cil-bg); --accent-edge:var(--cil-edge);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0F1214; --paper:#181C1E; --sunk:#0B0E10; --veil:rgba(0,0,0,.6);
  --ink:#E9ECE7; --ink2:#A7B1AC; --ink3:#7B8580;
  --rule:#2B3235; --rule2:#212728;
  --cil:#9DACEE; --cil-bg:#9DACEE1F; --cil-edge:#9DACEE47;
  --bus:#E3A85C; --bus-bg:#E3A85C1F; --bus-edge:#E3A85C47;
  --ok:#6BC593; --ok-bg:#6BC5931F; --ok-edge:#6BC59347;
  --no:#E88478; --no-bg:#E884781F; --no-edge:#E8847847;
  --flag:#DAB560; --flag-bg:#DAB5601F;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -18px rgba(0,0,0,.75);
  --lift:0 -1px 0 var(--rule), 0 -10px 26px -20px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --ground:#0F1214; --paper:#181C1E; --sunk:#0B0E10; --veil:rgba(0,0,0,.6);
  --ink:#E9ECE7; --ink2:#A7B1AC; --ink3:#7B8580;
  --rule:#2B3235; --rule2:#212728;
  --cil:#9DACEE; --cil-bg:#9DACEE1F; --cil-edge:#9DACEE47;
  --bus:#E3A85C; --bus-bg:#E3A85C1F; --bus-edge:#E3A85C47;
  --ok:#6BC593; --ok-bg:#6BC5931F; --ok-edge:#6BC59347;
  --no:#E88478; --no-bg:#E884781F; --no-edge:#E8847847;
  --flag:#DAB560; --flag-bg:#DAB5601F;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -18px rgba(0,0,0,.75);
  --lift:0 -1px 0 var(--rule), 0 -10px 26px -20px rgba(0,0,0,.8);
}
[data-course="CIL"]{ --accent:var(--cil); --accent-bg:var(--cil-bg); --accent-edge:var(--cil-edge); }
[data-course="BUS"]{ --accent:var(--bus); --accent-bg:var(--bus-bg); --accent-edge:var(--bus-edge); }

/* ─── base ───────────────────────────────────────────────────────── */
*{box-sizing:border-box;}
html{scrollbar-gutter:stable;}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Finlandica",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:17.5px; line-height:1.58; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3{margin:0; text-wrap:balance; font-family:"Familjen Grotesk",Helvetica,Arial,sans-serif; font-weight:600;}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
select{font:inherit; color:inherit;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px;}
.mono{font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace;}
.eyebrow{
  font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:10.5px;
  font-weight:500; letter-spacing:.15em; text-transform:uppercase; color:var(--ink3);
}
.wrap{max-width:1120px; margin:0 auto; padding:0 26px;}
.hide{display:none !important;}

/* ─── masthead (home only) ───────────────────────────────────────── */
header.top{border-bottom:1px solid var(--rule); background:var(--paper);}
body[data-view="quiz"] header.top, body[data-view="quiz"] footer{display:none;}
.top-in{display:flex; align-items:center; gap:14px; height:62px;}
.mark{
  font-family:"Familjen Grotesk",Helvetica,Arial,sans-serif; font-weight:700;
  font-size:17px; letter-spacing:-.01em; display:flex; align-items:center; gap:10px; padding:0;
}
.mark .dot{
  width:15px; height:15px; border-radius:50%; border:2.5px solid var(--ink); flex:none;
  background:radial-gradient(circle at 50% 50%, var(--ink) 0 40%, transparent 41%);
}
.top-spacer{flex:1;}
.chip{
  font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:11px;
  letter-spacing:.07em; text-transform:uppercase; padding:6px 11px;
  border:1px solid var(--rule); border-radius:3px; color:var(--ink2); background:var(--paper);
  transition:border-color .15s,color .15s;
}
.chip:hover{border-color:var(--ink3); color:var(--ink);}

/* ─── home ───────────────────────────────────────────────────────── */
.hero{padding:62px 0 40px; border-bottom:1px solid var(--rule);}
.hero h1{
  font-size:clamp(34px,5.4vw,56px); line-height:1.06; letter-spacing:-.025em;
  margin:14px 0 0; max-width:17ch; font-weight:700;
}
.hero p{max-width:58ch; color:var(--ink2); margin:20px 0 0;}
.tally{display:flex; gap:26px; flex-wrap:wrap; margin-top:26px;
  font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:12px;
  color:var(--ink3); letter-spacing:.03em;}
.tally b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums;}

.deck{display:grid; grid-template-columns:repeat(2,1fr); gap:1px;
  background:var(--rule); border:1px solid var(--rule); margin:42px 0 68px;}
@media (max-width:720px){ .deck{grid-template-columns:1fr;} }
.card{background:var(--paper); padding:28px 26px 24px; text-align:left; display:block;
  width:100%; transition:background .16s;}
.card:hover{background:var(--sunk);}
.card .row1{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.card .code{font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:11px;
  font-weight:600; letter-spacing:.1em; color:var(--accent); text-transform:uppercase;}
.card .kind{font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:9.5px;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink3); margin-left:auto;
  border:1px solid var(--rule); padding:3px 7px; border-radius:3px;}
.card h2{font-size:25px; line-height:1.15; letter-spacing:-.02em;}
.card .sub{color:var(--ink2); font-size:15.5px; margin-top:8px; line-height:1.5;}
.card .foot{margin-top:20px; padding-top:15px; border-top:1px solid var(--rule2);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:11.5px;
  color:var(--ink3); letter-spacing:.04em;}
.card .foot .n{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums;}
.card .go{margin-left:auto; color:var(--accent); font-weight:500;}
.card .bar{height:3px; background:var(--rule2); margin-top:13px;}
.card .bar i{display:block; height:100%; background:var(--accent);}

.legend{margin:0 0 66px; padding:26px 28px; border:1px solid var(--rule);
  background:var(--paper); display:grid;
  grid-template-columns:repeat(auto-fit,minmax(228px,1fr)); gap:22px 34px;}
.legend h3{font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:10.5px;
  letter-spacing:.15em; text-transform:uppercase; color:var(--ink3); font-weight:500; margin-bottom:8px;}
.legend p{margin:0; font-size:15px; color:var(--ink2); line-height:1.55;}
.legend p b{color:var(--ink); font-weight:600;}

footer{border-top:1px solid var(--rule); padding:24px 0 38px; color:var(--ink3); font-size:13.5px;}
footer p{margin:0; max-width:74ch; line-height:1.6;}

/* ─── quiz page ──────────────────────────────────────────────────── */
.qpage{min-height:100vh; display:flex; flex-direction:column; background:var(--ground);}
.qbar{
  position:sticky; top:0; z-index:30; background:var(--paper);
  border-bottom:1px solid var(--rule);
}
.qbar-in{display:flex; align-items:center; gap:14px; height:56px; max-width:840px;
  margin:0 auto; padding:0 22px;}
.qbar .exit{font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:11px;
  letter-spacing:.07em; text-transform:uppercase; color:var(--ink3); flex:none;}
.qbar .exit:hover{color:var(--ink);}
.qbar .name{font-family:"Familjen Grotesk",Helvetica,Arial,sans-serif; font-weight:600;
  font-size:14.5px; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; min-width:0;}
.qbar .tally2{margin-left:auto; flex:none; display:flex; align-items:center; gap:12px;
  font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:12px;
  font-variant-numeric:tabular-nums; color:var(--ink2);}
.qbar .tally2 .r{color:var(--ok);} .qbar .tally2 .x{color:var(--no);}
.qbar .tally2 em{font-style:normal; font-size:10px; letter-spacing:.09em;
  text-transform:uppercase; opacity:.72;}
.qprog{height:2px; background:var(--rule2);}
.qprog i{display:block; height:100%; background:var(--accent); transition:width .25s;}

.qbody{flex:1; padding:30px 22px 26px;}
.col{max-width:760px; margin:0 auto;}

.qcard{background:var(--paper); border:1px solid var(--rule); box-shadow:var(--shadow); border-radius:3px;}
.qhead{display:flex; align-items:baseline; gap:14px; padding:20px 28px 0;}
.qnum{font-family:"Familjen Grotesk",Helvetica,Arial,sans-serif; font-size:26px; font-weight:700;
  color:var(--accent); line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.03em;}
.qtopic{font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:10px;
  letter-spacing:.11em; text-transform:uppercase; color:var(--accent);
  background:var(--accent-bg); border:1px solid var(--accent-edge); padding:3px 8px; border-radius:3px;}
.qsrc{font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:10px;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink3); margin-left:auto;
  text-align:right; max-width:44%;}
.qsrc .ref{color:var(--ink2); border-bottom:1px solid var(--rule); padding:0 0 1px;
  font:inherit; letter-spacing:inherit; text-transform:inherit; text-decoration:none;}
.qsrc .ref:hover{color:var(--accent); border-color:var(--accent-edge);}
.stem{padding:13px 28px 20px; font-size:19px; line-height:1.5; text-wrap:pretty;}

.opts{display:flex; flex-direction:column; border-top:1px solid var(--rule2);}
.opt{display:flex; gap:14px; align-items:flex-start; text-align:left; width:100%;
  padding:14px 28px; border-bottom:1px solid var(--rule2); line-height:1.48;
  font-size:16.5px; transition:background .12s;}
.opt:last-child{border-bottom:none;}
.opt:not([disabled]):hover{background:var(--sunk);}
.bub{flex:none; width:25px; height:25px; border-radius:50%; border:1.5px solid var(--rule);
  display:grid; place-items:center; font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace;
  font-size:10.5px; font-weight:600; color:var(--ink3); margin-top:1px; transition:.14s;}
.opt:not([disabled]):hover .bub{border-color:var(--ink3); color:var(--ink2);}
.opt[data-st="pick"]{background:var(--sunk);}
.opt[data-st="pick"] .bub{background:var(--ink); border-color:var(--ink); color:var(--paper);}
.opt[data-st="ok"]{background:var(--ok-bg);}
.opt[data-st="ok"] .bub{background:var(--ok); border-color:var(--ok); color:var(--paper);}
.opt[data-st="no"]{background:var(--no-bg);}
.opt[data-st="no"] .bub{background:var(--no); border-color:var(--no); color:var(--paper);}
.opt[data-st="ok"] .txt,.opt[data-st="no"] .txt{font-weight:600;}
.opt .tag{margin-left:auto; align-self:center; flex:none;
  font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:9px;
  letter-spacing:.12em; text-transform:uppercase;}
.opt[data-st="ok"] .tag{color:var(--ok);} .opt[data-st="no"] .tag{color:var(--no);}

.why{border-top:1px solid var(--rule); padding:19px 28px 21px; background:var(--sunk);}
.why p{margin:8px 0 0; color:var(--ink2); font-size:16px; line-height:1.6;}
.why .calc{margin-top:13px; padding:11px 14px; background:var(--paper); border:1px solid var(--rule);
  border-radius:3px; color:var(--ink); overflow-x:auto;}

/* set maths in a maths face: real fraction bars, radicals and scripts */
math{font-family:"STIX Two Math","Cambria Math","Latin Modern Math","TeX Gyre Termes Math",
  Georgia,"Times New Roman",serif; font-size:1.04em; line-height:1;}
math[display="block"]{margin:0; font-size:1.15em;}
.opt math, .stem math{font-size:1em;}
.eqtxt{font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:.94em;
  white-space:nowrap;}
.why .flag{margin-top:13px; padding:12px 14px; background:var(--flag-bg);
  border-left:2.5px solid var(--flag); font-size:15px; color:var(--ink2); line-height:1.55;}
.why .flag b{color:var(--flag); font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace;
  font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; display:block; margin-bottom:5px;}

/* the material each answer rests on, offered to read once the answer is out */
.whence{margin-top:15px; padding-top:13px; border-top:1px solid var(--rule);
  display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
.whence .eyebrow{flex:none;}
.cite{display:inline-flex; align-items:baseline; gap:8px; max-width:100%;
  padding:7px 12px; border:1px solid var(--accent-edge); background:var(--accent-bg);
  border-radius:3px; color:var(--accent); text-align:left; transition:.14s;}
.cite:hover{background:var(--accent); color:var(--paper); border-color:var(--accent);}
.cite .tag{font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; font-weight:600; flex:none;}
.cite .nm{font-size:14.5px; line-height:1.3; color:var(--ink2); min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cite:hover .nm{color:var(--paper);}
.whence .plain{font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:11px;
  letter-spacing:.06em; color:var(--ink3);}
.cite.ext{border-color:var(--rule); background:var(--paper); text-decoration:none;}
.cite.ext .tag{color:var(--ink3); text-transform:none; letter-spacing:.04em;}
.cite.ext .nm{color:var(--ink);}
.cite.ext::after{content:"\2197"; flex:none; align-self:center; color:var(--ink3); font-size:12px;}
.cite.ext:hover{background:var(--sunk); border-color:var(--ink3);}
.cite.ext:hover .nm,.cite.ext:hover .tag,.cite.ext:hover::after{color:var(--ink);}

/* sticky action bar: Next never moves */
.qfoot{position:sticky; bottom:0; z-index:30; background:var(--paper); box-shadow:var(--lift);}
.qfoot-in{display:flex; align-items:center; gap:10px; max-width:760px; margin:0 auto;
  padding:12px 22px; padding-bottom:calc(12px + env(safe-area-inset-bottom));}
.btn{font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:11.5px;
  letter-spacing:.08em; text-transform:uppercase; padding:11px 17px; border:1px solid var(--rule);
  background:var(--paper); color:var(--ink2); border-radius:3px; transition:.14s; flex:none;}
.btn:hover{border-color:var(--ink3); color:var(--ink);}
.btn.pri{background:var(--ink); color:var(--ground); border-color:var(--ink); min-width:118px;}
.btn.pri:hover{opacity:.86;}
.btn[disabled]{opacity:.38; cursor:not-allowed;}
.qfoot .pos{margin-left:auto; font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace;
  font-size:11.5px; color:var(--ink3); font-variant-numeric:tabular-nums; letter-spacing:.04em;}

/* ─── jump / settings panel ──────────────────────────────────────── */
.scrim{position:fixed; inset:0; background:var(--veil); z-index:40; opacity:0;
  animation:fade .16s forwards;}
@keyframes fade{to{opacity:1;}}
.panel{position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--paper);
  border-top:1px solid var(--rule); max-height:82vh; display:flex; flex-direction:column;
  box-shadow:var(--lift);}
.panel-in{max-width:760px; margin:0 auto; width:100%; padding:18px 22px 22px;
  padding-bottom:calc(22px + env(safe-area-inset-bottom)); overflow-y:auto;}
.panel .ph{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.panel .ph .x{margin-left:auto; font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace;
  font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink3);}
.panel .ph .x:hover{color:var(--ink);}
.pset{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.pset select,.pset button{font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace;
  font-size:11px; letter-spacing:.05em; padding:9px 12px; border:1px solid var(--rule);
  background:var(--paper); color:var(--ink2); border-radius:3px; cursor:pointer;}
.pset select{max-width:100%;}
.pset button:hover,.pset select:hover{border-color:var(--ink3); color:var(--ink);}
.pset button[aria-pressed="true"]{background:var(--ink); color:var(--ground); border-color:var(--ink);}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(34px,1fr)); gap:5px;}
.cell{aspect-ratio:1; display:grid; place-items:center; border:1px solid var(--rule);
  font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:10.5px;
  color:var(--ink3); font-variant-numeric:tabular-nums; border-radius:3px; transition:.12s;}
.cell:hover{border-color:var(--ink3); color:var(--ink);}
.cell[data-st="ok"]{background:var(--ok); border-color:var(--ok); color:var(--paper); font-weight:600;}
.cell[data-st="no"]{background:var(--no); border-color:var(--no); color:var(--paper); font-weight:600;}
.cell[data-st="done"]{background:var(--accent); border-color:var(--accent); color:var(--paper); font-weight:600;}
.cell[aria-current="true"]{outline:2px solid var(--ink); outline-offset:1px;}

/* ─── results ────────────────────────────────────────────────────── */
.result{background:var(--paper); border:1px solid var(--rule); border-radius:3px;
  padding:34px 30px; box-shadow:var(--shadow);}
.result .pct{font-family:"Familjen Grotesk",Helvetica,Arial,sans-serif;
  font-size:clamp(50px,11vw,80px); font-weight:700; line-height:1; color:var(--accent);
  font-variant-numeric:tabular-nums; letter-spacing:-.045em; margin-top:6px;}
.result h2{font-size:24px; margin-top:8px; letter-spacing:-.02em;}
.result .line{color:var(--ink2); margin:11px 0 0; max-width:54ch;}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:1px;
  background:var(--rule); border:1px solid var(--rule); margin:26px 0 24px;}
.stat{background:var(--paper); padding:15px 16px;}
.stat .v{font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:22px;
  font-weight:600; font-variant-numeric:tabular-nums;}
.stat .v.ok{color:var(--ok);} .stat .v.no{color:var(--no);}
.stat .l{font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:9.5px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--ink3); margin-top:5px;}
.bytopic{border:1px solid var(--rule); margin:10px 0 24px;}
.trow{display:flex; align-items:center; gap:13px; padding:10px 16px;
  border-bottom:1px solid var(--rule2); font-size:15px;}
.trow:last-child{border-bottom:none;}
.trow .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.trow .tb{width:80px; height:5px; background:var(--rule2); flex:none;}
.trow .tb i{display:block; height:100%; background:var(--accent);}
.trow .sc{font-family:"Spline Sans Mono",ui-monospace,Menlo,monospace; font-size:12px;
  color:var(--ink2); font-variant-numeric:tabular-nums; flex:none; width:44px; text-align:right;}

<script>
var BANKS = {};
/* CIL 524: Law of Contract. Second Semester 2021/2022 Examination, University of Lagos,
   Faculty of Engineering. 70 questions, transcribed verbatim from the paper.

   ANSWERS ARE DERIVED FROM THE 2025/26 COURSE MATERIALS ONLY: Classes 1–9 and the
   slide decks. The marked script that accompanied the paper was NOT used as a source;
   where it disagreed with the notes, the notes win and the difference is noted. */
BANKS["cil-pq"] = {
  id: "cil-pq", course: "CIL", kind: "pq",
  title: "CIL 524 Past Questions",
  subtitle: "Law of Contract · 2021/2022 Second Semester Examination",
  meta: "70 questions · answers worked from the 2025/26 lecture notes and slides",
  q: [
{t:"Formation",s:"Class 1",q:"Contracts under seal are generally referred to as",o:["Express Contracts","Signed Contracts","Deeds","Enforceable Contracts","Seal Contracts"],a:2,
 w:"Class 1: contracts that have been signed, sealed and delivered before witnesses are ‘referred to as Deeds’, hence ‘deed of assignment’. Their practical significance is that a deed needs no consideration to be enforceable."},
{t:"Formation",s:"Class 1",q:"For a simple contract to be valid",o:["It must be Sealed","It must be Signed","It must be in Writing","There must be consideration","All of the above"],a:3,
 w:"Class 1 defines simple contracts as those that ‘could be in writing, by words, or by action’ and are ‘not formal’, so they need not be sealed, signed or written. What they do require is consideration: ‘In a simple contract you need to show that you are giving something in exchange for that person’s promise.’ Read this against Q3, which makes the opposite point about deeds.",
 flag:"The marked script that came with this paper answered (e) All of the above. That contradicts the lecture, which is explicit that a simple contract may be oral or inferred from conduct. This bank follows the notes."},
{t:"Formation",s:"Class 1",q:"Which of the options is incorrect? For a contract under seal to be valid",o:["It must be Sealed","It must be Signed","It must be in Writing","There must be consideration"],a:3,
 w:"Class 1: ‘in a contract under seal / deed, you do not need to provide consideration… if somebody promises to give you their car and they sign and deliver a deed to that effect, you can enforce it whether you gave anything in exchange or not.’"},
{t:"Formation",s:"Class 1",q:"For goods displayed in a shop with the price indicated. An offer is made when the",o:["Seller opens his shop","Seller displays goods for sale on the shelf with the price indicated","Buyer walks into the shop","Buyer picks up the goods and takes them to the seller/cashier","Seller/Cashier tells the buyer how much the goods are sold for"],a:3,
 w:"Class 1 works through the ShopRite example: goods on the shelf are an invitation to treat; putting them in your basket is still not an offer because you can change your mind and put them back; ‘when you take them to the counter… you are the one making the offer’, and the cashier accepts on the company’s behalf by taking payment."},
{t:"Formation",s:"Class 1 · Slide 1.2",q:"For goods displayed in a shop without the price indicated. An offer is made when the",o:["Seller opens his shop","Seller displays goods for sale on the shelf with the price indicated","Buyer walks into the shop","Buyer picks up the goods and takes them to the seller/cashier","Seller/Cashier tells the buyer how much the goods are sold for"],a:4,
 w:"The governing test in Class 1 is that a proposal must be ‘clear, complete and definite’. With no price shown nothing is definite, so the transaction cannot become capable of acceptance until the price is stated. Contrast Q4, where the price is already on the shelf.",
 flag:"There is real tension here with Slide 1.2, which cites Harvey v Facey for the rule that ‘a mere supply of information, e.g. price, does not constitute an offer’. On that authority the seller stating a price is information, not an offer, and the buyer would still be the offeror. The paper’s own definiteness test points to (e); know both lines."},
{t:"Formation",s:"Slide 1.2",q:"The display of goods on the shelf in a shop or in a shop windows with the price indicated is",o:["An Invitation to treat","An Offer","A Consideration","A consensus ad idem","All of the above"],a:0,
 w:"Slide 1.2: ‘The display of goods on the shelf or in shop windows with the price indicated is a mere invitation to treat, and not an offer. The buyer makes an offer when he picks up the goods and takes it to the seller.’ Class 1 applies the same reasoning to a website."},
{t:"Formation",s:"Slide 1.2 · Class 2",q:"An offer may be terminated before acceptance in all the options except",o:["Revocation","Rejection","Failure of a condition","Dismissal of the agent","Death of the offeree"],a:3,
 w:"Slide 1.2 lists the modes of termination as revocation, rejection, lapse of time, failure of a condition, death of the offeree and death of the offeror. Class 2 adds counter-offer. Dismissing an agent appears nowhere on that list."},
{t:"Consideration",s:"Slide 1.2",q:"Mr A promises to give N500,000 to anyone who finds his missing laptop. Miss B who does not specifically promise Mr A that she will find the laptop, goes on to search for it and find it. The act constitutes not just an acceptance of Mr A’s offer, but also consideration. What type of consideration is this?",o:["Executed Consideration","Executory Consideration","Past Consideration","Adequate Consideration","Valuable Consideration"],a:0,
 w:"Slide 1.2: ‘Consideration is executed where a party promises to do something in return for the performance of an act, rather than for the mere promise of the future performance of an act.’ Executory consideration is the exchange of promises found in bilateral contracts."},
{t:"Formation",s:"Class 1 · Class 2",q:"Mr A promises to give N500,000 to anyone who finds his missing laptop. Miss B, not knowing about Mr A’s promise to give N500,000 to anyone who finds his missing laptop, finds the laptop. She now wants to claim the reward. The act constitutes what type of acceptance?",o:["Valid acceptance","Invalid acceptance","Adequate acceptance","Past Acceptance","Valuable Acceptance"],a:1,
 w:"Class 1 requires consensus ad idem: the parties must agree. Class 2 defines acceptance as the offeree assenting to the proposal. You cannot assent to an offer you have never heard of, so the finding is not an acceptance at all."},
{t:"Terms",s:"Class 3",q:"Implied terms in a contract may arise out of all except …",o:["statute","court","custom and usage","Duress"],a:3,
 w:"Class 3: ‘Implied terms are classified into three: terms implied by courts, terms implied by custom or usage, and terms implied by statute.’ Duress is a vitiating element (Class 8), not a source of terms."},
{t:"Terms",s:"Class 3 · Slide 1.3",q:"The courts have developed certain tests for determining whether a pre-contractual statement is a term or representation. They include all except",o:["importance of the statement","stage of the contract","oral agreements reduced to writing","party’s superior knowledge","Options (b) and (d) only"],a:4,
 w:"Class 3 and Slide 1.3 both give exactly four tests: stage of the contract, agreements reduced to writing, special knowledge and skill, and importance of the statement. The paper resolves the question through the composite option.",
 flag:"Unanswerable as printed. All four of (a)–(d) ARE tests on the notes, so nothing genuinely completes ‘include all except’, and (e) asserts that two of them are not tests. Learn the four tests; do not try to rationalise the options."},
{t:"Terms",s:"Class 3",q:"Terms which are deemed to form part of the contract even though they may not have been specifically stated or agreed by the parties are called",o:["extreme terms","conduct terms","implied terms","express terms","non-specific terms"],a:2,
 w:"Class 3: implied terms ‘are read into the contract by the courts, by custom, or by statute. They are deemed part of the contract even though the parties did not expressly state them.’ Express terms are those precisely agreed, written or oral."},
{t:"Capacity",s:"Class 4",q:"Categories of vulnerable parties with limited capacity to enter into contract include all except",o:["Infants","Persons of Unsound Mind","Illiterates","The Aged"],a:3,
 w:"Class 4 lists the protected classes as infants, insane persons, drunken persons, illiterate persons and corporations. Age alone is not a ground of incapacity."},
{t:"Formation",s:"Class 2 · Slide 1.2",q:"When can an offer be terminated?…",o:["before acceptance","after acceptance","before performance","after performance"],a:0,
 w:"Slide 1.2: ‘An offer may be terminated before acceptance…’ Class 2 gives the reason: acceptance makes the offer irrevocable, because at that moment the contract is formed and both parties are bound."},
{t:"Consideration",s:"Slide 1.2 · Class 2",q:"All except….are the rules governing consideration. Consideration must",o:["be adequate","have some value","move from the promisee","be executory or executed"],a:0,
 w:"Slide 1.2 states the rules as: consideration must have some value but need not be adequate; must move from the promisee; may be executory or executed but not past. Class 2 illustrates with Chappell & Co. v. Nestlé, where chocolate wrappers were sufficient consideration despite being worthless."},
{t:"Formation",s:"Class 2",q:"To determine whether the parties had intention to create legal relations in a domestic/social agreement, the court",o:["asks the parties their intentions","presumes the parties did not intend to contract","presumes the parties intended to contract","uses its discretion","all of the above"],a:1,
 w:"Class 2: ‘Where the agreement is social, domestic, or between family members, there is a presumption that there is no intention to create legal relations.’ Commercial agreements carry the opposite presumption. Either can be rebutted by evidence."},
{t:"Discharge",s:"Class 3 · Class 9",q:"A contract can be discharged by___________",o:["Prevention of performance by the other party","Breach of a warranty","Agreement","A&C","All of the above"],a:3,
 w:"Class 9 lists discharge by agreement, and discharge by breach where the breach is fundamental; preventing performance is such a breach. But Class 3 is explicit that breach of a warranty ‘would only allow that party to ask for damages’, not to terminate. So (a) and (c) only."},
{t:"Discharge",s:"Class 9",q:"A party who has substantially performed a contract can claim benefit for the value of work done.",o:["False, total performance or no performance","True in all cases","True except otherwise stated under the contract","False except otherwise stated under the contract"],a:2,
 w:"This is quantum meruit. Class 9: ‘payment for work already performed where a contract cannot be fully completed… a contractor has built 60% of a structure; the court orders payment for the 60% completed.’ It is subject to the contract’s own terms, since Bilante v. NDIC confirms parties are bound by what they agreed."},
{t:"Discharge",s:"Class 9",q:"Miss Peggy entered into a contract with Sapphires Events Center for the use of the center for her wedding ceremony. Two days before the ceremony, the event centre was ravaged by fire. The contract can be said to have been discharged by",o:["Destruction","Act of God","Frustration","Negligence"],a:2,
 w:"Class 9 gives this exact example under discharge by frustration: ‘Destruction of subject matter (e.g., the hall booked for a wedding reception burns down).’ Destruction is the event; frustration is the legal doctrine, which is what the question asks for."},
{t:"Remedies",s:"Class 9",q:"Miss Peggy entered into a contract with Sapphires Events Center for the use of the center for her wedding ceremony. Two days before the ceremony, the event centre was ravaged by fire. What remedy is available to Miss Peggy",o:["Damages for breach of contract","Specific performance","Recovery of any deposit already paid","Destruction of the reputation of the event center on social media"],a:2,
 w:"Frustration is not a breach, so damages for breach do not arise, and performance is impossible so specific performance is pointless. What remains is restitution. Class 9: ‘Requires restoration of benefits unjustly obtained… puts the party back in the position they were before the contract.’"},
{t:"Capacity",s:"Class 4",q:"Kash, a 15-year-old boy purchases a car from Gizade Motors. Kash’s contract is _____",o:["Valid","Void","Voidable","Unenforceable"],a:1,
 w:"Class 4, s.1 Infant’s Relief Act 1874: ‘Contracts for goods supplied or to be supplied which are not necessaries’ are absolutely void. A car is not a necessary; necessaries are ‘food, drink, clothing, and shelter’ and items suited to the infant’s station."},
{t:"Capacity",s:"Class 4",q:"Kash, a 15-year-old boy purchases materials to replace his torn school uniform from KS Fashions. Kash’s contract is _____",o:["Valid","Void","Voidable","Unenforceable"],a:0,
 w:"Clothing is expressly a necessary in Class 4, and ‘an infant is bound by’ contracts for necessaries. The lecture makes the point directly: a person under 18 can go to Yaba market and buy clothing."},
{t:"Capacity",s:"Class 4",q:"Where an infant carries on a trade and enters into a contract for the purpose of that trade, the contract is ____________",o:["Valid","Void","Voidable","Unenforceable"],a:1,
 w:"Class 4 binds an infant only by contracts for necessaries and beneficial contracts of service, ‘training or instruction for their future career’. Trading stock is neither, so it falls under s.1 of the Infant’s Relief Act as non-necessary goods and is void. Labinjoh v. Abake is the case cited on infant trading contracts."},
{t:"Capacity",s:"Class 4 · Class 5",q:"A company, being an artificial person, has capacity to enter into all kinds of contract",o:["True","False"],a:1,
 w:"Class 4: a registered company has legal personality independent of its members, but ‘the Ultra Vires Doctrine provides that companies must operate within their stated objectives. Acts beyond their stated objects may be void.’ So not all kinds of contract."},
{t:"Privity",s:"Class 5 · Class 6",q:"All but one of the following are exceptions to the rule of privity of contract",o:["Covenant running with land","Contract for the hire of a chattel","Leases","Insurance"],a:1,
 w:"Class 6 lists the exceptions as agency, trusteeship, assignment, covenants relating to land, third-party insurance, statutory exceptions and restrictive covenants on the use of land. Leases and land covenants are land matters; third-party insurance is expressly listed. A bare hire of a chattel is not on the list."},
{t:"Mistake",s:"Class 6",q:"The following are the types of mistake except",o:["common mistake","ordinary mistake","mutual mistake","unilateral mistake"],a:1,
 w:"Class 6: ‘Mistake in law manifests itself in three forms: common mistake, mutual mistake, and unilateral mistake.’ ‘Ordinary mistake’ is precisely what the law excludes: the Ladipo Market engine that simply disappointed you is not a mistake in law at all."},
{t:"Mistake",s:"Class 6",q:"……… mistake is where a party enters into a contract under the mistaken belief about some material fact, and the other party is aware of the mistake but still exploits the situation.",o:["common mistake","ordinary mistake","mutual mistake","unilateral mistake"],a:3,
 w:"Class 6: ‘Unilateral mistake occurs where only one party is mistaken, and the other party either knew or should have known about the mistake.’ The illustration is the solar-grid bid where a broken formula dropped a zero and the client clicked Accept knowing it was an error."},
{t:"Mistake",s:"Class 6",q:"………. mistake arises when both parties share the same mistake.",o:["common mistake","ordinary mistake","mutual mistake","unilateral mistake"],a:0,
 w:"Class 6: ‘Common mistake occurs where both parties share the same mistake… they are looking at the same thing, but they are both wrong about something crucial.’ The steel beams destroyed by fire the night before the contract are the example; the contract is void and neither party is at fault."},
{t:"Misrepresentation",s:"Class 7",q:"The following are the types of misrepresentation except …..",o:["Fraudulent misrepresentation","Innocent misrepresentation","Negligent misrepresentation","virtual misrepresentation"],a:3,
 w:"Class 7 gives three types only: fraudulent, innocent and negligent, each with its own remedy. There is no such category as virtual misrepresentation."},
{t:"Misrepresentation",s:"Class 7",q:"A misrepresentation is an ……… made by one party (to a contract) to the other before or at the time of contracting, with regard to some existing fact or to some past event which is one of the causes that induced the contract.",o:["quick statement","formal statement","untrue statement","none of the above"],a:2,
 w:"This is the Class 7 definition almost word for word: ‘an untrue statement made by one party to a contract, to the other, before or at the time of contracting, with regard to some existing fact or to some past event, which is one of the causes that induced the other party to enter into the contract.’"},
{t:"Misrepresentation",s:"Class 7 · Class 1",q:"Can misrepresentation be made by conduct?",o:["True","False","All of the above","None of the above"],a:0,
 w:"Class 1 establishes that intention can be inferred from conduct alone: the restaurant diner forms a contract without saying a word. A false impression created by conduct is treated the same way. Note the contrast with silence, which Class 7 says is generally NOT misrepresentation except in contracts of utmost good faith."},
{t:"Misrepresentation",s:"Class 7",q:"The following are the remedies available to an aggrieved party in the case of misrepresentation except",o:["Rescission","Damages","Indemnity","Confirmation"],a:3,
 w:"Class 7 gives rescission (restoring the status quo), damages (for fraudulent and negligent) and indemnity (equitable, for innocent). Confirmation is the opposite of a remedy: affirming the contract is a bar to rescission, as Q62 on this same paper confirms."},
{t:"Misrepresentation",s:"Class 7",q:"………..misrepresentation arises where the party making the statement has no intention to deceive.",o:["Fraudulent misrepresentation","Innocent misrepresentation","Negligent misrepresentation","virtual misrepresentation"],a:1,
 w:"Class 7: ‘Innocent misrepresentation arises where the party making the statement has no intention to deceive and has an honest belief in the truth of the statement.’ The supplier who believed a mislabelled machine was a 2024 model. Remedy: rescission plus indemnity, no damages."},
{t:"Duress",s:"Class 8 · Class 9",q:"……… is a common law doctrine covering situations where one party has coerced the other into a contract by actual physical force or threats.",o:["Undue influence","Fiduciary relationship","Duress","None of the above"],a:2,
 w:"Class 8: ‘If at the time you were making your acceptance, there was a gun behind you: that is duress.’ Class 9 gives the elements: threat to life, body or goods; lack of free will; illegitimate pressure; pressure that induced the contract."},
{t:"Duress",s:"Class 9",q:"Parties involved in ……… are parent and child, doctor and patient, solicitor and client and religious adviser and disciples.",o:["Duress","illegal contract","Undue influence","All of the above"],a:2,
 w:"Class 9 lists exactly these as the relationships where undue influence is presumed, adding trustee and beneficiary. The presumption still has to be tested: ‘A fiduciary relationship does not automatically prove undue influence.’"},
{t:"Illegality",s:"Class 8",q:"The effect of illegal contracts renders the contract ……",o:["voidable","rejectable","All of the above","none of the above"],a:3,
 w:"Class 8 puts illegal contracts under void, not voidable: ‘Void: The contract is void from inception. It can never be valid. There is an illegality in it. No court will enforce it.’ Voidable means the aggrieved party has a choice, which is not the position here. ‘Rejectable’ is not a legal category."},
{t:"Discharge",s:"Class 9",q:"The following except ………. are the ways a contract may be discharged",o:["discharge by performance","discharge by frustration","discharge by breach","discharge by error"],a:3,
 w:"Class 9 gives five modes: performance, agreement, breach, frustration and operation of law. There is no discharge by error; a mistake that operates at all renders the contract void from inception rather than discharging it."},
{t:"Discharge",s:"Class 9",q:"When after the formation of a valid contract, an event happens which makes the performance of contract impossible, the contract becomes",o:["Voidable","Void","Valid","Illegal"],a:1,
 w:"That is frustration, and Class 9 treats it as bringing the obligations to an end. Note the timing: an impossibility existing when the contract was made puts it under Class 8’s void contracts (‘Contracts to perform an impossible act’); one arising afterwards frustrates."},
{t:"Duress",s:"Class 9",q:"Diva tells Lan that she’ll sue him for every penny he’s worth, alleging food poisoning and unsanitary conditions, unless he agrees to sell his restaurant to her. Lan knows his restaurant is safe and clean, but he’s afraid of losing business due to Diva’s lawsuit. Lan agrees to the contract. Which of the following is true?",o:["This is a case of duress. The contract is voidable by Ryan.","The court will assume that this is a case of undue influence. Ryan will have to prove that he consented to the contract.","The court will assume that this is a case of undue influence. Roseanne will have to prove that Ryan freely and willfully entered the contract.","The court will assume that this is a legal contract unless both Roseanne and Ryan present evidence otherwise."],a:0,
 w:"Threatening baseless litigation to force a sale is illegitimate pressure, not legitimate negotiation, the distinction Class 9 draws for economic duress. Class 8: a contract signed under duress ‘is voidable at your option because the essential element of free consent was absent’. There is no relationship of trust here, so undue influence does not arise. (The option names do not match the stem; that is how the paper was printed.)"},
{t:"Misrepresentation",s:"Class 7",q:"The remedy available for negligent misrepresentation is the same as for Fraudulent misrepresentation.",o:["True","False","None of the above","Not sure"],a:0,
 w:"Class 7’s remedy table gives fraudulent → rescission + damages, and negligent → rescission + damages. Identical. Only innocent misrepresentation differs, taking rescission + indemnity with no damages."},
{t:"Discharge",s:"Class 9",q:"On the valid performance of contract, the contract is said to be discharged.",o:["True","False","None of the above","Not sure"],a:0,
 w:"Class 9: ‘Discharge by Performance: The parties completely perform their obligations… the contractor completes construction according to the contract, hands over the key… the contractor is discharged and gets paid.’"},
{t:"Discharge",s:"Class 9",q:"The discharge of contract means that the parties are no more liable under the contract.",o:["True","False","None of the above","Not sure"],a:0,
 w:"Class 9 opens the topic with exactly this: ‘Discharge of contract refers to the termination of contractual obligations. Everything that has a beginning has an end.’"},
{t:"Illegality",s:"Class 8",q:"An agreement to do an act impossible in itself, is ___________",o:["Void","Voidable","Valid","Illegal"],a:0,
 w:"Class 8 lists among void contracts: ‘Contracts to perform an impossible act: you cannot enforce rights in a void contract because the act itself is impossible.’ Void, and not necessarily illegal: Class 8 stresses that void contracts ‘do not necessarily involve criminal conduct’."},
{t:"Illegality",s:"Slide 1.2 · Class 8",q:"Paku promises to give Bat a dime bag of marijuana if Bat plays Paku a song on his guitar. Here, the consideration that Paku is offering, the marijuana, is illegal but the subject of the contract, the song, is not. This kind of contract is:",o:["Unenforceable","Enforceable","Enforceable but the courts can modify it so that the consideration will be legal","Voidable by Paku"],a:0,
 w:"Slide 1.2, rule 4 of consideration: ‘Consideration must not be illegal: the courts will not allow illegal or immoral considerations to succeed.’ And the court does not rewrite the parties’ bargain: Class 3 is explicit that ‘the aim of the court is not to rewrite the contract for the parties but to enforce it’, which rules out (c)."},
{t:"Illegality",s:"Class 8",q:"All contracts that involve an illegal act are unenforceable.",o:["True","False","All of the above","None of the above"],a:0,
 w:"Class 8 states it without qualification: ‘Ex turpi causa non oritur actio: no action arises from a dishonorable cause. Courts will refuse to enforce an illegal contract. No court will grant relief on an illegal contract.’ The election-rigging example works it through: both the ₦5m paid and the ₦5m owed are gone."},
{t:"Duress",s:"Class 9",q:"A party seeking to rely upon economic duress must establish that, in addition to the fact that he/she has no realistic alternative other than to enter into the contract in question, there is coercion of will that vitiates his/her consent.",o:["True","False","All of the above","None of the above"],a:0,
 w:"Class 9 gives lack of free will and illegitimate pressure as elements, and lists among the challenges of proving duress that ‘economic pressure is hard to distinguish from legitimate negotiation’, which is exactly why both limbs must be shown."},
{t:"Duress",s:"Class 9",q:"A presumption of undue influence arises once it is shown that the relationship between two parties falls within certain recognised relationships or, on the facts, constitutes a relationship of trust and confidence.",o:["True","False"],a:0,
 w:"Class 9: ‘Presumed undue influence: arises automatically from certain types of relationships where one party is in a position of trust or authority over the other.’ Contrast actual undue influence, where there is direct evidence of improper pressure."},
{t:"Remedies",s:"Class 7 · Class 9",q:"Which of the following is NOT Legal remedy for breach of contract?",o:["Damages","Specific Performance","Recession","Injunctions"],a:2,
 w:"Rescission (misspelt ‘Recession’) is not a remedy for breach at all. Class 9’s remedy table assigns it to ‘Misrepresentation, mistake’, and Class 7 explains it as restoring the parties to the position before the contract, which is not what an innocent party wants after a breach. Damages, specific performance and injunctions are all listed as responses to breach.",
 flag:"If ‘legal’ is read strictly as common law rather than equity, then specific performance and injunctions are equitable too and the question has three answers. The source-based reading above (rescission is tied to misrepresentation and mistake, not breach) is the one that leaves a single answer."},
{t:"Misrepresentation",s:"Class 7 · Class 8",q:"Misrepresentation in a contract makes the contract:",o:["Void","Illegal","Voidable","Unenforceable"],a:2,
 w:"Class 7 says the contract ‘can either be void or voidable’, and Class 8 supplies the distinction: voidable means ‘the contract exists but the aggrieved party has the option to either continue with it or set it aside’. That option is exactly what rescission for misrepresentation gives, so voidable is the answer."},
{t:"Remedies",s:"Class 7 · Class 9",q:"What does rescission of a contract mean?",o:["The contract is set aside and the parties are put back in the same position as if the contract had never been entered into.","The parties are put into the same position as if the contract had been completed.","Monetary compensation.","A false statement of fact."],a:0,
 w:"Class 7: ‘The purpose of rescission is to restore the parties to their status quo, the position they were in before the contract ever occurred.’ Option (b) describes the measure of contract damages, and (c) is damages itself."},
{t:"Terms",s:"Class 3",q:"Terms which are deemed to form part of the contract even though they may not have been specifically stated or agreed by the parties are called",o:["extreme terms","conduct terms","implied terms","express terms","non-specific terms"],a:2,
 w:"A repeat of Q12; the paper duplicates it. Implied terms come from the courts (officious bystander and business efficacy tests), from custom or usage, or from statute such as ss.12–15 of the Sale of Goods Act."},
{t:"Formation",s:"Class 1 · Slide 1.2",q:"One of the principles in Carlill v Carbolic Smoke Ball Co (1893) is that an offer can be made to",o:["an individual","group of individuals","the whole world","Nobody","all of the above."],a:2,
 w:"Class 1: ‘that is an example of a unilateral contract, a contract where only one person makes a promise to the whole world. Anybody can accept that promise.’ Slide 1.2 makes the same point: where an offer is made to the public, the offeror is willing to contract with any member of it who accepts."},
{t:"Capacity",s:"Class 5",q:"An illiterate person is any person",o:["who is not educated","who only has a school leaving certificate","who does not speak English","who is unable to read with understanding the contractual document","who does not understand the language of law"],a:3,
 w:"Class 5: ‘An illiterate is a person who cannot read or write in the language of the contract.’ The test is tied to the document, not to schooling generally, which is why the jurat requires the writer to read out and explain the whole contract."},
{t:"Formation",s:"Class 2 · Slide 1.2",q:"For the purpose of determining intention to create legal relationship, contracts are divided into…..",o:["general and specific agreements","civil and criminal agreements","domestic and commercial agreements","void and voidable agreements","classified and unclassified contract"],a:2,
 w:"Slide 1.2: ‘the courts classify agreements into social or domestic agreements and Commercial agreements.’ Domestic agreements are presumed not to be binding; commercial agreements are presumed to be."},
{t:"Capacity",s:"Class 4",q:"All except…………….contracts are valid and enforceable against an infant",o:["Contract of necessaries","Commercial contracts","Beneficial contract of service","All of the above"],a:1,
 w:"Class 4 gives exactly two binding categories: ‘(i) Contracts for Necessaries’ and ‘(ii) Beneficial Contracts of Service’. Ordinary commercial or trading contracts fall outside both."},
{t:"Capacity",s:"Class 4",q:"In determining what necessaries are in a particular case, the court will consider the:",o:["condition in life of the infant","the condition of the infants family","the life style of the infant","All of the above","options (a) and (c)"],a:4,
 w:"Class 4 defines necessaries as ‘goods suitable to the condition in life of the infant and to his actual requirements at the time of sale and delivery’, extending to items ‘appropriate to the infant’s financial and social status’. The test looks at the infant’s own condition and lifestyle, not the family’s."},
{t:"Capacity",s:"Class 4 · Class 5",q:"Where the goods are not necessary goods, contracts made by a mentally disordered person or intoxicated person is",o:["Void","Void ab initio","Voidable","Voided","Invalid"],a:2,
 w:"Class 4: such contracts are ‘prima facie valid’, and where the two limbs are proved (that he did not understand the nature of the contract and that the other party knew of his condition), ‘the contract becomes voidable and can be set aside at the option of the insane person’. Class 5 applies the same rule to a drunkard."},
{t:"Capacity",s:"Class 4 · Class 5",q:"Contracts made or ratified by a lunatic or intoxicated person during his lucid intervals are binding on him",o:["True","False","Except for Commercial contracts","Except for beneficial contracts of service"],a:0,
 w:"Class 4: ‘contracts entered into by a mentally disordered person during lucid intervals are valid and binding.’ Class 5 adds that a drunkard’s contract ‘can be expressly or impliedly ratified when the person returns to a state of soberness’."},
{t:"Privity",s:"Class 2 · Class 5",q:"For a person to be considered a party to a simple contract, the person must",o:["Sign the Contract","Provide consideration","Benefit from the contract","Be physically present when the agreement was made","All of the above"],a:1,
 w:"Class 2: ‘Consideration Must Move from the Promisee: the person who is seeking to enforce the promise must be the one who provided the consideration.’ That is the doctrinal root of privity, and it is why signing or merely benefiting is not enough."},
{t:"Privity",s:"Class 5 · Class 6",q:"All except ……… are some situations where a 3rd party may be enabled to bring an action in a contract that he is not privy to.",o:["Covenant concerning land","Covenant for the hire of chattel","Agency","Loan","Assignment"],a:3,
 w:"Class 6 lists agency, trusteeship, assignment, covenants relating to land, third-party insurance and statutory exceptions. A loan appears on no list of exceptions; the lender and borrower are the only parties to it.",
 flag:"Strictly two options fail: a bare hire of a chattel is not on the notes’ list either, and Q25 on this same paper treats it as the odd one out. Loan is the safer answer here because covenants restricting the use of a chattel do have some standing in the wider case law, whereas a loan has none."},
{t:"Misrepresentation",s:"Class 7 · Class 9",q:"Since an action for fraudulent misrepresentation is an action in tort rather than in contract, what is the aim of damages in fraudulent misrepresentation?",o:["To restore the injured party to the position in which he would have been if he had never entered into the contract.","To put the injured party, so far as money can do it, in the same position, as if the contract had been performed.","To give the injured party all that he is entitled to, in monetary form and otherwise","To punish the defaulting party for breaching the contract"],a:0,
 w:"Tort looks backwards to undo the wrong; contract looks forwards to the promised position. That is the same logic Class 7 applies to rescission, ‘restore the parties to their status quo’. Option (b) is the contract measure and (d) describes exemplary damages, which Class 9 treats as a separate head."},
{t:"Remedies",s:"Class 7",q:"Which one of options below is not a limit/bars to rescission?",o:["Affirmation of the contract","Restitutio in integrum","Contributory negligence","Lapse of substantial time"],a:2,
 w:"Affirmation, impossibility of restitutio in integrum and lapse of time all bar rescission. Class 7 makes affirmation the point of ‘Confirmation’ in Q32, and rescission depends on being able to return the parties to their original positions. Contributory negligence belongs to the law of torts, which Class 3 notes is ‘a different type of law’."},
{t:"Discharge",s:"Class 9",q:"One of the following is not a mode for discharge of contract",o:["Discharge by frustration","Discharge by agreement","Discharge by default","Discharge by performance"],a:2,
 w:"Class 9 names five modes: performance, agreement, breach, frustration and operation of law. ‘Default’ is not the term of art; the recognised head is breach, and only a fundamental breach discharges."},
{t:"Duress",s:"Class 8 · Class 9",q:"Mr. D borrowed N1,200,000 from Mr. C, he agreed to pay N100,000 monthly for 12 months. He skipped payment for the 7th month due to some medical problems. Mr. C’s son who felt people were always taking advantage of his father’s generosity met Mr. D and said to him “I know your type, you people always take advantage of my father’s generosity, but be warned that if you fail to make next month’s payment, then you will certainly not have any more hands to beg for money” This statement:",o:["Amounts to Duress","Does not amount to Duress","Amounts to undue influence","None of the above"],a:0,
 w:"Class 9 lists physical duress as a ‘threat of violence or bodily harm’, and the elements are met: a threat to the body, illegitimate pressure and pressure aimed at inducing performance. Undue influence requires a position of dominance or trust, which a creditor’s son does not have."},
{t:"Duress",s:"Class 1 · Class 9",q:"Lord Denning in Lloyd’s Bank Ltd v. Bundy categorized the doctrine of undue influence and related doctrines under one umbrella",o:["Vitiating elements by common law","Unfair terms in contract","Inequality of bargaining power","None of the above"],a:2,
 w:"Denning’s umbrella is the same concern Slide 1.1 raises about modern contracting, ‘Imbalance of bargaining power’, where goods are sold on a take-it-or-leave-it basis and the law intervenes to protect consumers, infants, illiterates and persons of unsound mind."},
{t:"Duress",s:"Class 8 · Class 9",q:"…. Is where a party who is in a position of trust, uses excessive pressure or his authority to abuse, betray or take advantage of the other party for his benefit to the extent that his free will is overcome.",o:["Duress","Undue influence","Excessive financial pressure","Extortion"],a:1,
 w:"Class 9: ‘Undue influence occurs when one party uses a position of dominance or trust to improperly influence another party’s decision.’ Class 8 draws the contrast with duress: no physical threat, just the silence and pressure of the chairman’s office."},
{t:"Illegality",s:"Class 8",q:"Illegal contracts may be categorized into",o:["Contracts rendered illegal or void by statutes and contracts prejudicial to public safety","Contracts rendered illegal or void by statutes and contracts prejudicial to administration of justice","Contracts rendered illegal or void by statutes and contracts rendered illegal or void by common law on grounds of public policy","All of the above"],a:2,
 w:"Class 8 defines an illegal contract as one involving ‘a crime, a civil wrong, or an act contrary to public policy, or which violates an explicit statutory provision’, that is, statutory illegality on one side and common-law public policy on the other. Prejudice to public safety or to justice are instances within the second head, not separate categories."},
{t:"Illegality",s:"Class 8",q:"Illegality in Contract Law usually imports",o:["Criminal liability","That a third party injured by the operation of the contract has a cause of action.","That the court will enforce such a contract","That the court will not enforce such a contract."],a:3,
 w:"Class 8: ‘Courts will refuse to enforce an illegal contract.’ And it is explicit that criminal liability is not the point: void and illegal contracts ‘do not necessarily involve criminal conduct’."},
{t:"Illegality",s:"Class 1 · Class 8",q:"When faced with a matter of illegality, the court will usually consider:",o:["The principle of sanctity of contract","The effect on innocent third parties","The principle of public policy","Options (a) and (c) above"],a:3,
 w:"The court balances the freedom-of-contract principle from Class 1 (‘whatever bargain you enter into, you must honour it’) against the public policy grounds in Class 8, including the need to ‘preserve judicial integrity’ so that courts are not instruments of illegality."},
{t:"Discharge",s:"Class 9",q:"A contract is said to be discharged when",o:["The rights and duties agreed in the contract have come to an end","The parties have fulfilled their contractual obligations to each other","When the contract has been terminated","All of the above"],a:3,
 w:"All three describe the same thing from different angles, and Class 9’s definition covers them: ‘Discharge of contract refers to the termination of contractual obligations. At what point does the contractual obligation come to an end?’"}
]};
